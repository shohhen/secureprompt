# On-prem overlay — air-gap overrides for docker-compose.yml.
# Usage: docker compose -f docker-compose.yml -f docker-compose.onprem.yml up
#
# This overlay:
#   - Pins image tags so no external registry pull happens at runtime.
#   - Sets pull_policy: never (images must be pre-loaded via `docker load`).
#   - Points API_URL at the internal Docker DNS name.
#   - Disables any external hostname references.

services:
  web:
    image: secureprompt/web:${SP_VERSION:-0.1.0}
    pull_policy: never
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080
      API_URL: http://api:8080
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

  # WS1-P0 role split: the one-shot migration step runs the API image with
  # `--migrate-only`. It must be pinned here too, or an air-gapped host falls
  # back to the base file's `build:` and has no registry to fetch from.
  db-migrate:
    image: secureprompt/api:${SP_VERSION:-0.1.0}
    pull_policy: never

  # WS6-5. secureprompt-ml was the biggest hole in this overlay: the base file
  # only has a `build:` for it, so an air-gapped host running
  # `docker compose -f docker-compose.yml -f docker-compose.onprem.yml up`
  # tried to COMPILE the sidecar -- which additionally needs
  # SECUREPROMPT_PINNED_MODEL_KEK, a secret that is not on that host.
  #
  # This image is the reason scripts/bundle-images.sh exists and treats it
  # separately: at 12.6 GB it is excluded from the CI `build` stage (it needs
  # the raw model DEK), so it is built and side-loaded out of band.
  secureprompt-ml:
    image: secureprompt/ml:${SP_VERSION:-0.1.0}
    pull_policy: never

  # Same problem, smaller: the chat UI is a `build:` of the SP-modified fork.
  librechat:
    image: secureprompt/librechat:${SP_VERSION:-0.1.0}
    pull_policy: never

  api:
    image: secureprompt/api:${SP_VERSION:-0.1.0}
    pull_policy: never

  worker:
    image: secureprompt/worker:${SP_VERSION:-0.1.0}
    pull_policy: never

  prometheus:
    image: prom/prometheus:v2.55.1
    pull_policy: never

  alertmanager:
    image: prom/alertmanager:v0.27.0
    pull_policy: never

  # WS6-5. These seven come from public registries in the base file and had NO
  # pull_policy at all here, so on an air-gapped host each one is a pull attempt
  # that hangs and then fails -- after `docker load` has already put the exact
  # image in the local store. `never` makes compose use what is there.
  postgres:
    pull_policy: never

  redis:
    pull_policy: never

  clickhouse:
    pull_policy: never

  qdrant:
    pull_policy: never

  grafana:
    pull_policy: never

  librechat-mongo:
    pull_policy: never

  librechat-nginx:
    pull_policy: never
