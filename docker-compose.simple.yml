services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secureprompt
      POSTGRES_PASSWORD: secureprompt
      POSTGRES_DB: secureprompt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # WS6-5 resource limits — see docker-compose.yml's `postgres` for why.
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }
        reservations: { cpus: "0.10", memory: 256m }

  redis:
    image: redis:7.4-alpine
    # WS6-5. Same --requirepass as the full appliance. This profile is for local
    # evaluation, but it still publishes 6379, and "it's only the eval profile"
    # is how an unauthenticated Redis ends up on a laptop on a corporate LAN.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env -- run scripts/init-env.sh, or e.g. openssl rand -hex 32}", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
        reservations: { cpus: "0.05", memory: 64m }

  # WS1-P0 role split — see docker-compose.yml's `db-migrate` for the full
  # reasoning. Short version: migrations need CREATE ON SCHEMA public and table
  # ownership; the serving role must have neither, because a NOBYPASSRLS role is
  # the only kind row-level security applies to. So they are two steps, and only
  # this one gets the owner credential.
  #
  # This profile has no healthchecks (deliberately — it is the cut-down one), so
  # the migration step retries instead of waiting on a condition.
  db-migrate:
    build:
      context: .
      dockerfile: secureprompt-api/Dockerfile
    command: ["--migrate-only"]
    # BOUNDED. This profile has no healthcheck, so `db-migrate` retries instead
    # of waiting on a condition — but an unbounded `on-failure` turns a genuine
    # failure (a wrong SECUREPROMPT_APP_DB_PASSWORD, a CREATE-on-public grant
    # the migration role cannot revoke) into a silent infinite loop while `api`
    # waits on `service_completed_successfully` with no timeout and nothing
    # surfaced. Five attempts, then stop and show the exit code.
    restart: on-failure:5
    environment:
      DATABASE_URL: postgres://secureprompt:secureprompt@postgres:5432/secureprompt
      SECUREPROMPT_APP_DB_PASSWORD: ${SECUREPROMPT_APP_DB_PASSWORD:?SECUREPROMPT_APP_DB_PASSWORD must be set in .env -- run scripts/init-env.sh, or e.g. openssl rand -hex 32}
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
        reservations: { cpus: "0.05", memory: 64m }
    depends_on:
      - postgres

  api:
    build:
      context: .
      dockerfile: secureprompt-api/Dockerfile
    environment:
      # RUNTIME role: NOSUPERUSER, NOBYPASSRLS, owns nothing.
      DATABASE_URL: postgres://secureprompt_app:${SECUREPROMPT_APP_DB_PASSWORD:?SECUREPROMPT_APP_DB_PASSWORD must be set in .env -- run scripts/init-env.sh, or e.g. openssl rand -hex 32}@postgres:5432/secureprompt
      REDIS_URL: redis://default:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env -- run scripts/init-env.sh, or e.g. openssl rand -hex 32}@redis:6379
      LOG_LEVEL: debug
      # WS2-3. This profile deliberately ships NO ML sidecar, so the gateway
      # has no NER coverage for any request. The product default is
      # `block` (fail closed, 503) and that is correct for a real
      # deployment — but here it would 503 every request out of the box with
      # no way back except an admin-JWT PUT /v1/secure-mode per workspace.
      #
      # This profile is for local evaluation, not production. It opts into
      # degraded operation explicitly and visibly: requests are answered
      # using the deterministic Rust detection floor only (PINFL, STIR, MFO,
      # passport, Uzcard, Humo, cards, emails, addresses — no NER), every
      # response carries `x-secureprompt-sidecar-degraded`, and every audit
      # row is marked `floor_only = true`.
      #
      # DO NOT copy this line into a production compose/Helm values file.
      # The full `docker-compose.yml` runs the ML sidecar and leaves the
      # fail-closed default in place.
      SECUREPROMPT_SIDECAR_UNAVAILABLE_DEFAULT: degrade_with_alert
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1g }
        reservations: { cpus: "0.10", memory: 192m }
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started

volumes:
  postgres_data:
