# SecurePrompt — build & push container images to the GitLab Container Registry.
#
# Trigger: manual only ("Run pipeline" in the GitLab UI or scheduled).
# Parallelism: each (service, arch) is its own job, so 7 services × 2 arches +
# sp-agent (amd64 only) = 15 build jobs that run concurrently across runners.
# A small manifest stage then stitches the per-arch tags into one multi-arch
# manifest per service.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   SP_LICENSE_DEPLOY_KEY  base64-encoded SSH private key with read access to
#                          the private `sp-license` gitlab.com repo. Required
#                          by all Rust services (api, worker, mcp, sp-agent).
#                          Generate: `base64 -w0 < ~/.ssh/id_ed25519`
#   NEXT_PUBLIC_API_URL    public API origin baked into the secureprompt-web
#                          browser bundle at build time (optional; defaults to
#                          http://localhost:8080 inside the Dockerfile).
#
# Runner requirements:
#   - A runner with `docker:27-dind` capability (privileged mode).
#   - Network egress to gitlab.com (for the sp-license git+ssh fetch).
#
# Known caveats:
#   - sp-agent is hardcoded to x86_64-unknown-linux-musl in its Dockerfile, so
#     only an amd64 image is produced. Add arm64-musl to the Dockerfile to
#     enable multi-arch for that service.
#   - secureprompt-ml requires `secureprompt-ml/model/model.safetensors.enc`
#     in the build context. Provide it via a pre-build step, LFS, or skip the
#     ml matrix entry until weights are wired up.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages:
  - build
  - manifest

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

default:
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=true"]
  before_script:
    - apk add --no-cache git openssh-client bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -n "${SP_LICENSE_DEPLOY_KEY:-}" ]; then
        echo "$SP_LICENSE_DEPLOY_KEY" | base64 -d > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
      fi
    - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts 2>/dev/null || true
    - eval "$(ssh-agent -s)"
    - if [ -f ~/.ssh/id_ed25519 ]; then ssh-add ~/.ssh/id_ed25519; fi
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker context create tls-env --docker "host=tcp://docker:2376,ca=/certs/client/ca.pem,cert=/certs/client/cert.pem,key=/certs/client/key.pem"
    - docker buildx create --use --name sp-builder --driver docker-container --bootstrap tls-env

build:
  stage: build
  parallel:
    matrix:
      - SERVICE:
          - secureprompt-api
          - secureprompt-worker
          - secureprompt-mcp
          - secureprompt-ml
          - secureprompt-web
          - secureprompt-marketing
          - secureprompt-chat
        PLATFORM: [linux/amd64, linux/arm64]
      - SERVICE: [sp-agent]
        PLATFORM: [linux/amd64]
  script:
    - |
      set -euo pipefail
      ARCH="${PLATFORM##*/}"
      IMAGE="${CI_REGISTRY_IMAGE}/${SERVICE}"

      case "$SERVICE" in
        secureprompt-chat) CONTEXT="$SERVICE" ;;
        *)                 CONTEXT="." ;;
      esac
      DOCKERFILE="${SERVICE}/Dockerfile"

      SSH_FLAG=""
      case "$SERVICE" in
        secureprompt-api|secureprompt-worker|secureprompt-mcp|sp-agent)
          SSH_FLAG="--ssh default=${SSH_AUTH_SOCK}"
          ;;
      esac

      BUILD_ARGS=""
      if [ "$SERVICE" = "secureprompt-web" ] && [ -n "${NEXT_PUBLIC_API_URL:-}" ]; then
        BUILD_ARGS="--build-arg NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
      fi

      echo "Building ${IMAGE}:${CI_COMMIT_SHORT_SHA}-${ARCH} for ${PLATFORM}"
      docker buildx build \
        --platform "$PLATFORM" \
        --file "$DOCKERFILE" \
        --tag "${IMAGE}:${CI_COMMIT_SHORT_SHA}-${ARCH}" \
        --cache-from "type=registry,ref=${IMAGE}:buildcache-${ARCH}" \
        --cache-to "type=registry,ref=${IMAGE}:buildcache-${ARCH},mode=max" \
        --provenance=false \
        $BUILD_ARGS $SSH_FLAG \
        --push \
        "$CONTEXT"

manifest:
  stage: manifest
  needs: [build]
  parallel:
    matrix:
      - SERVICE:
          - secureprompt-api
          - secureprompt-worker
          - secureprompt-mcp
          - secureprompt-ml
          - secureprompt-web
          - secureprompt-marketing
          - secureprompt-chat
          - sp-agent
  script:
    - |
      set -euo pipefail
      IMAGE="${CI_REGISTRY_IMAGE}/${SERVICE}"

      if [ "$SERVICE" = "sp-agent" ]; then
        SOURCES="${IMAGE}:${CI_COMMIT_SHORT_SHA}-amd64"
      else
        SOURCES="${IMAGE}:${CI_COMMIT_SHORT_SHA}-amd64 ${IMAGE}:${CI_COMMIT_SHORT_SHA}-arm64"
      fi

      echo "Publishing multi-arch manifest for ${IMAGE}"
      docker buildx imagetools create \
        --tag "${IMAGE}:${CI_COMMIT_SHORT_SHA}" \
        --tag "${IMAGE}:latest" \
        $SOURCES
