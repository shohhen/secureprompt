# SecurePrompt — build & push container images to the GitLab Container Registry.
#
# Trigger: manual only ("Run pipeline" in the GitLab UI or scheduled).
# Parallelism: one job per service, all running concurrently across runners
# (7 jobs total). Each image is tagged with the short commit SHA and `latest`.
#
# Platform: linux/amd64 only. arm64 was dropped because QEMU emulation on the
# shared amd64 runners blew past the 1h job timeout while compiling the Rust
# workspace. Reintroduce arm64 once native arm64 runners are available, or by
# adding Rust cross-compilation (e.g. `cargo zigbuild`) inside each Dockerfile.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   SP_LICENSE_DEPLOY_KEY  base64-encoded SSH private key with read access to
#                          the private `sp-license` gitlab.com repo. Required
#                          by all Rust services (api, worker, mcp, sp-agent).
#                          Generate: `base64 -w0 < ~/.ssh/id_ed25519`
#   NEXT_PUBLIC_API_URL    public API origin baked into the secureprompt-web
#                          browser bundle at build time (optional; defaults to
#                          http://localhost:8080 inside the Dockerfile).
#
# Runner requirements:
#   - A runner with `docker:27-dind` capability (privileged mode).
#   - Network egress to gitlab.com (for the sp-license git+ssh fetch).
#
# Known caveats:
#   - secureprompt-ml is intentionally excluded — its build needs the raw
#     model DEK + plaintext weights, which aren't wired up yet. Build/push
#     that image manually until weights distribution is decided.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages:
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

default:
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=true"]
  before_script:
    - apk add --no-cache git openssh-client bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -n "${SP_LICENSE_DEPLOY_KEY:-}" ]; then
        echo "$SP_LICENSE_DEPLOY_KEY" | base64 -d > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
      fi
    - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts 2>/dev/null || true
    - eval "$(ssh-agent -s)"
    - if [ -f ~/.ssh/id_ed25519 ]; then ssh-add ~/.ssh/id_ed25519; fi
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker context create tls-env --docker "host=tcp://docker:2376,ca=/certs/client/ca.pem,cert=/certs/client/cert.pem,key=/certs/client/key.pem"
    - docker buildx create --use --name sp-builder --driver docker-container --bootstrap tls-env

build:
  stage: build
  parallel:
    matrix:
      - SERVICE:
          - secureprompt-api
          - secureprompt-worker
          - secureprompt-mcp
          - secureprompt-web
          - secureprompt-chat
          - sp-agent
  script:
    - |
      set -euo pipefail
      IMAGE="${CI_REGISTRY_IMAGE}/${SERVICE}"

      case "$SERVICE" in
        secureprompt-chat) CONTEXT="$SERVICE" ;;
        *)                 CONTEXT="." ;;
      esac
      DOCKERFILE="${SERVICE}/Dockerfile"

      SSH_FLAG=""
      case "$SERVICE" in
        secureprompt-api|secureprompt-worker|secureprompt-mcp|sp-agent)
          SSH_FLAG="--ssh default=${SSH_AUTH_SOCK}"
          ;;
      esac

      BUILD_ARGS=""
      if [ "$SERVICE" = "secureprompt-web" ] && [ -n "${NEXT_PUBLIC_API_URL:-}" ]; then
        BUILD_ARGS="--build-arg NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
      fi

      echo "Building ${IMAGE}:${CI_COMMIT_SHORT_SHA} for linux/amd64"
      docker buildx build \
        --platform linux/amd64 \
        --file "$DOCKERFILE" \
        --tag "${IMAGE}:${CI_COMMIT_SHORT_SHA}" \
        --tag "${IMAGE}:latest" \
        --cache-from "type=registry,ref=${IMAGE}:buildcache" \
        --cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max" \
        --provenance=false \
        $BUILD_ARGS $SSH_FLAG \
        --push \
        "$CONTEXT"
