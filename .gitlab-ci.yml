# SecurePrompt — GitLab CI: quality gate, image publish, deploy.
#
# GitLab is the ONLY CI system for this repository. `git remote -v` resolves to
# gitlab.com:secureprompt/secure-prompt.git and nothing else; the four
# `.github/workflows/*.yml` files that used to sit alongside this one have been
# retired to `.github/workflows-retired/` because there is no GitHub remote for
# them to run on — see that directory's README for the evidence and for which
# of their gates were ported here.
#
# ---------------------------------------------------------------------------
# PIPELINE SHAPE
#
#   fmt ─┐
#   lint ─┼─> test ──> build (manual) ──> deploy (manual)
#        ─┘
#
#   fmt / lint / test  run on EVERY merge request and every push to the default
#                      branch. They are the gate. The `test` stage holds three
#                      jobs that run in parallel: `test` (the whole Rust
#                      suite), `test:rls-nonsuperuser`, and `bench` (WS2-5 —
#                      `cargo bench -- --test`, a compile-and-run check with
#                      no timing assertion; see the job's header).
#   build              publishes 6 images to the GitLab Container Registry.
#                      `needs:` the whole gate, so a red gate makes it
#                      un-runnable, and `when: manual` so it is never spent
#                      accidentally (each run is ~7 concurrent Rust/Node image
#                      builds).
#   deploy             helm rollout. `when: manual`, `needs: [build]`.
#
# WHAT ACTUALLY BLOCKS A MERGE — read this before assuming the file is enough.
#   This file can only make the pipeline RED. It cannot, on its own, stop
#   anyone clicking Merge. That requires a project setting no committed file
#   can carry:
#       Settings → Merge requests → Merge checks → "Pipelines must succeed"
#       (API: only_allow_merge_if_pipeline_succeeds = true)
#   plus protecting the default branch. Until a maintainer turns that on, the
#   gate is advisory. Do not describe it as enforced before checking.
#
# ---------------------------------------------------------------------------
# REQUIRED CI/CD VARIABLES (Settings → CI/CD → Variables)
#   SP_LICENSE_DEPLOY_KEY  base64 SSH private key with read access to the
#                          private sp-license repo
#                          (ssh://git@gitlab.com/secureprompt/admin.git, see
#                          workspace Cargo.toml). Every Rust job needs it —
#                          the gate jobs too, not just the image builds,
#                          because the dependency is in the build graph.
#                          Generate: `base64 -w0 < ~/.ssh/id_ed25519`
#   NEXT_PUBLIC_API_URL    public API origin baked into the secureprompt-web
#                          browser bundle (optional; the Dockerfile defaults to
#                          http://localhost:8080)
#   KUBE_CONFIG            base64 kubeconfig for the deploy job (protected)
#   HELM_RELEASE           helm release name for the deploy job
#   HELM_NAMESPACE         target namespace for the deploy job
#
#   Values are referenced by name only. Never inline a credential here.
#
# RUNNER REQUIREMENTS
#   - gate jobs:   any Linux docker-executor runner.
#   - build/deploy: a runner with `docker:27-dind` (privileged).
#   - Network egress to gitlab.com for the sp-license git+ssh fetch.
#
# KNOWN CAVEATS
#   - secureprompt-ml is intentionally excluded from `build` — it needs the raw
#     model DEK + plaintext weights, which aren't wired up. Build/push manually
#     until weights distribution is decided, passing the MODEL-KEK build-arg
#     from a protected CI var:
#       docker build --build-arg SECUREPROMPT_PINNED_MODEL_KEK=<value> ...
#   - linux/amd64 only. arm64 was dropped because QEMU emulation on the shared
#     amd64 runners blew past the 1h job timeout while compiling the Rust
#     workspace. Reintroduce it with native arm64 runners or `cargo zigbuild`.

stages:
  - fmt
  - lint
  - test
  # WS6-2. Container scanning and SBOM generation. Placed BEFORE `build` and
  # given `needs: []`, which looks backwards until you check what `build` is:
  # it is `when: manual`, and a manual job that nobody clicks leaves the
  # pipeline blocked, so anything in a LATER stage would simply never run. The
  # jobs here do not consume build's output anyway — see their headers — and
  # their `rules:` keep them off merge-request pipelines entirely, so they
  # cannot block a merge from a stage that precedes `build`.
  - scan
  - build
  - deploy

workflow:
  rules:
    # Avoid the classic duplicate-pipeline trap: when a branch has an open MR,
    # keep the merge-request pipeline and drop the redundant branch pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # WS6-2. ADDED, and without it "an SBOM per release" is unimplementable:
    # pushing a tag produced NO PIPELINE AT ALL before this line. A tag pipeline
    # has $CI_PIPELINE_SOURCE == "push" and an EMPTY $CI_COMMIT_BRANCH, so it
    # matched none of the rules above — rule 1 requires $CI_COMMIT_BRANCH to be
    # set, and rule 3 compares it against $CI_DEFAULT_BRANCH, which an empty
    # value never equals. Read out of the rules rather than assumed.
    - if: $CI_COMMIT_TAG

variables:
  # Rust toolchain: pinned to the version the gate was verified against
  # locally (rustc 1.89.0). Bump deliberately, not incidentally.
  RUST_IMAGE: "rust:1.89-bookworm"

  # Keep cargo's caches inside the build dir so GitLab's cache: can see them.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"

  # Service credentials. Synthetic, local to the ephemeral service container,
  # never reachable from outside the job — but still declared as variables so
  # there is one place to change them.
  POSTGRES_USER: "secureprompt"
  POSTGRES_PASSWORD: "secureprompt"
  POSTGRES_DB: "secureprompt"
  POSTGRES_HOST_AUTH_METHOD: "md5"

  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

# ===========================================================================
# Shared setup for the Rust gate jobs.
# ===========================================================================
.rust-gate:
  image: "$RUST_IMAGE"
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - .cargo/git/db
      - target/
  before_script:
    - |
      # sp-license is a private git+ssh dependency of every Rust crate here, so
      # even `cargo fmt --check` needs the key to resolve the build graph.
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      if [ -z "${SP_LICENSE_DEPLOY_KEY:-}" ]; then
        echo "SP_LICENSE_DEPLOY_KEY is not set — cargo cannot fetch sp-license." >&2
        echo "Set it in Settings -> CI/CD -> Variables (base64 of an SSH key)." >&2
        exit 1
      fi
      echo "$SP_LICENSE_DEPLOY_KEY" | base64 -d > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keyscan gitlab.com >> ~/.ssh/known_hosts 2>/dev/null || true
      eval "$(ssh-agent -s)"
      ssh-add ~/.ssh/id_ed25519
    - rustc --version && cargo --version

# ===========================================================================
# Stage: fmt
# ===========================================================================
fmt:
  extends: .rust-gate
  stage: fmt
  variables:
    SQLX_OFFLINE: "true"
  script:
    - rustup component add rustfmt
    # Ratcheting gate, NOT `cargo fmt --all --check`. There are 83 files of
    # pre-existing drift; a blanket check would be red on every MR from minute
    # one, which is how the previous CI got ignored. See the script header.
    - bash scripts/ci/fmt-gate.sh

# ===========================================================================
# Stage: lint
# ===========================================================================
clippy:
  extends: .rust-gate
  stage: lint
  variables:
    SQLX_OFFLINE: "true"
  script:
    - rustup component add clippy
    # NOT `cargo clippy -- -D warnings`: the workspace sets pedantic+nursery to
    # "warn" (631 warnings), so that command can never pass. This runs
    # -D warnings with pedantic/nursery advisory and a named debt allowlist.
    # See the script header.
    - bash scripts/ci/clippy-gate.sh

# ---------------------------------------------------------------------------
# Cheap repo-invariant checks, ported from the retired GitHub workflows. Each
# one was run locally on this branch and passes; see the WS6-1 report for the
# transcript. They cost seconds, so they get their own fast job rather than
# waiting behind the Rust toolchain.
#
# NOT PORTED, and deliberately so — each of these gates is RED on this branch
# today, so wiring it in would recreate the permanently-red pipeline this
# workstream exists to end. They are listed here rather than dropped silently:
#
#   check-openapi-codegen.sh   WIRED IN — see `openapi:codegen` below.
#                              WS6-1-FU3 is CLOSED: the `config` decision was
#                              made (restored, not deleted — the reasoning is
#                              in openapi.yaml above `ProviderResponse`), and
#                              the spec was reconciled with the router, so the
#                              check is green.                     → WS6-4
#   pnpm lint                  RED. 9 eslint errors (setState-in-effect ×4,
#                              no-unescaped-entities ×2, no-require-imports ×2,
#                              no-empty-object-type ×1).           → WS6-1-FU4
#   pnpm test --run            RED. 3 of 128 fail, all in
#                              tests/unit/keys.test.tsx
#                              (CreateKeyDialog).                  → WS6-1-FU4
#   check-bundle-size.sh /     Needs a full docker image build; belongs with
#   image-budget                the build stage, not the gate.     → WS6-1-FU5
# ---------------------------------------------------------------------------
static-checks:
  stage: lint
  image: node:22-bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git ripgrep
  script:
    # DASH-08: analytics.rs may only read from mart tables.
    - bash scripts/ci/check-mart-only.sh
    # POL-05: no dangerouslySetInnerHTML anywhere in the dashboard.
    - bash scripts/ci/check-no-dangerous-html.sh
    # AUTH-07: .env.example carries CHANGEME sentinels, never a real secret.
    - bash scripts/ci/check-env-hygiene.sh
    # MR1 I1. check-env-hygiene.sh guards .env.example; this guards the compose
    # files, where the actual defect was — a `${VAR:-...}` fallback meant the
    # boot gate never saw a placeholder because the var was never unset.
    - bash scripts/ci/check-compose-secret-fallbacks.sh
    # MR7 I1: no runbook may route an upgrade through `init-env.sh --force`,
    # which rotates the AES key for stored provider credentials.
    - bash scripts/ci/check-upgrade-path-is-nondestructive.sh
    # MR7 C4: all four "the runtime role is powerless" assertions must ask
    # about role membership, not just role attributes.
    - bash scripts/ci/check-powerless-assertions-agree.sh
    # Every mart consumed by the dashboard is declared as a dbt exposure.
    - node scripts/ci/check-mart-exposures.mjs
    - |
      # Bitnami images moved behind a paid subscription in August 2025; the
      # stack must stay on upstream official images. Ported from the retired
      # .github/workflows/image-size.yml, with `find` swapped for
      # `git ls-files`: the original walked the working tree and swept up
      # node_modules and sibling git worktrees, which overflows ARG_MAX
      # ("File name too long") on a developer machine. Tracked files only.
      set -euo pipefail
      found="$(git ls-files -z 'docker-compose*.yml' 'helm/**' '**/Dockerfile' 'Dockerfile' \
        | xargs -0 grep -nH 'bitnami/' || true)"
      if [ -n "$found" ]; then
        echo "ERROR: Bitnami images found:"; echo "$found"
        echo "Use upstream images instead."; exit 1
      fi
      echo "OK: no bitnami/ image references found."

# ---------------------------------------------------------------------------
# helm-render — MR7 C1/I2/M3. RENDER the chart and assert the properties the DB
# role split rests on.
#
# Three of the six Criticals in the MR7 review were found by rendering, not by
# reading: nothing in this pipeline had ever run `helm template`. `helm lint`
# exists only in the manual `deploy` job, and lint does not look at container
# fields at all, so "the owner credential reaches no serving container" was
# asserted in prose and checked by nobody.
#
# alpine/helm ships helm as the entrypoint; `entrypoint: [""]` gets a shell,
# and bash is a 2 MB apk away.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# WS6-2 — SUPPLY-CHAIN GATES.
#
# Four tools, three stages, one rule they all follow: each captured today's
# findings as an explicit, dated, reviewed baseline and fails only on NEW ones.
# That is the same ratchet `fmt` and `clippy` use, for the same reason —
# .github/workflows-retired/README documents four workflows abandoned once they
# went permanently red.
#
#   supply-chain:cargo-deny   lint   Rust deps      (deny.toml)
#   supply-chain:pip-audit    lint   Python deps    (scripts/ci/pip-audit-*)
#   supply-chain:gitleaks     lint   secrets        (.gitleaks.toml + baseline)
#   supply-chain:image-scan   scan   built images   (trivy, scheduled)
#   supply-chain:sbom         scan   SBOM artifacts (syft, tags only)
#
# The first three are cheap and run on every merge request. The last two need
# images that only the manual `build` stage produces — see their own headers
# for why they are scheduled/tag-triggered rather than per-MR.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# WS6-4 — OPENAPI CODEGEN DRIFT.
#
# `scripts/ci/check-openapi-codegen.sh` has existed, unwired, since VALIDATION
# 5-10-01: it was red because the spec and `api.gen.ts` had drifted over the
# provider `config` field. That is resolved (restored — the reasoning lives in
# openapi.yaml, above `ProviderResponse`), and this job runs it.
#
# TWO diffs, because `pnpm codegen` now writes TWO files. `openapi.json` is
# generated from `openapi.yaml` by `scripts/openapi-yaml-to-json.mjs`: the two
# had already drifted (`POST /v1/auth/register` was in the JSON and not the
# YAML) and they have different readers — openapi-typescript reads the YAML,
# and the gateway `include_str!`s the JSON and serves it at
# `GET /openapi.json`. The script only diffs `api.gen.ts`, and it belongs to
# another workstream's tree, so the second diff is asserted here instead.
#
# This is NOT the guard that the spec matches the router — that is
# `secureprompt-api/tests/openapi_router_contract.rs`, which reads the live
# `axum::Router` and runs inside the `test` job. This job only guarantees that
# the committed generated artifacts match the committed spec.
#
# DELIBERATELY ABSENT from `build`'s `needs:`, for the same reason
# `supply-chain:pip-audit` is: `pnpm install` must reach the npm registry and
# has no offline fallback, so listing it would let a registry outage make a
# hotfix image unbuildable. It still runs on every merge request and still
# reddens the pipeline.
# ---------------------------------------------------------------------------
openapi:codegen:
  stage: lint
  image: node:22-bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - corepack enable
    - corepack prepare pnpm@10.6.3 --activate
    - pnpm --dir secureprompt-web install --frozen-lockfile
  script:
    # Regenerates api.gen.ts + openapi.json and fails on any diff against the
    # committed copies.
    - bash scripts/ci/check-openapi-codegen.sh
    - |
      set -euo pipefail
      # The script above only diffs api.gen.ts. `pnpm codegen` also rewrites
      # openapi.json from openapi.yaml, so a hand-edited JSON — or a YAML edit
      # committed without regenerating — shows up here.
      if ! git diff --exit-code secureprompt-schemas/openapi/v1/openapi.json; then
        echo "ERROR: openapi.json is not what openapi.yaml generates." >&2
        echo "openapi.json is GENERATED. Edit openapi.yaml, then run" >&2
        echo "  pnpm --filter secureprompt-web codegen" >&2
        exit 1
      fi
      echo "openapi.json matches openapi.yaml"

supply-chain:cargo-deny:
  # extends .rust-gate for the SSH key, not for the compiler: cargo-deny never
  # builds the workspace, but it does run `cargo metadata`, which has to resolve
  # the private git+ssh sp-license dependency like every other Rust job here.
  extends: .rust-gate
  stage: lint
  variables:
    SQLX_OFFLINE: "true"
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - .cargo/git/db
      # NOT in .rust-gate's cache list: this job installs a binary into
      # CARGO_HOME/bin and would otherwise pay for it on every run.
      - .cargo/bin
  before_script:
    # .rust-gate's before_script is REPLACED by this one (YAML merge semantics),
    # so the ssh setup is repeated here rather than inherited. Keeping it inline
    # is deliberate: `!reference` is a GitLab-only YAML tag that ordinary yaml
    # parsers choke on, which the test:rls-nonsuperuser job already notes.
    - |
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      if [ -z "${SP_LICENSE_DEPLOY_KEY:-}" ]; then
        echo "SP_LICENSE_DEPLOY_KEY is not set — cargo cannot fetch sp-license." >&2
        exit 1
      fi
      echo "$SP_LICENSE_DEPLOY_KEY" | base64 -d > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keyscan gitlab.com >> ~/.ssh/known_hosts 2>/dev/null || true
      eval "$(ssh-agent -s)"
      ssh-add ~/.ssh/id_ed25519
    - |
      # Pinned to the version deny.toml's measurements were taken with. The
      # prebuilt musl binary is ~2 s; `cargo install` compiles for minutes, so
      # it is the FALLBACK, not the default — but it is present so that a moved
      # release URL degrades to "slow" instead of "red".
      #
      # HONESTY NOTE: neither path could be executed while authoring this job —
      # github.com was unreachable from the authoring machine (measured:
      # "Failed to connect to github.com port 443 after 2032 ms"), and there is
      # no runner to try it on. WATCH THE FIRST PIPELINE RUN. This is the same
      # caveat the test:ml-sidecar job carries about `pip install`.
      set -e
      DENY_VERSION="0.20.2"
      export PATH="$CARGO_HOME/bin:$PATH"
      if cargo deny --version 2>/dev/null | grep -q "$DENY_VERSION"; then
        echo "cargo-deny $DENY_VERSION already cached."
      else
        url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        mkdir -p "$CARGO_HOME/bin"
        if curl -fsSL "$url" | tar -xz -C /tmp --strip-components=1 2>/dev/null \
           && install -m 0755 /tmp/cargo-deny "$CARGO_HOME/bin/cargo-deny"; then
          echo "cargo-deny $DENY_VERSION installed from release binary."
        else
          echo "Release binary unavailable; falling back to cargo install."
          cargo install cargo-deny --locked --version "$DENY_VERSION"
        fi
      fi
    - cargo deny --version
  script:
    # advisories + bans + licenses + sources. The script degrades to the cached
    # advisory database (with a loud, dated warning) when github.com is
    # unreachable, rather than turning a third-party outage into a red MR —
    # see its header, and the `bench` job's, for that judgement.
    - bash scripts/ci/cargo-deny-gate.sh

# ---------------------------------------------------------------------------
# WS6-2 — pip-audit over the ML sidecar's dependency set.
#
# WHY python:3.11-slim AND NOT $RUST_IMAGE, measured rather than assumed:
# rust:1.89-bookworm ships python3 3.11.2 but NO pip and no `cryptography` —
# that measurement is already recorded twice in this repository, in
# scripts/ci/quarantine.tsv and in the test:audit-export-doc job header, and it
# is why those two doc-gate tests are #[ignore]d. pip-audit is a pip package,
# so it cannot be installed there without an apt detour.
#
# python:3.11-slim is not merely "an image with pip": it is the sidecar's OWN
# base image (secureprompt-ml/Dockerfile:41) and the image test:ml-sidecar
# already uses. Auditing on it resolves the same interpreter and the same
# wheels that ship, so the answer is about production rather than about the
# runner.
#
# NO torch INSTALL, deliberately. pip-audit RESOLVES requirements.txt; it does
# not install it. test:ml-sidecar needs the ~200 MB CPU torch wheel because it
# imports the app; this job needs none of it and finishes in a couple of
# minutes.
# ---------------------------------------------------------------------------
supply-chain:pip-audit:
  stage: lint
  image: "python:3.11-slim"
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  cache:
    key: "pip-audit-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    # Pinned: an unpinned auditor changes its own findings between runs, which
    # makes the baseline argue with a moving target.
    - python -m pip install --quiet pip-audit==2.10.1
  script:
    # Ratcheting gate against scripts/ci/pip-audit-baseline.tsv — 34 advisories
    # recorded on 2026-08-04, all four packages in the /v1/scan-file upload
    # path. Fails on a new advisory AND on a baseline row that was fixed, so
    # the list can only shrink. See the baseline's header: those 34 are a real
    # exposure with a scheduled fix order, not routine noise.
    - bash scripts/ci/pip-audit-gate.sh

# ---------------------------------------------------------------------------
# WS6-2 — gitleaks over the committed tree.
#
# WHY THIS ONE IS NOT DECORATIVE HERE: during this project an agent committed
# three freshly generated, working secrets into `.env.example` — while fixing
# the very defect that file exists to prevent. `.env.example` deliberately
# ships values the boot gate REJECTS, so a copied-but-unedited file fails
# loudly; replacing them with real values silently inverts that.
# scripts/ci/check-env-hygiene.sh (in static-checks) covers four NAMED keys.
# This is the general case, and it was proven against that exact defect —
# see the gate script's and the baseline's headers.
#
# IMAGE: the official gitleaks image, pinned. VERIFIED BY RUNNING IT, not
# assumed: `docker run zricethezav/gitleaks:v8.30.1` is Alpine and already
# carries bash, git and tar, but NOT python3, which the gate needs to parse
# gitleaks' JSON and hash secrets. `apk add python3` supplies 3.12.13. The
# whole job was executed locally in this image against this commit and
# reported `56 in baseline, 56 found now / OK: no new secrets`, extracting
# 5812 of 5812 tracked files.
#
# (On macOS the same run extracts 5800 — `git archive | tar` cannot write two
# graphify-out/ paths that differ only in case. CI is Linux and does not hit
# it; the gate warns and asserts a floor rather than trusting the count.)
#
# NO SSH KEY, no services, no cargo: this job reads files. ~10 s of work.
# ---------------------------------------------------------------------------
supply-chain:gitleaks:
  stage: lint
  image:
    name: zricethezav/gitleaks:v8.30.1
    # The image's entrypoint IS gitleaks; clear it to get a shell.
    entrypoint: [""]
  variables:
    # The gate runs `git archive HEAD`, so it needs real history, not the
    # default shallow-but-sufficient checkout — GIT_DEPTH 1 is fine for
    # `HEAD`, and this job deliberately does NOT scan history (see
    # .gitleaks.toml for why that is a refusal and not an oversight).
    GIT_DEPTH: "1"
  before_script:
    - apk add --no-cache python3 >/dev/null
    # GitLab checks out as a different uid than the image's user in some runner
    # configurations; without this, `git archive` fails with "detected dubious
    # ownership" and the gate would exit 2 rather than mis-report a clean tree.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    # Ratcheting gate against scripts/ci/gitleaks-baseline.tsv — 56 findings,
    # each one opened and read, none a live credential. Fails on a new secret
    # AND on a baseline row that stopped matching, so the list only shrinks.
    - bash scripts/ci/gitleaks-gate.sh

helm-render:
  stage: lint
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  before_script:
    - apk add --no-cache bash >/dev/null
  script:
    - bash scripts/ci/check-helm-migration-initcontainer.sh
    # MR1 C4. The reviewer first recorded the sidecar-token wiring as SOUND —
    # `grep` found the env var in all four templates — and withdrew it after
    # rendering: two of the four sat inside an `if .Values.license.enabled`
    # guard whose chart default is false. Same lesson as the check above, so
    # it runs in the same job.
    - bash scripts/ci/check-helm-sidecar-token.sh

# ===========================================================================
# Stage: test
# ===========================================================================
test:
  extends: .rust-gate
  stage: test
  # Service versions are pinned to match docker-compose.yml exactly. Testing
  # against a different Postgres/ClickHouse than you ship is how schema bugs
  # reach production green.
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: valkey/valkey:8.1.6-alpine
      alias: redis
    - name: clickhouse/clickhouse-server:24.8
      alias: clickhouse
  variables:
    # `#[sqlx::test]` provisions a throwaway database per test, so it needs a
    # role that can CREATE DATABASE and a base database to connect to.
    DATABASE_URL: "postgres://secureprompt:secureprompt@postgres:5432/secureprompt"
    REDIS_URL: "redis://redis:6379"
    CLICKHOUSE_URL: "http://clickhouse:8123"
    CLICKHOUSE_DB: "sp_analytics"
    CLICKHOUSE_SKIP_USER_SETUP: "1"
    # See RULE 3 in scripts/ci/rust-test-gate.sh. Raising this trades a little
    # wall-clock for sqlx test-database contention; it is not free.
    TEST_THREADS: "4"
  script:
    - |
      # ClickHouse DDL is applied by the WORKER at boot, not by the API
      # (secureprompt-worker/src/main.rs::apply_migrations). CI never starts a
      # worker, so without this the analytics suites run against an empty
      # database and fail on schema mismatch.
      bash scripts/ci/clickhouse-migrate.sh
    - |
      # The whole gate. Runs each test binary sequentially and reports all of
      # them; prints the quarantine manifest; fails on any suite failure or on
      # any skip that is not declared in scripts/ci/quarantine.tsv.
      #
      # Do NOT replace this with `cargo test --workspace`. Three measured
      # reasons, spelled out in full in the script header:
      #   1. cargo is fail-fast across test binaries and hid 3 of 6 real
      #      failures on this very workspace.
      #   2. bare `--no-fail-fast` runs the binaries concurrently, each
      #      #[sqlx::test] provisions its own database, and Postgres is
      #      exhausted — ~111 spurious PoolTimedOut failures.
      #   3. sqlx test-database creation contends across concurrent cargo
      #      processes: 2.00s passing alone vs 60.03s failing under
      #      contention, with Postgres at 6/100 connections.
      bash scripts/ci/rust-test-gate.sh

# ---------------------------------------------------------------------------
# WS2-5 — the deterministic detection floor's latency budget.
#
# WHAT RUNS HERE, AND WHAT DELIBERATELY DOES NOT
#
# This job runs `cargo bench -- --test`: criterion executes each benchmark
# for exactly ONE iteration, collects no statistics, and asserts nothing about
# time. It is a compile-and-run check that keeps `benches/detection_floor.rs`
# from bit-rotting, which is the failure mode a benchmark actually suffers —
# nobody notices a bench stopped building until the day they need a number.
#
# IT IS NOT A WALL-CLOCK GATE, and that is the whole design. A threshold like
# "the floor must take under 5 ms" measured by criterion on a shared runner
# goes red for a noisy neighbour, a cold cache or a slow spot instance. This
# repository has the receipts for what happens next: four .github/workflows
# were abandoned once they were permanently red (see
# .github/workflows-retired/README), and both `fmt` and `clippy` had to be
# rebuilt here as ratchets for the same reason. A flaky perf gate does not
# just fail to catch regressions — it teaches people to ignore the gates
# beside it.
#
# THE REAL REGRESSION GUARD IS IN THE `test` JOB.
# `secureprompt-api/tests/detection_floor_budget.rs` is picked up
# automatically by rust-test-gate.sh (it discovers tests/*.rs from the
# filesystem) and asserts things that do not depend on how fast the runner is:
#   * 40 KB of "1 " must not explode into thousands of detections — the
#     property MAX_IDENTIFIER_GROUPS provides, asserted as a COUNT. Verified
#     by raising the cap to 14, which reproduced the original incident at
#     20,467 detections in 1.96 s.
#   * detection count is linear, not quadratic, in document size.
#   * hostile input is bounded as a RATIO against a realistic document of the
#     same size, measured in the same process on the same machine — so runner
#     slowness cancels instead of causing false alarms.
#
# The actual latency curve, and the honest statement of the input size at
# which the 5 ms budget stops holding (~105 KiB; a 256 KiB document costs
# 11.6 ms p95), is produced by running `cargo bench` locally and is recorded
# in the WS2-5 report. A number that has to be interpreted belongs in a report
# a human reads, not in a pass/fail gate.
#
# No services: the bench touches no database, cache or analytics store, and
# SQLX_OFFLINE makes the compile-time query checks read the committed
# .sqlx metadata instead of a live Postgres.
# ---------------------------------------------------------------------------
bench:
  extends: .rust-gate
  stage: test
  variables:
    SQLX_OFFLINE: "true"
  script:
    - cargo bench -p secureprompt-api --bench detection_floor -- --test

# ---------------------------------------------------------------------------
# P2A — docs/audit-export-format.md, EXECUTED.
#
# That document is the only artifact in the product a third party uses to check
# our integrity claims: it carries the reference Python verifier a bank auditor
# runs against a signed export. Nothing tested it, and it drifted four times in
# one day. Executing it has already caught two bugs every Rust test missed —
# a chain seed that was not derivable from the published manifest (WS4-1) and a
# "three audited actions" claim made in six places when there were twelve (FU5).
#
# The two tests here extract that Python OUT OF THE MARKDOWN at run time — not
# a copy, which would drift and defeat the point — and run it against bytes a
# real export produced through the real job, then against nine tampered copies
# RE-SIGNED with the private key, so the chain and the manifest are what have to
# catch them rather than the signature.
#
# WHY THIS IS ITS OWN JOB. The verifier does its Ed25519 check with the Python
# `cryptography` package. Measured by running the image: rust:1.89-bookworm
# ships python3 3.11.2 and neither `cryptography` nor pip. The shared `test`
# job therefore cannot run these, and adding the package to `.rust-gate` would
# pay for it in `fmt`, `clippy` and `bench` too. So: one job, one apt install.
#
# THEY ARE NOT SKIPPED ANYWHERE. Both carry `#[ignore]` with a row in
# scripts/ci/quarantine.tsv, and this job runs them BY NAME with `--ignored`.
# `require_python()` in doc_gate.rs PANICS rather than skipping when the
# interpreter is missing, and the `grep -q "2 passed"` below is what stops a
# renamed test from matching nothing: `cargo test -- --exact <typo>` reports
# "0 passed" and exits 0, which is a green job that ran no tests.
#
# TO FOLD THIS BACK INTO `test`: put python3-cryptography in .rust-gate's
# before_script, drop both #[ignore]s and both quarantine rows, delete this job.
# ---------------------------------------------------------------------------
test:audit-export-doc:
  extends: .rust-gate
  stage: test
  # Both stores, because a genuine export reads BOTH planes: ClickHouse
  # `request_events` and the four Postgres control-plane audit tables. Versions
  # pinned to match the `test` job and docker-compose.yml.
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: clickhouse/clickhouse-server:24.8
      alias: clickhouse
  variables:
    DATABASE_URL: "postgres://secureprompt:secureprompt@postgres:5432/secureprompt"
    CLICKHOUSE_URL: "http://clickhouse:8123"
    CLICKHOUSE_DB: "sp_analytics"
    CLICKHOUSE_SKIP_USER_SETUP: "1"
  script:
    - |
      apt-get update -qq && apt-get install -y -qq python3 python3-cryptography
      # Prove the interpreter can do the one thing the document needs it for,
      # before spending ten minutes compiling.
      python3 -c "import cryptography.hazmat.primitives.asymmetric.ed25519" \
        && echo "OK: python3 can verify Ed25519"
    - bash scripts/ci/clickhouse-migrate.sh
    - |
      # `set -o pipefail` because of the `| tee` below: without it the
      # pipeline's status is tee's, which is always 0, and a failing cargo run
      # would report green. The grep guard would still catch it, but a job that
      # depends on two independent things going right is a job that goes wrong.
      set -o pipefail
      # BY NAME, not a bare `--ignored`: that would also sweep in the two
      # ClickHouse migration tests quarantined for an unrelated reason.
      cargo test -p secureprompt-worker --bins -- \
        --ignored --exact --test-threads=1 --nocapture \
        tasks::audit_export::tests::doc_gate::the_documents_verifier_accepts_a_real_export_and_rejects_every_tampering \
        tasks::audit_export::tests::doc_gate::the_documents_steps_5_and_6_are_load_bearing \
        | tee doc-gate.log
      # See the header: a filter that matches nothing is a green job that
      # verified nothing. `cargo test -- --exact <typo>` prints "0 passed" and
      # exits 0.
      grep -q "2 passed" doc-gate.log \
        || { echo "FAIL: the doc gate did not run both tests — were they renamed?"; exit 1; }

# ---------------------------------------------------------------------------
# The AUTH-05 gate, carried over from the retired .github/workflows/ci.yml.
#
# WHY A SEPARATE JOB WITH A DIFFERENT ROLE: the `test` job above connects as
# the compose-default `secureprompt` role, which the postgres image creates as
# a SUPERUSER — so it silently BYPASSES row-level security. That is the same
# blind spot every developer has locally, and it is not theoretical: migration
# 017's `UPDATE policy_rules ... WHERE name = 'Redact common PII'`
# (017_uzbek_identifier_policy_classes.sql:40) carries no workspace scoping. As
# a non-BYPASSRLS role that statement matches ZERO rows and still reports
# success. Only a NOSUPERUSER / NOBYPASSRLS role can catch that class of bug.
#
# WHY IT IS STILL SCOPED TO A LIST RATHER THAN THE WHOLE SUITE.
#
# The original reason was the keystone defect: `workspace_repo`'s default-rule
# seeding inserted into `policy_rules` — armed since 001_init.sql — with no
# `app.current_workspace_id` set, so registration itself was refused under a
# non-bypassing role. THAT IS NOW FIXED (`db::scope::arm_scope`, called inside
# the creating transaction once the workspace has an id). Re-measured after the
# fix, `cargo test -p secureprompt-api --lib` as `secureprompt_runner` went
# from 40 failures to 30, and `cross_tenant` from 4/5 to 5/5.
#
# WHAT KEEPS THE REST OUT, measured suite by suite as `secureprompt_runner`:
#   --lib                      695 passed / 30 failed
#   admin_audit                 1 passed / 22 failed
#   migration_017_023_rls       6 passed /  8 failed
#   rls_repo_scope              0 passed /  5 failed
#   raw_content_capture         1 passed /  7 failed
#   data_inventory             18 passed /  3 failed
# (`dashboard` — 43 failed — and `migration_020_rls` — 0/7 — were on this list
# and have since been converted; both are in the job below.)
#
# Every one of those residual failures is in TEST FIXTURE or VERIFICATION SQL,
# not in an application path: the suites were written on the assumption that
# `#[sqlx::test]`'s pool bypasses RLS, so they seed armed tables on a bare pool
# (`42501 new row violates row-level security policy for ...`) or read them back
# unscoped. Two shapes recur and both need care rather than bulk edits:
#   * a SEED on the bare pool. Loud: 42501, and it names the table.
#   * a VERIFICATION READ on the bare pool. NOT loud, and the dangerous one.
#     `assert_eq!(count, 0)` becomes satisfied by RLS filtering rather than by
#     the code being right — an absence-assertion that passes because the
#     reader cannot see. Converting a suite without auditing its
#     absence-assertions therefore makes the suite GREEN and EMPTY. Four such
#     were found in the dashboard conversion; three were demonstrated by
#     mutation to have passed while the fact they assert was false.
#
# So: widen this list as each suite's fixtures are converted to `begin_scoped`.
# Do not delete the job, and do not widen it to a suite that has not been run
# under the runner role first. Run any candidate under BOTH roles: an armed
# scope filters nothing under a superuser, so a premise that leans on RLS to do
# its filtering passes here and fails in `test:` (measured — see the two
# `migration_00x ... unscoped read` premises).
# ---------------------------------------------------------------------------
test:rls-nonsuperuser:
  extends: .rust-gate
  stage: test
  # redis + clickhouse are here for `dashboard`, which drives real HTTP handlers
  # (budget counters, session revocation watermarks) and the analytics reader.
  # Versions pinned to match docker-compose.yml and the `test:` job exactly.
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: valkey/valkey:8.1.6-alpine
      alias: redis
    - name: clickhouse/clickhouse-server:24.8
      alias: clickhouse
  variables:
    DATABASE_URL: "postgres://secureprompt_runner:secureprompt@postgres:5432/postgres"
    REDIS_URL: "redis://redis:6379"
    CLICKHOUSE_URL: "http://clickhouse:8123"
    CLICKHOUSE_DB: "sp_analytics"
    CLICKHOUSE_SKIP_USER_SETUP: "1"
    RUST_LOG: "info"
  # The role setup lives in `script`, not `before_script`, so this job inherits
  # .rust-gate's ssh setup unchanged. (GitLab's `!reference` would also work,
  # but it is a GitLab-only YAML tag that ordinary yaml parsers — and therefore
  # local validation — choke on.)
  script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - bash scripts/ci/create-nonsuperuser-role.sh
    # Same reason as the `test:` job: ClickHouse DDL is applied by the WORKER at
    # boot and CI never starts one, so `dashboard::analytics` and
    # `dashboard::rls::cross_tenant_matrix` would run against an empty database.
    - bash scripts/ci/clickhouse-migrate.sh
    # Each of these was RUN as `secureprompt_runner` and observed green before
    # being listed here. Separate invocations rather than one comma list, so a
    # failure names the suite that failed.
    - cargo test -p secureprompt-api --test cross_tenant -- --test-threads=4 --nocapture
    - cargo test -p secureprompt-api --test rls_workspace_creation -- --test-threads=4 --nocapture
    - cargo test -p secureprompt-api --test rls_call_site_guard -- --test-threads=4 --nocapture
    - cargo test -p secureprompt-api --test migration_020_rls -- --test-threads=4 --nocapture
    - cargo test -p secureprompt-api --test dashboard -- --test-threads=4 --nocapture
    # P1F. The suite that pins migration 033's invariant: an unscoped read of an
    # armed table is INVISIBLE, not `22P02 invalid input syntax for type uuid:
    # ""`. It builds its own probe connection from the test database's connect
    # options with the username replaced, so it exercises the same non-bypassing
    # role under EITHER `DATABASE_URL` — measured 5/5 here and 5/5 in `test:`,
    # and 1 passed / 4 failed identically under both before 033.
    - cargo test -p secureprompt-api --test rls_unscoped_read_is_invisible -- --test-threads=4 --nocapture
    # P1G. Both suites drive the code under test through a pool that asserts
    # `rolsuper = false`, `rolbypassrls = false` and
    # `row_security_active('api_keys')` on the wire, and every read-back arms
    # the scope, so they behave identically under this job's role and under
    # `test:`. Run under BOTH before being listed here, per the header above.
    - cargo test -p secureprompt-api --test rls_api_key_grace_window -- --test-threads=4 --nocapture
    # The only worker-crate entry. It is here rather than in `test:` alone
    # because the rotation-cleanup sweep it covers is the one whose allowlist
    # entry claimed it "fails CLOSED" and did not.
    - cargo test -p secureprompt-worker api_key_rotation -- --test-threads=4 --nocapture
    # P1H/P1J. The retention purge — capture purge and the FU4 device-context
    # scrub — now that both enumerate `workspaces` and work per tenant inside a
    # scope-armed, read-back transaction, and the suite's own fixtures seed and
    # verify through armed scopes. Measured 14 passed / 0 failed under
    # `secureprompt_runner` and 14 / 0 under the compose superuser, per the
    # header's "run any candidate under BOTH" rule.
    - cargo test -p secureprompt-worker retention_purge -- --test-threads=4 --nocapture
    # P1K. The MISSING-PREDICATE class: a query that is armed, read back, and
    # simply never filters. Both suites are built to mean something under
    # EITHER role rather than to pass under one — `rls_missing_predicate`
    # probes `pg_roles` on the wire and asserts the leak on a bypassing role
    # and the policy's masking on this one, and `tenancy_predicate_guard`
    # reads its tenant-table list from `information_schema.columns`. Listing
    # them here is what keeps the second arm honest: without a job that runs
    # as a non-bypassing role, the masking half is never exercised. Measured
    # 6 / 0 and 3 / 0 under BOTH roles.
    - cargo test -p secureprompt-api --test rls_missing_predicate -- --test-threads=4 --nocapture
    - cargo test -p secureprompt-api --test tenancy_predicate_guard -- --test-threads=4 --nocapture

# ---------------------------------------------------------------------------
# MR1 review I17 / WS6-1-FU6 — the Python sidecar's own tests, in the pipeline
# that actually runs.
#
# WHAT THE REVIEW SAID, AND WHERE IT WAS ACTUALLY WRONG
#
# I17 reported that `.github/workflows/ci.yml`'s `ml-sidecar` job ran a
# hand-listed five-file set which omitted `test_sidecar_route_auth.py` — the
# 349-line centrepiece of WS1-5 — plus `test_internal_model_key.py`,
# `test_secure_endpoints.py` and `test_scan_async.py`.
#
# The omission is real. The location is not: `.github/workflows/` no longer
# exists. WS6-1 moved all four workflows to `.github/workflows-retired/` and
# consolidated CI here, and that directory's README records that they had
# never run at all — there is no GitHub remote, only
# `git@gitlab.com:secureprompt/secure-prompt.git`. So the true state at the
# tip is worse than reported: it was not that four sidecar suites were left
# off a list, it is that THIS pipeline had no Python stage whatsoever, and
# every sidecar test — including the five that were listed — ran nowhere.
# `workflows-retired/README` books it as follow-up WS6-1-FU6.
#
# WHAT RUNS, AND WHY THIS LIST
#
# The five the retired job named, plus the four I17 names, plus the two model
# key-loading suites (`test_keyloader`, `test_weight_crypto`) — the sidecar
# half of the model-IP boundary `test_internal_model_key.py` guards from the
# HTTP side. All eleven need no model download; `ML_SKIP_MODEL_LOAD` covers
# the rest.
#
# It is a list rather than a bare `pytest tests/`, and that is a deliberate
# trade, not laziness: the directory also holds the datagen and NER-regression
# suites, several of which load real checkpoints or corpora that are not in
# the image. A job that is red for a missing 5 GB checkpoint teaches everyone
# to ignore the stage beside it — the exact failure `.github/workflows-retired/README`
# documents four times over. WIDEN THIS LIST as suites are confirmed to run
# without model weights; that is the same ratchet `fmt` and `clippy` use.
#
# VERIFICATION. The eleven files were run together locally at this commit
# against Python 3.12 with the repo's requirements installed:
# 57 passed, 2 skipped. The install steps below are ported verbatim from the
# retired workflow's `ml-sidecar` job rather than reinvented, because that is
# the closest thing to evidence that this dependency set resolves. The FIRST
# pipeline run of this job must be watched: no runner was available to prove
# `pip install` succeeds inside `python:3.11-slim`.
#
# NO SERVICES. Every test here is in-process: FastAPI's `TestClient` against
# the real ASGI app with heavy dependencies stubbed. Nothing touches Postgres,
# Redis, ClickHouse or Qdrant.
# ---------------------------------------------------------------------------
test:ml-sidecar:
  image: "python:3.11-slim"
  stage: test
  variables:
    # `app.main` raises at IMPORT when this is unset (WS1-5's fail-closed boot
    # gate), and `tests/conftest.py` sets a default with `os.environ.setdefault`
    # so collection-time imports survive. The auth suites override it per test
    # via monkeypatch + a fresh `app.main` import, so a value here cannot hide
    # an auth defect — see that conftest's comment.
    ML_SKIP_MODEL_LOAD: "true"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  cache:
    key:
      files:
        - secureprompt-ml/requirements.txt
    paths:
      - .cache/pip
  script:
    - cd secureprompt-ml
    - |
      # CPU torch FIRST, from PyTorch's own index: the default PyPI wheel
      # pulls the CUDA runtime (~2 GB) that this job can never use.
      python -m pip install --upgrade pip
      python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      python -m pip install -r requirements.txt
    - |
      python -m pytest \
        tests/test_sidecar_route_auth.py \
        tests/test_internal_model_key.py \
        tests/test_secure_endpoints.py \
        tests/test_scan_async.py \
        tests/test_keyloader.py \
        tests/test_weight_crypto.py \
        tests/test_batching.py \
        tests/test_compliance_map.py \
        tests/test_onnx_flag.py \
        tests/test_ready.py \
        tests/test_stateless.py \
        -v --tb=short

# ===========================================================================
# Stage: scan — WS6-2 container scanning and SBOM.
# ===========================================================================
#
# WS6-2 — trivy over the images this product runs on.
#
# WHY SCHEDULED AND NOT PER-MERGE-REQUEST. Container vulnerabilities are a
# function of TIME, not of a diff: an image that was clean when built acquires
# CVEs while it sits in the registry because someone else published an
# advisory. So a per-MR scan is both the wrong cadence — it would block a
# one-line docs change on a CVE disclosed overnight in a base image that MR
# never touched, the same "red through no fault of yours" shape that emptied
# .github/workflows-retired/ — and insufficient, because `build` is manual and
# weeks can pass between publishes with nothing scanning what is deployed.
#
# A failure here is a work item, not a blocked merge. The `rules:` below mean
# this job does not even EXIST on a merge-request pipeline.
#
# WHAT IT SCANS: scripts/ci/scan-images.txt — today the runtime BASE images,
# which for the distroless and scratch services are the entire OS surface of
# the published image. The published images themselves are one uncommented
# line away; that file's header carries the exact steps and the reason they
# are not enabled yet (no published image exists to baseline against, and a
# ratchet with no baseline fails on everything).
#
# MEASURED 2026-08-04 with trivy 0.73.0 — 28 fixable HIGH/CRITICAL:
# distroless 0, debian:bookworm-slim 0, node:22-alpine 8, node:20-alpine 20.
# Both gate directions were mutation-tested; see the WS6-2 report.
# ---------------------------------------------------------------------------
supply-chain:image-scan:
  stage: scan
  image:
    name: aquasec/trivy:0.73.0
    # The image's entrypoint IS trivy; clear it to get a shell.
    entrypoint: [""]
  # Independent of every other job — it consumes no build output.
  needs: []
  rules:
    # Scheduled is the intended cadence (configure a weekly schedule under
    # CI/CD -> Schedules). `web` so it can be run on demand after a base-image
    # bump without waiting a week.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: false
    - when: never
  before_script:
    # VERIFIED by running the image: aquasec/trivy:0.73.0 is Alpine with sh and
    # grep but NOT bash and NOT python3, both of which the gate needs. `apk add`
    # supplies bash 5.3.9 and python3 3.14.5.
    - apk add --no-cache bash python3 >/dev/null
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      # FULL reports — every severity, including the unfixed ones the gate
      # deliberately does not fail on. See the gate script's header for why
      # `--ignore-unfixed` is used and what it costs.
      - trivy-reports/
  script:
    - bash scripts/ci/image-scan-gate.sh

# ---------------------------------------------------------------------------
# WS6-2 — SBOM per release.
#
# WHAT TRIGGERS IT: a git TAG, i.e. a release, plus a manual `web` run for
# rehearsal. Note the `- if: $CI_COMMIT_TAG` line added to `workflow: rules:`
# at the top of this file — without it a tag push produced no pipeline at all,
# so this job could never have fired. That was true before this change and is
# the kind of thing a job header can assert falsely for a year.
#
# WHERE THE ARTIFACT GOES: GitLab job artifacts, `expire_in: never`. A release
# SBOM whose retention is 30 days is not a release SBOM — the question it
# answers ("what was in version X?") is asked years later, typically during an
# incident or a procurement review. This is the one artifact in this pipeline
# that must outlive its pipeline.
#   To attach them to the GitLab Release object as well, add a `release:` block
#   with release-cli once a release workflow exists; the files are already
#   named `secureprompt-<tag>.<format>.json` for that.
#
# TWO FORMATS: SPDX 2.3 (what compliance and procurement ask for by name) and
# CycloneDX 1.6 (what the security tooling ecosystem — dependency-track, grype,
# trivy — actually reads). Shipping one means answering the other by hand.
#
# IT ASSERTS ITS OWN OUTPUT, which is the whole reason this is a script and not
# a one-line syft invocation: `syft scan dir:<path>` against a wrong or empty
# path exits 0 and writes a VALID SPDX document containing zero packages.
# Shipping that as a compliance artifact is worse than shipping nothing,
# because it looks like an answer. Proven: run against an effectively empty
# tree the gate reports `only 0 packages catalogued` and fails.
#
# MEASURED 2026-08-04 with syft 1.50.0 on this commit: 4643 packages —
# 4036 npm, 495 rust-crate, 27 python. The 495 is cross-checked for EXACT
# equality against Cargo.lock's own `name =` count, so a broken cataloger
# cannot pass by emitting a plausible subset; planting one extra lockfile entry
# fails the job.
# ---------------------------------------------------------------------------
supply-chain:sbom:
  stage: scan
  image: "debian:bookworm-slim"
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: false
    - when: never
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git python3 ca-certificates
    - |
      # Pinned to the version the assertions were measured with. syft's own
      # installer is used rather than a hand-built URL so that a moved release
      # asset does not silently break the job.
      #
      # HONESTY NOTE: this install could not be executed while authoring —
      # github.com was unreachable from the authoring machine (measured:
      # "Failed to connect to github.com port 443 after 2032 ms") and there is
      # no runner to try it on. The GATE ITSELF was run, repeatedly, against
      # syft 1.50.0 installed locally. WATCH THE FIRST TAG PIPELINE. Same
      # caveat the test:ml-sidecar job carries about `pip install`.
      curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
        | sh -s -- -b /usr/local/bin v1.50.0
    - syft version
  artifacts:
    # A release SBOM must outlive its pipeline. See the header.
    expire_in: never
    when: on_success
    paths:
      - sbom/
  script:
    - bash scripts/ci/sbom-gate.sh

# ===========================================================================
# Stage: build — publish images to the GitLab Container Registry.
# ===========================================================================
.docker-publish:
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=true"]
  before_script:
    - apk add --no-cache git openssh-client bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -n "${SP_LICENSE_DEPLOY_KEY:-}" ]; then
        echo "$SP_LICENSE_DEPLOY_KEY" | base64 -d > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
      fi
    - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts 2>/dev/null || true
    - eval "$(ssh-agent -s)"
    - if [ -f ~/.ssh/id_ed25519 ]; then ssh-add ~/.ssh/id_ed25519; fi
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker context create tls-env --docker "host=tcp://docker:2376,ca=/certs/client/ca.pem,cert=/certs/client/cert.pem,key=/certs/client/key.pem"
    - docker buildx create --use --name sp-builder --driver docker-container --bootstrap tls-env

build:
  extends: .docker-publish
  stage: build
  # `needs:` is what makes the gate load-bearing: GitLab will not schedule this
  # job at all unless every listed job succeeded. Do not loosen it to
  # `needs: []` to "speed up a hotfix" — that is the whole gate.
  needs:
    - fmt
    - clippy
    - static-checks
    - test
    - test:rls-nonsuperuser
    - bench
    # WS6-2. Two of the three supply-chain gates are load-bearing for a
    # publish: you should not push an image built from a tree that leaks a
    # secret, or whose Rust dependencies pull from an unapproved git host.
    # Both are robust to a third-party outage — gitleaks needs no network at
    # all, and cargo-deny degrades to its cached advisory database with a loud
    # warning rather than failing.
    - supply-chain:cargo-deny
    - supply-chain:gitleaks
    # supply-chain:pip-audit is DELIBERATELY ABSENT from this list. It has no
    # offline fallback — pip-audit must reach pypi.org to resolve the tree, and
    # its own header says so — so listing it here would let a PyPI outage make
    # a hotfix image unbuildable. It still runs on every merge request and
    # still reddens the pipeline; it just does not hold the publish hostage to
    # someone else's uptime.
  rules:
    # Manual because each run is 6 concurrent image builds. Not `allow_failure`
    # — a started build that fails must fail the pipeline.
    - when: manual
      allow_failure: false
  parallel:
    matrix:
      - SERVICE:
          - secureprompt-api
          - secureprompt-worker
          - secureprompt-mcp
          - secureprompt-web
          - secureprompt-chat
          - sp-agent
  script:
    - |
      set -euo pipefail
      IMAGE="${CI_REGISTRY_IMAGE}/${SERVICE}"

      case "$SERVICE" in
        secureprompt-chat) CONTEXT="$SERVICE" ;;
        *)                 CONTEXT="." ;;
      esac
      DOCKERFILE="${SERVICE}/Dockerfile"

      SSH_FLAG=""
      case "$SERVICE" in
        secureprompt-api|secureprompt-worker|secureprompt-mcp|sp-agent)
          SSH_FLAG="--ssh default=${SSH_AUTH_SOCK}"
          ;;
      esac

      BUILD_ARGS=""
      if [ "$SERVICE" = "secureprompt-web" ] && [ -n "${NEXT_PUBLIC_API_URL:-}" ]; then
        BUILD_ARGS="--build-arg NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
      fi

      echo "Building ${IMAGE}:${CI_COMMIT_SHORT_SHA} for linux/amd64"
      docker buildx build \
        --platform linux/amd64 \
        --file "$DOCKERFILE" \
        --tag "${IMAGE}:${CI_COMMIT_SHORT_SHA}" \
        --tag "${IMAGE}:latest" \
        --cache-from "type=registry,ref=${IMAGE}:buildcache" \
        --cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max" \
        --provenance=false \
        $BUILD_ARGS $SSH_FLAG \
        --push \
        "$CONTEXT"

# ===========================================================================
# Stage: deploy — helm rollout of the images `build` just published.
# ===========================================================================
deploy:
  stage: deploy
  image: alpine/helm:3.16.2
  # Transitively requires the whole gate: build needs fmt+clippy+test, and
  # deploy needs build. A red gate leaves this job unschedulable.
  needs:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
    - when: never
  environment:
    name: production
  script:
    - |
      set -euo pipefail
      # Fail loudly on missing configuration rather than half-deploying.
      for var in KUBE_CONFIG HELM_RELEASE HELM_NAMESPACE; do
        eval "val=\${$var:-}"
        if [ -z "$val" ]; then
          echo "FAIL: $var is not set. Add it under Settings -> CI/CD -> Variables" >&2
          echo "      (protected + masked) before running deploy." >&2
          exit 1
        fi
      done
      mkdir -p ~/.kube
      echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
      chmod 600 ~/.kube/config

      helm lint helm/secureprompt
      # Render first: a chart that cannot template is caught before anything
      # is applied to the cluster.
      helm template "$HELM_RELEASE" helm/secureprompt \
        --namespace "$HELM_NAMESPACE" \
        --set image.tag="$CI_COMMIT_SHORT_SHA" > /dev/null

      helm upgrade --install "$HELM_RELEASE" helm/secureprompt \
        --namespace "$HELM_NAMESPACE" \
        --create-namespace \
        --set image.tag="$CI_COMMIT_SHORT_SHA" \
        --atomic \
        --timeout 10m
