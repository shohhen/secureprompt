# SecurePrompt — GitLab CI: quality gate, image publish, deploy.
#
# GitLab is the ONLY CI system for this repository. `git remote -v` resolves to
# gitlab.com:secureprompt/secure-prompt.git and nothing else; the four
# `.github/workflows/*.yml` files that used to sit alongside this one have been
# retired to `.github/workflows-retired/` because there is no GitHub remote for
# them to run on — see that directory's README for the evidence and for which
# of their gates were ported here.
#
# ---------------------------------------------------------------------------
# PIPELINE SHAPE
#
#   fmt ─┐
#   lint ─┼─> test ──> build (manual) ──> deploy (manual)
#        ─┘
#
#   fmt / lint / test  run on EVERY merge request and every push to the default
#                      branch. They are the gate. The `test` stage holds three
#                      jobs that run in parallel: `test` (the whole Rust
#                      suite), `test:rls-nonsuperuser`, and `bench` (WS2-5 —
#                      `cargo bench -- --test`, a compile-and-run check with
#                      no timing assertion; see the job's header).
#   build              publishes 6 images to the GitLab Container Registry.
#                      `needs:` the whole gate, so a red gate makes it
#                      un-runnable, and `when: manual` so it is never spent
#                      accidentally (each run is ~7 concurrent Rust/Node image
#                      builds).
#   deploy             helm rollout. `when: manual`, `needs: [build]`.
#
# WHAT ACTUALLY BLOCKS A MERGE — read this before assuming the file is enough.
#   This file can only make the pipeline RED. It cannot, on its own, stop
#   anyone clicking Merge. That requires a project setting no committed file
#   can carry:
#       Settings → Merge requests → Merge checks → "Pipelines must succeed"
#       (API: only_allow_merge_if_pipeline_succeeds = true)
#   plus protecting the default branch. Until a maintainer turns that on, the
#   gate is advisory. Do not describe it as enforced before checking.
#
# ---------------------------------------------------------------------------
# REQUIRED CI/CD VARIABLES (Settings → CI/CD → Variables)
#   SP_LICENSE_DEPLOY_KEY  base64 SSH private key with read access to the
#                          private sp-license repo
#                          (ssh://git@gitlab.com/secureprompt/admin.git, see
#                          workspace Cargo.toml). Every Rust job needs it —
#                          the gate jobs too, not just the image builds,
#                          because the dependency is in the build graph.
#                          Generate: `base64 -w0 < ~/.ssh/id_ed25519`
#   NEXT_PUBLIC_API_URL    public API origin baked into the secureprompt-web
#                          browser bundle (optional; the Dockerfile defaults to
#                          http://localhost:8080)
#   KUBE_CONFIG            base64 kubeconfig for the deploy job (protected)
#   HELM_RELEASE           helm release name for the deploy job
#   HELM_NAMESPACE         target namespace for the deploy job
#
#   Values are referenced by name only. Never inline a credential here.
#
# RUNNER REQUIREMENTS
#   - gate jobs:   any Linux docker-executor runner.
#   - build/deploy: a runner with `docker:27-dind` (privileged).
#   - Network egress to gitlab.com for the sp-license git+ssh fetch.
#
# KNOWN CAVEATS
#   - secureprompt-ml is intentionally excluded from `build` — it needs the raw
#     model DEK + plaintext weights, which aren't wired up. Build/push manually
#     until weights distribution is decided, passing the MODEL-KEK build-arg
#     from a protected CI var:
#       docker build --build-arg SECUREPROMPT_PINNED_MODEL_KEK=<value> ...
#   - linux/amd64 only. arm64 was dropped because QEMU emulation on the shared
#     amd64 runners blew past the 1h job timeout while compiling the Rust
#     workspace. Reintroduce it with native arm64 runners or `cargo zigbuild`.

stages:
  - fmt
  - lint
  - test
  - build
  - deploy

workflow:
  rules:
    # Avoid the classic duplicate-pipeline trap: when a branch has an open MR,
    # keep the merge-request pipeline and drop the redundant branch pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

variables:
  # Rust toolchain: pinned to the version the gate was verified against
  # locally (rustc 1.89.0). Bump deliberately, not incidentally.
  RUST_IMAGE: "rust:1.89-bookworm"

  # Keep cargo's caches inside the build dir so GitLab's cache: can see them.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"

  # Service credentials. Synthetic, local to the ephemeral service container,
  # never reachable from outside the job — but still declared as variables so
  # there is one place to change them.
  POSTGRES_USER: "secureprompt"
  POSTGRES_PASSWORD: "secureprompt"
  POSTGRES_DB: "secureprompt"
  POSTGRES_HOST_AUTH_METHOD: "md5"

  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

# ===========================================================================
# Shared setup for the Rust gate jobs.
# ===========================================================================
.rust-gate:
  image: "$RUST_IMAGE"
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - .cargo/git/db
      - target/
  before_script:
    - |
      # sp-license is a private git+ssh dependency of every Rust crate here, so
      # even `cargo fmt --check` needs the key to resolve the build graph.
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      if [ -z "${SP_LICENSE_DEPLOY_KEY:-}" ]; then
        echo "SP_LICENSE_DEPLOY_KEY is not set — cargo cannot fetch sp-license." >&2
        echo "Set it in Settings -> CI/CD -> Variables (base64 of an SSH key)." >&2
        exit 1
      fi
      echo "$SP_LICENSE_DEPLOY_KEY" | base64 -d > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keyscan gitlab.com >> ~/.ssh/known_hosts 2>/dev/null || true
      eval "$(ssh-agent -s)"
      ssh-add ~/.ssh/id_ed25519
    - rustc --version && cargo --version

# ===========================================================================
# Stage: fmt
# ===========================================================================
fmt:
  extends: .rust-gate
  stage: fmt
  variables:
    SQLX_OFFLINE: "true"
  script:
    - rustup component add rustfmt
    # Ratcheting gate, NOT `cargo fmt --all --check`. There are 83 files of
    # pre-existing drift; a blanket check would be red on every MR from minute
    # one, which is how the previous CI got ignored. See the script header.
    - bash scripts/ci/fmt-gate.sh

# ===========================================================================
# Stage: lint
# ===========================================================================
clippy:
  extends: .rust-gate
  stage: lint
  variables:
    SQLX_OFFLINE: "true"
  script:
    - rustup component add clippy
    # NOT `cargo clippy -- -D warnings`: the workspace sets pedantic+nursery to
    # "warn" (631 warnings), so that command can never pass. This runs
    # -D warnings with pedantic/nursery advisory and a named debt allowlist.
    # See the script header.
    - bash scripts/ci/clippy-gate.sh

# ---------------------------------------------------------------------------
# Cheap repo-invariant checks, ported from the retired GitHub workflows. Each
# one was run locally on this branch and passes; see the WS6-1 report for the
# transcript. They cost seconds, so they get their own fast job rather than
# waiting behind the Rust toolchain.
#
# NOT PORTED, and deliberately so — each of these gates is RED on this branch
# today, so wiring it in would recreate the permanently-red pipeline this
# workstream exists to end. They are listed here rather than dropped silently:
#
#   check-openapi-codegen.sh   RED. openapi.yaml on this branch gained
#                              `sidecar_unavailable` and dropped the provider
#                              `config` field, and api.gen.ts was never
#                              regenerated. Regenerating would remove `config`
#                              from the TS types, which is a product decision,
#                              not a CI one.                       → WS6-1-FU3
#   pnpm lint                  RED. 9 eslint errors (setState-in-effect ×4,
#                              no-unescaped-entities ×2, no-require-imports ×2,
#                              no-empty-object-type ×1).           → WS6-1-FU4
#   pnpm test --run            RED. 3 of 128 fail, all in
#                              tests/unit/keys.test.tsx
#                              (CreateKeyDialog).                  → WS6-1-FU4
#   check-bundle-size.sh /     Needs a full docker image build; belongs with
#   image-budget                the build stage, not the gate.     → WS6-1-FU5
# ---------------------------------------------------------------------------
static-checks:
  stage: lint
  image: node:22-bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git ripgrep
  script:
    # DASH-08: analytics.rs may only read from mart tables.
    - bash scripts/ci/check-mart-only.sh
    # POL-05: no dangerouslySetInnerHTML anywhere in the dashboard.
    - bash scripts/ci/check-no-dangerous-html.sh
    # AUTH-07: .env.example carries CHANGEME sentinels, never a real secret.
    - bash scripts/ci/check-env-hygiene.sh
    # Every mart consumed by the dashboard is declared as a dbt exposure.
    - node scripts/ci/check-mart-exposures.mjs
    - |
      # Bitnami images moved behind a paid subscription in August 2025; the
      # stack must stay on upstream official images. Ported from the retired
      # .github/workflows/image-size.yml, with `find` swapped for
      # `git ls-files`: the original walked the working tree and swept up
      # node_modules and sibling git worktrees, which overflows ARG_MAX
      # ("File name too long") on a developer machine. Tracked files only.
      set -euo pipefail
      found="$(git ls-files -z 'docker-compose*.yml' 'helm/**' '**/Dockerfile' 'Dockerfile' \
        | xargs -0 grep -nH 'bitnami/' || true)"
      if [ -n "$found" ]; then
        echo "ERROR: Bitnami images found:"; echo "$found"
        echo "Use upstream images instead."; exit 1
      fi
      echo "OK: no bitnami/ image references found."

# ===========================================================================
# Stage: test
# ===========================================================================
test:
  extends: .rust-gate
  stage: test
  # Service versions are pinned to match docker-compose.yml exactly. Testing
  # against a different Postgres/ClickHouse than you ship is how schema bugs
  # reach production green.
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: valkey/valkey:8.1.6-alpine
      alias: redis
    - name: clickhouse/clickhouse-server:24.8
      alias: clickhouse
  variables:
    # `#[sqlx::test]` provisions a throwaway database per test, so it needs a
    # role that can CREATE DATABASE and a base database to connect to.
    DATABASE_URL: "postgres://secureprompt:secureprompt@postgres:5432/secureprompt"
    REDIS_URL: "redis://redis:6379"
    CLICKHOUSE_URL: "http://clickhouse:8123"
    CLICKHOUSE_DB: "sp_analytics"
    CLICKHOUSE_SKIP_USER_SETUP: "1"
    # See RULE 3 in scripts/ci/rust-test-gate.sh. Raising this trades a little
    # wall-clock for sqlx test-database contention; it is not free.
    TEST_THREADS: "4"
  script:
    - |
      # ClickHouse DDL is applied by the WORKER at boot, not by the API
      # (secureprompt-worker/src/main.rs::apply_migrations). CI never starts a
      # worker, so without this the analytics suites run against an empty
      # database and fail on schema mismatch.
      bash scripts/ci/clickhouse-migrate.sh
    - |
      # The whole gate. Runs each test binary sequentially and reports all of
      # them; prints the quarantine manifest; fails on any suite failure or on
      # any skip that is not declared in scripts/ci/quarantine.tsv.
      #
      # Do NOT replace this with `cargo test --workspace`. Three measured
      # reasons, spelled out in full in the script header:
      #   1. cargo is fail-fast across test binaries and hid 3 of 6 real
      #      failures on this very workspace.
      #   2. bare `--no-fail-fast` runs the binaries concurrently, each
      #      #[sqlx::test] provisions its own database, and Postgres is
      #      exhausted — ~111 spurious PoolTimedOut failures.
      #   3. sqlx test-database creation contends across concurrent cargo
      #      processes: 2.00s passing alone vs 60.03s failing under
      #      contention, with Postgres at 6/100 connections.
      bash scripts/ci/rust-test-gate.sh

# ---------------------------------------------------------------------------
# WS2-5 — the deterministic detection floor's latency budget.
#
# WHAT RUNS HERE, AND WHAT DELIBERATELY DOES NOT
#
# This job runs `cargo bench -- --test`: criterion executes each benchmark
# for exactly ONE iteration, collects no statistics, and asserts nothing about
# time. It is a compile-and-run check that keeps `benches/detection_floor.rs`
# from bit-rotting, which is the failure mode a benchmark actually suffers —
# nobody notices a bench stopped building until the day they need a number.
#
# IT IS NOT A WALL-CLOCK GATE, and that is the whole design. A threshold like
# "the floor must take under 5 ms" measured by criterion on a shared runner
# goes red for a noisy neighbour, a cold cache or a slow spot instance. This
# repository has the receipts for what happens next: four .github/workflows
# were abandoned once they were permanently red (see
# .github/workflows-retired/README), and both `fmt` and `clippy` had to be
# rebuilt here as ratchets for the same reason. A flaky perf gate does not
# just fail to catch regressions — it teaches people to ignore the gates
# beside it.
#
# THE REAL REGRESSION GUARD IS IN THE `test` JOB.
# `secureprompt-api/tests/detection_floor_budget.rs` is picked up
# automatically by rust-test-gate.sh (it discovers tests/*.rs from the
# filesystem) and asserts things that do not depend on how fast the runner is:
#   * 40 KB of "1 " must not explode into thousands of detections — the
#     property MAX_IDENTIFIER_GROUPS provides, asserted as a COUNT. Verified
#     by raising the cap to 14, which reproduced the original incident at
#     20,467 detections in 1.96 s.
#   * detection count is linear, not quadratic, in document size.
#   * hostile input is bounded as a RATIO against a realistic document of the
#     same size, measured in the same process on the same machine — so runner
#     slowness cancels instead of causing false alarms.
#
# The actual latency curve, and the honest statement of the input size at
# which the 5 ms budget stops holding (~105 KiB; a 256 KiB document costs
# 11.6 ms p95), is produced by running `cargo bench` locally and is recorded
# in the WS2-5 report. A number that has to be interpreted belongs in a report
# a human reads, not in a pass/fail gate.
#
# No services: the bench touches no database, cache or analytics store, and
# SQLX_OFFLINE makes the compile-time query checks read the committed
# .sqlx metadata instead of a live Postgres.
# ---------------------------------------------------------------------------
bench:
  extends: .rust-gate
  stage: test
  variables:
    SQLX_OFFLINE: "true"
  script:
    - cargo bench -p secureprompt-api --bench detection_floor -- --test

# ---------------------------------------------------------------------------
# P2A — docs/audit-export-format.md, EXECUTED.
#
# That document is the only artifact in the product a third party uses to check
# our integrity claims: it carries the reference Python verifier a bank auditor
# runs against a signed export. Nothing tested it, and it drifted four times in
# one day. Executing it has already caught two bugs every Rust test missed —
# a chain seed that was not derivable from the published manifest (WS4-1) and a
# "three audited actions" claim made in six places when there were twelve (FU5).
#
# The two tests here extract that Python OUT OF THE MARKDOWN at run time — not
# a copy, which would drift and defeat the point — and run it against bytes a
# real export produced through the real job, then against nine tampered copies
# RE-SIGNED with the private key, so the chain and the manifest are what have to
# catch them rather than the signature.
#
# WHY THIS IS ITS OWN JOB. The verifier does its Ed25519 check with the Python
# `cryptography` package. Measured by running the image: rust:1.89-bookworm
# ships python3 3.11.2 and neither `cryptography` nor pip. The shared `test`
# job therefore cannot run these, and adding the package to `.rust-gate` would
# pay for it in `fmt`, `clippy` and `bench` too. So: one job, one apt install.
#
# THEY ARE NOT SKIPPED ANYWHERE. Both carry `#[ignore]` with a row in
# scripts/ci/quarantine.tsv, and this job runs them BY NAME with `--ignored`.
# `require_python()` in doc_gate.rs PANICS rather than skipping when the
# interpreter is missing, and the `grep -q "2 passed"` below is what stops a
# renamed test from matching nothing: `cargo test -- --exact <typo>` reports
# "0 passed" and exits 0, which is a green job that ran no tests.
#
# TO FOLD THIS BACK INTO `test`: put python3-cryptography in .rust-gate's
# before_script, drop both #[ignore]s and both quarantine rows, delete this job.
# ---------------------------------------------------------------------------
test:audit-export-doc:
  extends: .rust-gate
  stage: test
  # Both stores, because a genuine export reads BOTH planes: ClickHouse
  # `request_events` and the four Postgres control-plane audit tables. Versions
  # pinned to match the `test` job and docker-compose.yml.
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: clickhouse/clickhouse-server:24.8
      alias: clickhouse
  variables:
    DATABASE_URL: "postgres://secureprompt:secureprompt@postgres:5432/secureprompt"
    CLICKHOUSE_URL: "http://clickhouse:8123"
    CLICKHOUSE_DB: "sp_analytics"
    CLICKHOUSE_SKIP_USER_SETUP: "1"
  script:
    - |
      apt-get update -qq && apt-get install -y -qq python3 python3-cryptography
      # Prove the interpreter can do the one thing the document needs it for,
      # before spending ten minutes compiling.
      python3 -c "import cryptography.hazmat.primitives.asymmetric.ed25519" \
        && echo "OK: python3 can verify Ed25519"
    - bash scripts/ci/clickhouse-migrate.sh
    - |
      # `set -o pipefail` because of the `| tee` below: without it the
      # pipeline's status is tee's, which is always 0, and a failing cargo run
      # would report green. The grep guard would still catch it, but a job that
      # depends on two independent things going right is a job that goes wrong.
      set -o pipefail
      # BY NAME, not a bare `--ignored`: that would also sweep in the two
      # ClickHouse migration tests quarantined for an unrelated reason.
      cargo test -p secureprompt-worker --bins -- \
        --ignored --exact --test-threads=1 --nocapture \
        tasks::audit_export::tests::doc_gate::the_documents_verifier_accepts_a_real_export_and_rejects_every_tampering \
        tasks::audit_export::tests::doc_gate::the_documents_steps_5_and_6_are_load_bearing \
        | tee doc-gate.log
      # See the header: a filter that matches nothing is a green job that
      # verified nothing. `cargo test -- --exact <typo>` prints "0 passed" and
      # exits 0.
      grep -q "2 passed" doc-gate.log \
        || { echo "FAIL: the doc gate did not run both tests — were they renamed?"; exit 1; }

# ---------------------------------------------------------------------------
# The AUTH-05 gate, carried over from the retired .github/workflows/ci.yml.
#
# WHY A SEPARATE JOB WITH A DIFFERENT ROLE: the `test` job above connects as
# the compose-default `secureprompt` role, which the postgres image creates as
# a SUPERUSER — so it silently BYPASSES row-level security. That is the same
# blind spot every developer has locally, and it is not theoretical: migration
# 017's `UPDATE policy_rules ... WHERE name = 'Redact common PII'`
# (017_uzbek_identifier_policy_classes.sql:40) carries no workspace scoping. As
# a non-BYPASSRLS role that statement matches ZERO rows and still reports
# success. Only a NOSUPERUSER / NOBYPASSRLS role can catch that class of bug.
#
# WHY IT IS STILL SCOPED TO A LIST RATHER THAN THE WHOLE SUITE.
#
# The original reason was the keystone defect: `workspace_repo`'s default-rule
# seeding inserted into `policy_rules` — armed since 001_init.sql — with no
# `app.current_workspace_id` set, so registration itself was refused under a
# non-bypassing role. THAT IS NOW FIXED (`db::scope::arm_scope`, called inside
# the creating transaction once the workspace has an id). Re-measured after the
# fix, `cargo test -p secureprompt-api --lib` as `secureprompt_runner` went
# from 40 failures to 30, and `cross_tenant` from 4/5 to 5/5.
#
# WHAT KEEPS THE REST OUT, measured suite by suite as `secureprompt_runner`:
#   --lib                      695 passed / 30 failed
#   admin_audit                 1 passed / 22 failed
#   migration_017_023_rls       6 passed /  8 failed
#   rls_repo_scope              0 passed /  5 failed
#   raw_content_capture         1 passed /  7 failed
#   data_inventory             18 passed /  3 failed
# (`dashboard` — 43 failed — and `migration_020_rls` — 0/7 — were on this list
# and have since been converted; both are in the job below.)
#
# Every one of those residual failures is in TEST FIXTURE or VERIFICATION SQL,
# not in an application path: the suites were written on the assumption that
# `#[sqlx::test]`'s pool bypasses RLS, so they seed armed tables on a bare pool
# (`42501 new row violates row-level security policy for ...`) or read them back
# unscoped. Two shapes recur and both need care rather than bulk edits:
#   * a SEED on the bare pool. Loud: 42501, and it names the table.
#   * a VERIFICATION READ on the bare pool. NOT loud, and the dangerous one.
#     `assert_eq!(count, 0)` becomes satisfied by RLS filtering rather than by
#     the code being right — an absence-assertion that passes because the
#     reader cannot see. Converting a suite without auditing its
#     absence-assertions therefore makes the suite GREEN and EMPTY. Four such
#     were found in the dashboard conversion; three were demonstrated by
#     mutation to have passed while the fact they assert was false.
#
# So: widen this list as each suite's fixtures are converted to `begin_scoped`.
# Do not delete the job, and do not widen it to a suite that has not been run
# under the runner role first. Run any candidate under BOTH roles: an armed
# scope filters nothing under a superuser, so a premise that leans on RLS to do
# its filtering passes here and fails in `test:` (measured — see the two
# `migration_00x ... unscoped read` premises).
# ---------------------------------------------------------------------------
test:rls-nonsuperuser:
  extends: .rust-gate
  stage: test
  # redis + clickhouse are here for `dashboard`, which drives real HTTP handlers
  # (budget counters, session revocation watermarks) and the analytics reader.
  # Versions pinned to match docker-compose.yml and the `test:` job exactly.
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: valkey/valkey:8.1.6-alpine
      alias: redis
    - name: clickhouse/clickhouse-server:24.8
      alias: clickhouse
  variables:
    DATABASE_URL: "postgres://secureprompt_runner:secureprompt@postgres:5432/postgres"
    REDIS_URL: "redis://redis:6379"
    CLICKHOUSE_URL: "http://clickhouse:8123"
    CLICKHOUSE_DB: "sp_analytics"
    CLICKHOUSE_SKIP_USER_SETUP: "1"
    RUST_LOG: "info"
  # The role setup lives in `script`, not `before_script`, so this job inherits
  # .rust-gate's ssh setup unchanged. (GitLab's `!reference` would also work,
  # but it is a GitLab-only YAML tag that ordinary yaml parsers — and therefore
  # local validation — choke on.)
  script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - bash scripts/ci/create-nonsuperuser-role.sh
    # Same reason as the `test:` job: ClickHouse DDL is applied by the WORKER at
    # boot and CI never starts one, so `dashboard::analytics` and
    # `dashboard::rls::cross_tenant_matrix` would run against an empty database.
    - bash scripts/ci/clickhouse-migrate.sh
    # Each of these was RUN as `secureprompt_runner` and observed green before
    # being listed here. Separate invocations rather than one comma list, so a
    # failure names the suite that failed.
    - cargo test -p secureprompt-api --test cross_tenant -- --test-threads=4 --nocapture
    - cargo test -p secureprompt-api --test rls_workspace_creation -- --test-threads=4 --nocapture
    - cargo test -p secureprompt-api --test rls_call_site_guard -- --test-threads=4 --nocapture
    - cargo test -p secureprompt-api --test migration_020_rls -- --test-threads=4 --nocapture
    - cargo test -p secureprompt-api --test dashboard -- --test-threads=4 --nocapture
    # P1F. The suite that pins migration 033's invariant: an unscoped read of an
    # armed table is INVISIBLE, not `22P02 invalid input syntax for type uuid:
    # ""`. It builds its own probe connection from the test database's connect
    # options with the username replaced, so it exercises the same non-bypassing
    # role under EITHER `DATABASE_URL` — measured 5/5 here and 5/5 in `test:`,
    # and 1 passed / 4 failed identically under both before 033.
    - cargo test -p secureprompt-api --test rls_unscoped_read_is_invisible -- --test-threads=4 --nocapture
    # P1G. Both suites drive the code under test through a pool that asserts
    # `rolsuper = false`, `rolbypassrls = false` and
    # `row_security_active('api_keys')` on the wire, and every read-back arms
    # the scope, so they behave identically under this job's role and under
    # `test:`. Run under BOTH before being listed here, per the header above.
    - cargo test -p secureprompt-api --test rls_api_key_grace_window -- --test-threads=4 --nocapture
    # The only worker-crate entry. It is here rather than in `test:` alone
    # because the rotation-cleanup sweep it covers is the one whose allowlist
    # entry claimed it "fails CLOSED" and did not.
    - cargo test -p secureprompt-worker api_key_rotation -- --test-threads=4 --nocapture

# ===========================================================================
# Stage: build — publish images to the GitLab Container Registry.
# ===========================================================================
.docker-publish:
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=true"]
  before_script:
    - apk add --no-cache git openssh-client bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -n "${SP_LICENSE_DEPLOY_KEY:-}" ]; then
        echo "$SP_LICENSE_DEPLOY_KEY" | base64 -d > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
      fi
    - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts 2>/dev/null || true
    - eval "$(ssh-agent -s)"
    - if [ -f ~/.ssh/id_ed25519 ]; then ssh-add ~/.ssh/id_ed25519; fi
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker context create tls-env --docker "host=tcp://docker:2376,ca=/certs/client/ca.pem,cert=/certs/client/cert.pem,key=/certs/client/key.pem"
    - docker buildx create --use --name sp-builder --driver docker-container --bootstrap tls-env

build:
  extends: .docker-publish
  stage: build
  # `needs:` is what makes the gate load-bearing: GitLab will not schedule this
  # job at all unless every listed job succeeded. Do not loosen it to
  # `needs: []` to "speed up a hotfix" — that is the whole gate.
  needs:
    - fmt
    - clippy
    - static-checks
    - test
    - test:rls-nonsuperuser
    - bench
  rules:
    # Manual because each run is 6 concurrent image builds. Not `allow_failure`
    # — a started build that fails must fail the pipeline.
    - when: manual
      allow_failure: false
  parallel:
    matrix:
      - SERVICE:
          - secureprompt-api
          - secureprompt-worker
          - secureprompt-mcp
          - secureprompt-web
          - secureprompt-chat
          - sp-agent
  script:
    - |
      set -euo pipefail
      IMAGE="${CI_REGISTRY_IMAGE}/${SERVICE}"

      case "$SERVICE" in
        secureprompt-chat) CONTEXT="$SERVICE" ;;
        *)                 CONTEXT="." ;;
      esac
      DOCKERFILE="${SERVICE}/Dockerfile"

      SSH_FLAG=""
      case "$SERVICE" in
        secureprompt-api|secureprompt-worker|secureprompt-mcp|sp-agent)
          SSH_FLAG="--ssh default=${SSH_AUTH_SOCK}"
          ;;
      esac

      BUILD_ARGS=""
      if [ "$SERVICE" = "secureprompt-web" ] && [ -n "${NEXT_PUBLIC_API_URL:-}" ]; then
        BUILD_ARGS="--build-arg NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
      fi

      echo "Building ${IMAGE}:${CI_COMMIT_SHORT_SHA} for linux/amd64"
      docker buildx build \
        --platform linux/amd64 \
        --file "$DOCKERFILE" \
        --tag "${IMAGE}:${CI_COMMIT_SHORT_SHA}" \
        --tag "${IMAGE}:latest" \
        --cache-from "type=registry,ref=${IMAGE}:buildcache" \
        --cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max" \
        --provenance=false \
        $BUILD_ARGS $SSH_FLAG \
        --push \
        "$CONTEXT"

# ===========================================================================
# Stage: deploy — helm rollout of the images `build` just published.
# ===========================================================================
deploy:
  stage: deploy
  image: alpine/helm:3.16.2
  # Transitively requires the whole gate: build needs fmt+clippy+test, and
  # deploy needs build. A red gate leaves this job unschedulable.
  needs:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
    - when: never
  environment:
    name: production
  script:
    - |
      set -euo pipefail
      # Fail loudly on missing configuration rather than half-deploying.
      for var in KUBE_CONFIG HELM_RELEASE HELM_NAMESPACE; do
        eval "val=\${$var:-}"
        if [ -z "$val" ]; then
          echo "FAIL: $var is not set. Add it under Settings -> CI/CD -> Variables" >&2
          echo "      (protected + masked) before running deploy." >&2
          exit 1
        fi
      done
      mkdir -p ~/.kube
      echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
      chmod 600 ~/.kube/config

      helm lint helm/secureprompt
      # Render first: a chart that cannot template is caught before anything
      # is applied to the cluster.
      helm template "$HELM_RELEASE" helm/secureprompt \
        --namespace "$HELM_NAMESPACE" \
        --set image.tag="$CI_COMMIT_SHORT_SHA" > /dev/null

      helm upgrade --install "$HELM_RELEASE" helm/secureprompt \
        --namespace "$HELM_NAMESPACE" \
        --create-namespace \
        --set image.tag="$CI_COMMIT_SHORT_SHA" \
        --atomic \
        --timeout 10m
