[package]
name = "secureprompt-api"
version = "0.1.0"
edition = "2021"
# Proprietary: this crate must never reach crates.io. `publish = false` is
# also what makes deny.toml\'s `[licenses] private.ignore` and
# `[bans] allow-wildcard-paths` apply to it (WS6-2).
publish = false
# See the [[bench]] section: benches/corpus.rs is a shared module, not a target.
autobenches = false

[lib]
name = "secureprompt_api"
path = "src/lib.rs"

[[bin]]
name = "secureprompt-api"
path = "src/main.rs"

[dependencies]
secureprompt-common = { path = "../secureprompt-common" }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
http-body-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
percent-encoding = { workspace = true }
sha2 = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }
futures-util = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
failsafe = { workspace = true }
clickhouse = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
deadpool-redis = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
dashmap = { workspace = true }
oauth2 = { workspace = true }
gcp_auth = { workspace = true }
totp-rs = { workspace = true }
sp-license = { workspace = true }
ed25519-dalek = { workspace = true }
regex = "1"

[lints]
workspace = true

[dev-dependencies]
sqlx = { workspace = true }
rand = "0.8"
# MR7 review M1 — `tests/db_role_split.rs` installs a capturing subscriber to
# assert the `schema_ahead_of_binary` WARNING actually fires. Already a normal
# dependency of this crate (see above), so this adds no build cost; a
# dev-dependency entry is what makes it visible to the integration-test crates.
tracing-subscriber = { workspace = true }
# WS2-5 — latency budget for the deterministic floor.
#
# `default-features = false` drops `plotters`/`rayon`/`html_reports`, which
# exist to render gnuplot-style report pages nobody reads in CI and which cost
# a large chunk of the dependency build. `cargo_bench_support` is the one
# feature that is not optional: without it `cargo bench` refuses to run the
# harness at all.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# `benches/corpus.rs` is a MODULE shared by the bench and by
# `tests/detection_floor_budget.rs`, not a bench target of its own. Without
# this, cargo auto-discovers it as a second bench, tries to run it with the
# libtest harness, and fails.
[[bench]]
name = "detection_floor"
harness = false
