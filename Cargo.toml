[workspace]
members = [
    "secureprompt-common",
    "secureprompt-api",
    "secureprompt-worker",
    "secureprompt-mcp",
    "sp-agent",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.52", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "compression-br"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22.1"
bytes = "1.11.1"
hex = "0.4.3"
http-body-util = "0.1.3"
percent-encoding = "2.3.2"
sha2 = "0.10.9"
tokio-stream = "0.1.18"
async-stream = "0.3.6"
futures-util = "0.3.32"
tower = "0.5.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
deadpool-redis = "0.23"
# jsonwebtoken 10.x requires an explicit crypto provider feature at workspace
# level. `rust_crypto` is pure-Rust and matches rustls defaults elsewhere in
# the stack (reqwest + clickhouse use `rustls-tls`). See
# <https://docs.rs/jsonwebtoken/10.3.0/jsonwebtoken/#feature-flags>.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
argon2 = "0.5"
password-hash = "0.5"
zeroize = "1.8.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
failsafe = "1.3"
clickhouse = { version = "0.15", features = ["inserter", "uuid", "chrono", "rustls-tls"] }
tokio-cron-scheduler = { version = "0.15" }
aes-gcm = "0.10"
rand = { version = "0.8", features = ["std", "std_rng"] }
dashmap = "6"
# oauth2 v5.0.0 (2025-01-21 stable). CRITICAL: use set_auth_uri/set_token_uri,
# NOT set_auth_url/set_token_url — those are the v4 names (Pitfall 3).
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }

vaultrs = { version = "0.8", features = ["rustls"] }

qdrant-client = { version = "1.17", features = ["uuid"] }

# rmcp 1.5.0 — official Rust MCP SDK (modelcontextprotocol/rust-sdk).
# CRITICAL: version is 1.5, NOT 0.2.x. The 0.2.x API is completely different.
# Features: server (ServerHandler trait), macros (#[tool_router] etc.),
#           transport-io (stdio() function), schemars (JsonSchema derive re-export).
rmcp = { version = "1.5", features = ["server", "macros", "transport-io", "schemars"] }

# schemars 1.0 required separately — rmcp re-exports the crate but parameter structs
# need the derive macro from the crate itself. MUST be 1.0, NOT 0.8 (Pitfall 6).
schemars = "1.0"

# PRODUCTION git dep — sp-license is pinned to the sp-license-v0.1.0 tag on the
# sp-admin repo. Same code as the former local path dep; reproducible source.
# (and AAD key-unwrap, used later in Plan 4).
sp-license = { git = "ssh://git@gitlab.com/secureprompt/admin.git", tag = "sp-license-v0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"
