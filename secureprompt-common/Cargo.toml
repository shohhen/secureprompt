[package]
name = "secureprompt-common"
version = "0.1.0"
edition = "2021"
# Proprietary: this crate must never reach crates.io. `publish = false` is
# also what makes deny.toml\'s `[licenses] private.ignore` and
# `[bans] allow-wildcard-paths` apply to it (WS6-2).
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
aes-gcm = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
# WS4-1 — audit-export digest chain + detached signature. Ed25519 (asymmetric)
# rather than an HMAC because the auditor must be able to verify with public
# material alone; see `audit_export`'s module docs.
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
vaultrs = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
