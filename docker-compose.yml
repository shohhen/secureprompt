services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secureprompt
      POSTGRES_PASSWORD: secureprompt
      POSTGRES_DB: secureprompt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureprompt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  secureprompt-ml:
    build:
      context: .
      dockerfile: secureprompt-ml/Dockerfile
    restart: on-failure
    environment:
      ML_LANGUAGE: en
      ML_USE_ONNX: "false"
    # No ports: mapping — api already binds host 8080; gateway calls via Docker DNS only.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')\" || exit 1",
        ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 3

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: secureprompt
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: secureprompt-api/Dockerfile
    environment:
      DATABASE_URL: postgres://secureprompt:secureprompt@postgres:5432/secureprompt
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      ML_SIDECAR_URL: http://secureprompt-ml:8080
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: secureprompt
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      secureprompt-ml:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: secureprompt-worker/Dockerfile
    environment:
      DATABASE_URL: postgres://secureprompt:secureprompt@postgres:5432/secureprompt
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: secureprompt
      CLICKHOUSE_MIGRATIONS_DIR: /app/clickhouse/migrations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

volumes:
  postgres_data:
  clickhouse_data:
