[package]
name = "secureprompt-mcp"
version = "0.1.0"
edition = "2021"
# Proprietary: this crate must never reach crates.io. `publish = false` is
# also what makes deny.toml\'s `[licenses] private.ignore` and
# `[bans] allow-wildcard-paths` apply to it (WS6-2).
publish = false

[dependencies]
secureprompt-common = { path = "../secureprompt-common" }
rmcp = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
