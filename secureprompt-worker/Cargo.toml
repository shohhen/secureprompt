[package]
name = "secureprompt-worker"
version = "0.1.0"
edition = "2021"
# Proprietary: this crate must never reach crates.io. `publish = false` is
# also what makes deny.toml\'s `[licenses] private.ignore` and
# `[bans] allow-wildcard-paths` apply to it (WS6-2).
publish = false

[dependencies]
secureprompt-common = { path = "../secureprompt-common" }
tokio = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clickhouse = { workspace = true }
tokio-cron-scheduler = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
deadpool-redis = { workspace = true }
serde_json = { workspace = true }
qdrant-client = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
# WS4-1 — the audit-export signing key. The scheme itself lives in
# `secureprompt-common::audit_export`; the worker only holds the key type.
ed25519-dalek = { workspace = true }

[dev-dependencies]
# P2A — the audit-export doc gate re-signs tampered manifests with the test
# key, which means base64-encoding a signature the way the producer does. The
# PRODUCT never needs it: `build_manifest` in secureprompt-common does the
# encoding on the real path, so this stays a test-only dependency.
base64 = { workspace = true }

[lints]
workspace = true
