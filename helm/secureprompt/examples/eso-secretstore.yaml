# ESO SecretStore — HashiCorp Vault AppRole example
#
# Prerequisites:
#   1. External Secrets Operator installed in the cluster:
#        helm repo add external-secrets https://charts.external-secrets.io
#        helm install external-secrets external-secrets/external-secrets \
#          -n external-secrets --create-namespace
#
#   2. Vault AppRole credentials stored in a Kubernetes Secret:
#        kubectl create secret generic vault-approle-credentials \
#          --from-literal=roleId=<VAULT_ROLE_ID> \
#          --from-literal=secretId=<VAULT_SECRET_ID> \
#          -n secureprompt
#
# This SecretStore is namespaced to the `secureprompt` namespace.
# For a cluster-wide store, use `kind: ClusterSecretStore`.
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secretstore
  namespace: secureprompt
spec:
  provider:
    vault:
      # Address of your Vault server (adjust for your deployment)
      server: "http://vault.vault.svc.cluster.local:8200"
      # KV v2 path prefix used for SecurePrompt secrets
      path: "secureprompt"
      version: "v2"
      auth:
        appRole:
          path: approle
          roleId:
            # Reference to the Kubernetes Secret holding the AppRole role ID
            key: roleId
            secretRef:
              name: vault-approle-credentials
              namespace: secureprompt
          secretRef:
            key: secretId
            secretRef:
              name: vault-approle-credentials
              namespace: secureprompt
