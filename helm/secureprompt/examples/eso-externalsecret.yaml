# ESO ExternalSecret — maps Vault KV secrets to a Kubernetes Secret
#
# This manifest pulls SecurePrompt runtime secrets from Vault KV v2
# (path: secureprompt/data/runtime) and materialises them as the
# Kubernetes Secret `secureprompt-runtime-secrets` in the `secureprompt`
# namespace.  The Helm chart's Deployment references this Secret via
# `envFrom.secretRef`.
#
# Requires the `vault-secretstore` SecretStore defined in eso-secretstore.yaml.
#
# WS1-P0 DB ROLE SPLIT — READ THIS BEFORE REUSING THIS FILE
# --------------------------------------------------------
# The deployment now uses TWO Postgres roles, and the key name `database_url`
# did not change — only WHICH ROLE it must name. An operator who sources
# secrets from Vault by this example and changes nothing gets an OWNER-role
# `database_url` in the serving pods, which is silently back to RLS being
# bypassed: `postgres:16` creates POSTGRES_USER as a SUPERUSER, and superusers
# are exempt from row-level security unconditionally.
#
#   database_url            MUST name `secureprompt_app` — NOSUPERUSER,
#                           NOBYPASSRLS, owns nothing, has no CREATE on schema
#                           public. This is what the api and worker serve as.
#   migration_database_url  the owner/migrator role. Mounted ONLY on the
#                           `db-migrate` initContainer.
#   app_db_password         the password the migration step sets on
#                           `secureprompt_app`; `database_url` must be built
#                           from the same value or the two disagree and nothing
#                           connects.
#
# The three mappings below cover them. The chart's own secrets.yaml generates
# all three when ESO is not in use; docs/runbooks/db-role-split.md is the
# operator-facing description.
#
# Vault KV layout expected at `secureprompt/runtime`:
#   database_url          — PostgreSQL connection string for the RUNTIME role
#                           (`secureprompt_app`), NOT the owner. See below.
#   redis_url             — Redis/Valkey connection string
#   jwt_secret            — HS256 / RS256 signing secret
#   secureprompt_provider_key — 32-byte hex key for provider-credential encryption
#   kms_file_key          — base64(32 bytes) for FileKms AES-256-GCM
#   clickhouse_url        — ClickHouse HTTP endpoint
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: secureprompt-runtime-secrets
  namespace: secureprompt
spec:
  # How often ESO reconciles (re-fetches) the secret from Vault
  refreshInterval: 1h

  secretStoreRef:
    name: vault-secretstore
    kind: SecretStore

  # The Kubernetes Secret that ESO will create / keep in sync
  target:
    name: secureprompt-runtime-secrets
    creationPolicy: Owner
    # Optional: delete the K8s Secret when the ExternalSecret is deleted
    deletionPolicy: Delete

  # Map individual Vault KV fields to environment-variable-friendly keys
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secureprompt/runtime
        property: database_url

    - secretKey: REDIS_URL
      remoteRef:
        key: secureprompt/runtime
        property: redis_url

    - secretKey: SECUREPROMPT_JWT_SECRET
      remoteRef:
        key: secureprompt/runtime
        property: jwt_secret

    - secretKey: SECUREPROMPT_PROVIDER_KEY
      remoteRef:
        key: secureprompt/runtime
        property: secureprompt_provider_key

    # WS1-P0 role split. The OWNER credential — this is the only key that may
    # carry it, and only the db-migrate initContainer consumes it.
    - secretKey: migration-database-url
      remoteRef:
        key: secureprompt/runtime
        property: migration_database_url

    # The password the migration step sets on `secureprompt_app`. Must be the
    # same value `database_url` above is built from.
    - secretKey: app-db-password
      remoteRef:
        key: secureprompt/runtime
        property: app_db_password

    - secretKey: KMS_FILE_KEY
      remoteRef:
        key: secureprompt/runtime
        property: kms_file_key

    - secretKey: CLICKHOUSE_URL
      remoteRef:
        key: secureprompt/runtime
        property: clickhouse_url
