# ESO ExternalSecret — maps Vault KV secrets to a Kubernetes Secret
#
# This manifest pulls SecurePrompt runtime secrets from Vault KV v2
# (path: secureprompt/data/runtime) and materialises them as the
# Kubernetes Secret `secureprompt-runtime-secrets` in the `secureprompt`
# namespace.  The Helm chart's Deployment references this Secret via
# `envFrom.secretRef`.
#
# Requires the `vault-secretstore` SecretStore defined in eso-secretstore.yaml.
#
# Vault KV layout expected at `secureprompt/runtime`:
#   database_url          — PostgreSQL connection string
#   redis_url             — Redis/Valkey connection string
#   jwt_secret            — HS256 / RS256 signing secret
#   secureprompt_provider_key — 32-byte hex key for provider-credential encryption
#   kms_file_key          — base64(32 bytes) for FileKms AES-256-GCM
#   clickhouse_url        — ClickHouse HTTP endpoint
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: secureprompt-runtime-secrets
  namespace: secureprompt
spec:
  # How often ESO reconciles (re-fetches) the secret from Vault
  refreshInterval: 1h

  secretStoreRef:
    name: vault-secretstore
    kind: SecretStore

  # The Kubernetes Secret that ESO will create / keep in sync
  target:
    name: secureprompt-runtime-secrets
    creationPolicy: Owner
    # Optional: delete the K8s Secret when the ExternalSecret is deleted
    deletionPolicy: Delete

  # Map individual Vault KV fields to environment-variable-friendly keys
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secureprompt/runtime
        property: database_url

    - secretKey: REDIS_URL
      remoteRef:
        key: secureprompt/runtime
        property: redis_url

    - secretKey: SECUREPROMPT_JWT_SECRET
      remoteRef:
        key: secureprompt/runtime
        property: jwt_secret

    - secretKey: SECUREPROMPT_PROVIDER_KEY
      remoteRef:
        key: secureprompt/runtime
        property: secureprompt_provider_key

    - secretKey: KMS_FILE_KEY
      remoteRef:
        key: secureprompt/runtime
        property: kms_file_key

    - secretKey: CLICKHOUSE_URL
      remoteRef:
        key: secureprompt/runtime
        property: clickhouse_url
