global:
  imageRegistry: ""  # e.g. "us-central1-docker.pkg.dev/secure-prompt-496204/secureprompt/"

nameOverride: ""
fullnameOverride: ""

# ----------------------------------------------------------------------------
# Domain / Ingress (GKE)
# ----------------------------------------------------------------------------
ingress:
  enabled: true
  # Hostnames -> services. Cert is provisioned via Google-managed cert.
  domain: "secureprompt.tech"
  hosts:
    web: "app.secureprompt.tech"
    api: "api.secureprompt.tech"
  staticIpName: ""  # optional reserved global IP name. Leave empty for ephemeral.
  # TLS: pick ONE.
  #  - managedCertificate.enabled=true  → GCP-managed cert (needs DNS-only/grey-cloud
  #    so Google can validate; cannot provision behind a Cloudflare proxy).
  #  - tlsSecret="<name>" → use a self-managed kubernetes.io/tls secret on the LB
  #    (e.g. a Cloudflare Origin Certificate). Required when fronting with the
  #    Cloudflare proxy (orange cloud) in Full (strict) mode. Disable managedCertificate.
  managedCertificate:
    enabled: true
  tlsSecret: ""

# ----------------------------------------------------------------------------
# Application services
# ----------------------------------------------------------------------------
api:
  image:
    repository: secureprompt/api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests: { cpu: "100m", memory: "192Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  env:
    logLevel: "info"
    publicSignupEnabled: "true"
    chatDebugMode: "false"
    corsOrigins: "https://app.secureprompt.tech,https://secureprompt.tech"

worker:
  image:
    repository: secureprompt/worker
    tag: "0.1.0"
    # Always: the 0.1.x tags are mutable (re-pushed per build), so IfNotPresent
    # would serve a stale node-cached layer after a rebuild. Pull on every start.
    pullPolicy: Always
  replicaCount: 1
  resources:
    requests: { cpu: "50m",  memory: "128Mi" }
    limits:   { cpu: "300m", memory: "384Mi" }

web:
  image:
    repository: secureprompt/web
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests: { cpu: "50m",  memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  env:
    apiUrl: "http://secureprompt-api"
    nextauthUrl: "https://app.secureprompt.tech"
    nextPublicApiUrl: "https://api.secureprompt.tech"

ml:
  enabled: true
  image:
    repository: secureprompt/ml
    tag: "0.1.0"
    # Always: 0.1.x tags are mutable (re-pushed per build); IfNotPresent would
    # serve a stale node-cached layer after a rebuild (e.g. the lang-router fix).
    pullPolicy: Always
  # NOTE (whole-branch review): the async /v1/scan-file/task polling flow
  # (secureprompt-ml/app/main.py's `_scan_tasks`) is an in-memory,
  # process-local store — keep replicaCount=1 unless/until session affinity
  # (sticky routing to the replica that created the task) or a shared task
  # store (e.g. Redis) is added, or polls can spuriously 404 on a different
  # replica.
  replicaCount: 1
  # The sidecar loads four models into memory: GLiNER multi-PII, the DeBERTa
  # injection classifier, the MiniLM embedder, and the decrypted XLM-R NER
  # checkpoint (~1GB weights). Peak RSS during load is ~4-5GB, so the limit must
  # be generous or the container is OOMKilled mid-load (exit 137).
  resources:
    requests: { cpu: "500m",  memory: "2Gi" }
    limits:   { cpu: "2000m", memory: "6Gi" }
  env:
    language: "en"
    useOnnx: "false"
    # Active NER checkpoint(s) under app/resources/. Empty → image default
    # (multilingual_ner_v8_xlmr). Comma-separated to run several, or "all" to register
    # every shipped checkpoint. Rollback to v7: multilingual_ner_v7_xlmr (also shipped).
    activeNerModels: "multilingual_ner_v8_xlmr"

# ----------------------------------------------------------------------------
# LibreChat (browser chat UI, SP-modified fork) + its MongoDB
# ----------------------------------------------------------------------------
librechat:
  enabled: false
  host: "chat.secureprompt.tech"
  image:
    repository: secureprompt/librechat
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  allowRegistration: "false"
  scanFilesEnabled: "true"
  # Login-form min password length (runtime startupConfig). 1 = effectively off,
  # so short SP creds (admin/admin demo) are accepted; SP enforces real policy.
  minPasswordLength: "1"
  resources:
    requests: { cpu: "100m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "1Gi" }
  mongo:
    image:
      repository: mongo
      tag: "7.0"
    persistence:
      size: "5Gi"
      storageClass: "standard-rwo"
    resources:
      requests: { cpu: "50m",  memory: "256Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }

# ----------------------------------------------------------------------------
# Data stores
# ----------------------------------------------------------------------------
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    user: "secureprompt"
    database: "secureprompt"
  persistence:
    enabled: true
    size: "5Gi"
    storageClass: "standard-rwo"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.8"
    pullPolicy: IfNotPresent
  auth:
    user: "default"
    database: "secureprompt"
  persistence:
    enabled: true
    size: "10Gi"
    storageClass: "standard-rwo"
  resources:
    requests: { cpu: "200m",  memory: "1Gi" }
    limits:   { cpu: "1000m", memory: "2Gi" }

valkey:
  image:
    repository: valkey/valkey
    tag: "8.1.6-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "25m",  memory: "64Mi" }
    limits:   { cpu: "100m", memory: "128Mi" }

qdrant:
  image:
    repository: qdrant/qdrant
    tag: "v1.17.1"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "standard-rwo"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "1Gi" }

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "11.4.0"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: "2Gi"
    storageClass: "standard-rwo"
  resources:
    requests: { cpu: "25m",  memory: "128Mi" }
    limits:   { cpu: "200m", memory: "256Mi" }
  admin:
    user: "admin"
    # password is generated into the secret if blank
    password: ""

# ----------------------------------------------------------------------------
# License / model-key chain (env-only)
# ----------------------------------------------------------------------------
# When enabled, the API reads the compact license token + base64 ATTEST-KEK from
# the license secret (as env vars), verifies the license with the ATTEST-KEK, and
# relays the wrapped model key to the ML sidecar. The sidecar's baked .so unwraps
# the model key (ML image ships encrypted weights; runs with
# SECUREPROMPT_MODEL_KEY_REQUIRED=true). Without this the sidecar never loads
# the XLM-R NER checkpoint and stays unready. The shared internal token comes from
# the generated `<release>-secrets` (key: ml-sidecar-internal-token).
#
# Create the license secret out-of-band (scripts/gcp/deploy.sh does this from .env):
#   kubectl create secret generic secureprompt-license \
#     --from-literal=license-token="$SECUREPROMPT_LICENSE_TOKEN" \
#     --from-literal=attest-kek="$SECUREPROMPT_ATTEST_KEK" \
#     --from-literal=license-pubkey="$SECUREPROMPT_LICENSE_PUBKEY" -n <namespace>
license:
  enabled: false
  # Secret (created out-of-band) holding the env-only license material. Keys:
  #   license-token   — compact base64url license token
  #   attest-kek      — base64 32-byte KEK for gateway license attestation/verification
  #   license-pubkey  — base64 Ed25519 vendor public key that verifies the token
  secretName: "secureprompt-license"
  # Optional sp-admin base URL for online revalidation + revocation polling.
  # Empty = offline (the token's carried freshness budgets still apply).
  # e.g. https://manage.secureprompt.tech/api
  serverUrl: ""
  # How often (seconds) the gateway re-verifies the license AND re-pushes the
  # model key to the ML sidecar. The app default is 3600 (1h) — far too long for
  # sidecar recovery: if the ml pod restarts it loses the in-memory key and stays
  # unkeyed (503, GLiNER-only) until the next push. 60s re-keys a restarted
  # sidecar promptly (its liveness is on /health so it survives the wait).
  recheckSecs: "60"

# ----------------------------------------------------------------------------
# Misc
# ----------------------------------------------------------------------------
kms:
  backend: "file"

backup:
  enabled: false
  schedule: "0 2 * * *"
  image:
    repository: sp-backup
    tag: "latest"
  keySecret: "secureprompt-backup-key"
  retentionDaily: 7
  # PVC mounted at /backups by the CronJob.
  storageSize: 20Gi
  storageClass: "standard-rwo"

serviceMesh:
  enabled: false
  provider: "linkerd"

otel:
  enabled: false

prometheus:
  enabled: false
