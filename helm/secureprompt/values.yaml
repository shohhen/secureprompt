global:
  imageRegistry: ""  # e.g. "us-central1-docker.pkg.dev/secure-prompt-496204/secureprompt/"

nameOverride: ""
fullnameOverride: ""

# ----------------------------------------------------------------------------
# Domain / Ingress (GKE)
# ----------------------------------------------------------------------------
ingress:
  enabled: true
  # Hostnames -> services. Cert is provisioned via Google-managed cert.
  domain: "secureprompt.tech"
  hosts:
    marketing: "secureprompt.tech"
    web: "app.secureprompt.tech"
    api: "api.secureprompt.tech"
  staticIpName: ""  # optional reserved global IP name. Leave empty for ephemeral.
  # TLS: pick ONE.
  #  - managedCertificate.enabled=true  → GCP-managed cert (needs DNS-only/grey-cloud
  #    so Google can validate; cannot provision behind a Cloudflare proxy).
  #  - tlsSecret="<name>" → use a self-managed kubernetes.io/tls secret on the LB
  #    (e.g. a Cloudflare Origin Certificate). Required when fronting with the
  #    Cloudflare proxy (orange cloud) in Full (strict) mode. Disable managedCertificate.
  managedCertificate:
    enabled: true
  tlsSecret: ""

# ----------------------------------------------------------------------------
# Application services
# ----------------------------------------------------------------------------
api:
  image:
    repository: secureprompt/api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests: { cpu: "100m", memory: "192Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  env:
    logLevel: "info"
    publicSignupEnabled: "true"
    chatDebugMode: "false"
    corsOrigins: "https://app.secureprompt.tech,https://secureprompt.tech"

worker:
  image:
    repository: secureprompt/worker
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests: { cpu: "50m",  memory: "128Mi" }
    limits:   { cpu: "300m", memory: "384Mi" }

web:
  image:
    repository: secureprompt/web
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests: { cpu: "50m",  memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  env:
    apiUrl: "http://secureprompt-api"
    nextauthUrl: "https://app.secureprompt.tech"
    nextPublicApiUrl: "https://api.secureprompt.tech"

marketing:
  enabled: true
  image:
    repository: secureprompt/marketing
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests: { cpu: "25m",  memory: "96Mi" }
    limits:   { cpu: "200m", memory: "192Mi" }
  env:
    contactFormEndpoint: ""

ml:
  enabled: true
  image:
    repository: secureprompt/ml
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  # The sidecar loads four models into memory: GLiNER multi-PII, the DeBERTa
  # injection classifier, the MiniLM embedder, and the decrypted XLM-R NER
  # checkpoint (~1GB weights). Peak RSS during load is ~4-5GB, so the limit must
  # be generous or the container is OOMKilled mid-load (exit 137).
  resources:
    requests: { cpu: "500m",  memory: "2Gi" }
    limits:   { cpu: "2000m", memory: "6Gi" }
  env:
    language: "en"
    useOnnx: "false"
    # Active NER checkpoint(s) under app/resources/. Empty → image default
    # (multilingual_ner_v3_no_ssn_xlmr). Comma-separated to run several, or
    # "all" to register every shipped checkpoint. See scripts/compare_v3_models.py.
    activeNerModels: ""

# ----------------------------------------------------------------------------
# LibreChat (browser chat UI, SP-modified fork) + its MongoDB
# ----------------------------------------------------------------------------
librechat:
  enabled: false
  host: "chat.secureprompt.tech"
  image:
    repository: secureprompt/librechat
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  allowRegistration: "false"
  scanFilesEnabled: "true"
  # Login-form min password length (runtime startupConfig). 1 = effectively off,
  # so short SP creds (admin/admin demo) are accepted; SP enforces real policy.
  minPasswordLength: "1"
  resources:
    requests: { cpu: "100m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "1Gi" }
  mongo:
    image:
      repository: mongo
      tag: "7.0"
    persistence:
      size: "5Gi"
      storageClass: "standard-rwo"
    resources:
      requests: { cpu: "50m",  memory: "256Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }

# ----------------------------------------------------------------------------
# Data stores
# ----------------------------------------------------------------------------
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    user: "secureprompt"
    database: "secureprompt"
  persistence:
    enabled: true
    size: "5Gi"
    storageClass: "standard-rwo"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.8"
    pullPolicy: IfNotPresent
  auth:
    user: "default"
    database: "secureprompt"
  persistence:
    enabled: true
    size: "10Gi"
    storageClass: "standard-rwo"
  resources:
    requests: { cpu: "200m",  memory: "1Gi" }
    limits:   { cpu: "1000m", memory: "2Gi" }

valkey:
  image:
    repository: valkey/valkey
    tag: "8.1.6-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "25m",  memory: "64Mi" }
    limits:   { cpu: "100m", memory: "128Mi" }

qdrant:
  image:
    repository: qdrant/qdrant
    tag: "v1.17.1"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "standard-rwo"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "1Gi" }

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "11.4.0"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: "2Gi"
    storageClass: "standard-rwo"
  resources:
    requests: { cpu: "25m",  memory: "128Mi" }
    limits:   { cpu: "200m", memory: "256Mi" }
  admin:
    user: "admin"
    # password is generated into the secret if blank
    password: ""

# ----------------------------------------------------------------------------
# License / model-key chain
# ----------------------------------------------------------------------------
# When enabled, the API mounts a secret holding license.json + keys.json,
# verifies the license, unwraps the sealed model decryption key, and pushes it
# to the ML sidecar (which ships encrypted weights and runs with
# SECUREPROMPT_MODEL_KEY_REQUIRED=true). Without this, the sidecar never loads
# the XLM-R NER checkpoint and stays unready. The shared internal token comes
# from the generated `<release>-secrets` (key: ml-sidecar-internal-token).
#
# Create the files secret out-of-band (scripts/gcp/deploy.sh does this):
#   kubectl create secret generic secureprompt-license \
#     --from-file=license.json=etc/secureprompt/license.json \
#     --from-file=keys.json=etc/secureprompt/keys.json -n <namespace>
license:
  enabled: false
  filesSecret: "secureprompt-license"
  mountPath: "/etc/secureprompt"

# ----------------------------------------------------------------------------
# Misc
# ----------------------------------------------------------------------------
kms:
  backend: "file"

serviceMesh:
  enabled: false
  provider: "linkerd"

otel:
  enabled: false

prometheus:
  enabled: false
