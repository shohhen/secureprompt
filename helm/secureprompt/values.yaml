global:
  imageRegistry: ""  # e.g. "us-central1-docker.pkg.dev/secure-prompt-496204/secureprompt/"

nameOverride: ""
fullnameOverride: ""

# ----------------------------------------------------------------------------
# Domain / Ingress
#
# WS6-5. This block used to be GKE-only, and not by configuration — by
# construction. `helm template` at these defaults emitted
# `apiVersion: networking.gke.io/v1 / kind: ManagedCertificate`, which is a
# GKE CRD: `kubectl apply` on any other cluster fails the WHOLE release with
# `no matches for kind "ManagedCertificate"`. `values-airgap.yaml` — the file
# an on-prem bank installs — inherited every one of those, because it
# overrides images and nothing else.
#
# The defaults below are now vanilla Kubernetes. GKE is an overlay:
#   helm install ... -f helm/secureprompt/values-gke.yaml
# `scripts/ci/check-helm-portability.sh` renders both and asserts each stays
# what it claims to be.
# ----------------------------------------------------------------------------
ingress:
  enabled: true
  # "generic" | "gke". Only "gke" emits the ManagedCertificate CRD and the
  # cloud.google.com/neg Service annotations. Anything else is portable.
  platform: "generic"
  # Hostnames -> services.
  domain: "secureprompt.tech"
  hosts:
    web: "app.secureprompt.tech"
    api: "api.secureprompt.tech"
  # spec.ingressClassName — the portable way to name a controller. Set to the
  # class your cluster actually runs: "nginx" for ingress-nginx, "traefik",
  # "gce" on GKE (values-gke.yaml does that). Empty leaves the cluster's
  # default IngressClass to claim it.
  className: ""
  # Free-form Ingress annotations. Controller-specific tuning goes here rather
  # than in the template, e.g. for ingress-nginx:
  #   nginx.ingress.kubernetes.io/proxy-body-size: "32m"
  #   nginx.ingress.kubernetes.io/proxy-buffering: "off"   # SSE — see docs/proxying/sse.md
  annotations: {}
  staticIpName: ""  # GKE only: reserved global IP name. Ignored elsewhere.
  # TLS: pick ONE.
  #  - tlsSecret="<name>" → a kubernetes.io/tls secret (cert-manager, a
  #    Cloudflare Origin Certificate, or your bank's internal CA). This is the
  #    portable option and the only one that works on-prem.
  #  - managedCertificate.enabled=true → GKE-managed cert. REQUIRES
  #    platform="gke"; ignored otherwise, because the CRD does not exist.
  managedCertificate:
    enabled: false
  tlsSecret: ""

# ----------------------------------------------------------------------------
# Application services
# ----------------------------------------------------------------------------
# WS1-P0 DB ROLE SPLIT — the schema-migration initContainer
# (secureprompt.dbMigrateInitContainer in _helpers.tpl). It runs the API image
# with `--migrate-only` and exits before anything listens; it is the only place
# the OWNER database credential is mounted.
#
# Its own pullPolicy, because api.image.pullPolicy is IfNotPresent and the
# 0.1.x tags are mutable: a node-cached PRE-SPLIT api image has no argument
# parsing at all, so `--migrate-only` is ignored, the full API main runs, and
# the pod sits in Init:CrashLoopBackOff forever.
# scripts/ci/check-helm-migration-initcontainer.sh rejects IfNotPresent here in
# every render mode.
migration:
  image:
    pullPolicy: Always

api:
  image:
    repository: secureprompt/api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests: { cpu: "100m", memory: "192Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  env:
    logLevel: "info"
    publicSignupEnabled: "true"
    chatDebugMode: "false"
    corsOrigins: "https://app.secureprompt.tech,https://secureprompt.tech"
  # Service shape. NodePort is what the GKE ingress controller requires; on a
  # cluster whose controller routes to ClusterIP (ingress-nginx does), NodePort
  # additionally opens a port on every node for no reason. Set ClusterIP
  # on-prem.
  service:
    type: NodePort
    annotations: {}

worker:
  image:
    repository: secureprompt/worker
    tag: "0.1.0"
    # Always: the 0.1.x tags are mutable (re-pushed per build), so IfNotPresent
    # would serve a stale node-cached layer after a rebuild. Pull on every start.
    pullPolicy: Always
  replicaCount: 1
  resources:
    requests: { cpu: "50m",  memory: "128Mi" }
    limits:   { cpu: "300m", memory: "384Mi" }
  # /metrics endpoint (secureprompt-worker/src/metrics.rs) — scraped by the
  # in-cluster Prometheus job "secureprompt-worker" (prometheus-configmap.yaml).
  metrics:
    enabled: true
    port: 9091

web:
  image:
    repository: secureprompt/web
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests: { cpu: "50m",  memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  env:
    apiUrl: "http://secureprompt-api"
    nextauthUrl: "https://app.secureprompt.tech"
    nextPublicApiUrl: "https://api.secureprompt.tech"
  # Service shape. NodePort is what the GKE ingress controller requires; on a
  # cluster whose controller routes to ClusterIP (ingress-nginx does), NodePort
  # additionally opens a port on every node for no reason. Set ClusterIP
  # on-prem.
  service:
    type: NodePort
    annotations: {}

ml:
  enabled: true
  image:
    repository: secureprompt/ml
    tag: "0.1.0"
    # Always: 0.1.x tags are mutable (re-pushed per build); IfNotPresent would
    # serve a stale node-cached layer after a rebuild (e.g. the lang-router fix).
    pullPolicy: Always
  # NOTE (whole-branch review): the async /v1/scan-file/task polling flow
  # (secureprompt-ml/app/main.py's `_scan_tasks`) is an in-memory,
  # process-local store — keep replicaCount=1 unless/until session affinity
  # (sticky routing to the replica that created the task) or a shared task
  # store (e.g. Redis) is added, or polls can spuriously 404 on a different
  # replica.
  replicaCount: 1
  # The sidecar loads four models into memory: GLiNER multi-PII, the DeBERTa
  # injection classifier, the MiniLM embedder, and the decrypted XLM-R NER
  # checkpoint (~1GB weights). Peak RSS during load is ~4-5GB, so the limit must
  # be generous or the container is OOMKilled mid-load (exit 137).
  resources:
    requests: { cpu: "500m",  memory: "2Gi" }
    limits:   { cpu: "2000m", memory: "6Gi" }
  env:
    language: "en"
    useOnnx: "false"
    # Active NER checkpoint(s) under app/resources/. Empty → image default
    # (multilingual_ner_v8_xlmr). Comma-separated to run several, or "all" to register
    # every shipped checkpoint. Rollback to v7: multilingual_ner_v7_xlmr (also shipped).
    activeNerModels: "multilingual_ner_v8_xlmr"

# ----------------------------------------------------------------------------
# LibreChat (browser chat UI, SP-modified fork) + its MongoDB
# ----------------------------------------------------------------------------
librechat:
  enabled: false
  host: "chat.secureprompt.tech"
  image:
    repository: secureprompt/librechat
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  allowRegistration: "false"
  scanFilesEnabled: "true"
  # Login-form min password length (runtime startupConfig). 1 = effectively off,
  # so short SP creds (admin/admin demo) are accepted; SP enforces real policy.
  minPasswordLength: "1"
  resources:
    requests: { cpu: "100m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "1Gi" }
  mongo:
    image:
      repository: mongo
      tag: "7.0"
    persistence:
      size: "5Gi"
      storageClass: ""  # empty = the cluster's default StorageClass. WS6-5: this used to be
                  # "standard-rwo", a GKE-only class name, which leaves every PVC Pending
                  # on any other cluster. values-gke.yaml sets it back for GKE.
    resources:
      requests: { cpu: "50m",  memory: "256Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }

# ----------------------------------------------------------------------------
# Data stores
# ----------------------------------------------------------------------------
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    user: "secureprompt"
    database: "secureprompt"
  persistence:
    enabled: true
    size: "5Gi"
    storageClass: ""  # empty = the cluster's default StorageClass. WS6-5: this used to be
                  # "standard-rwo", a GKE-only class name, which leaves every PVC Pending
                  # on any other cluster. values-gke.yaml sets it back for GKE.
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.8"
    pullPolicy: IfNotPresent
  auth:
    user: "default"
    database: "secureprompt"
  persistence:
    enabled: true
    size: "10Gi"
    storageClass: ""  # empty = the cluster's default StorageClass. WS6-5: this used to be
                  # "standard-rwo", a GKE-only class name, which leaves every PVC Pending
                  # on any other cluster. values-gke.yaml sets it back for GKE.
  resources:
    requests: { cpu: "200m",  memory: "1Gi" }
    limits:   { cpu: "1000m", memory: "2Gi" }

valkey:
  image:
    repository: valkey/valkey
    tag: "8.1.6-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "25m",  memory: "64Mi" }
    limits:   { cpu: "100m", memory: "128Mi" }

qdrant:
  image:
    repository: qdrant/qdrant
    tag: "v1.17.1"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""  # empty = the cluster's default StorageClass. WS6-5: this used to be
                  # "standard-rwo", a GKE-only class name, which leaves every PVC Pending
                  # on any other cluster. values-gke.yaml sets it back for GKE.
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "1Gi" }

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "11.4.0"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: "2Gi"
    storageClass: ""  # empty = the cluster's default StorageClass. WS6-5: this used to be
                  # "standard-rwo", a GKE-only class name, which leaves every PVC Pending
                  # on any other cluster. values-gke.yaml sets it back for GKE.
  resources:
    requests: { cpu: "25m",  memory: "128Mi" }
    limits:   { cpu: "200m", memory: "256Mi" }
  admin:
    user: "admin"
    # password is generated into the secret if blank
    password: ""

# ----------------------------------------------------------------------------
# License / model-key chain (env-only)
# ----------------------------------------------------------------------------
# When enabled, the API reads the compact license token + base64 ATTEST-KEK from
# the license secret (as env vars), verifies the license with the ATTEST-KEK, and
# relays the wrapped model key to the ML sidecar. The sidecar's baked .so unwraps
# the model key (ML image ships encrypted weights; runs with
# SECUREPROMPT_MODEL_KEY_REQUIRED=true). Without this the sidecar never loads
# the XLM-R NER checkpoint and stays unready. The shared internal token comes from
# the generated `<release>-secrets` (key: ml-sidecar-internal-token).
#
# Create the license secret out-of-band (scripts/gcp/deploy.sh does this from .env):
#   kubectl create secret generic secureprompt-license \
#     --from-literal=license-token="$SECUREPROMPT_LICENSE_TOKEN" \
#     --from-literal=attest-kek="$SECUREPROMPT_ATTEST_KEK" \
#     --from-literal=license-pubkey="$SECUREPROMPT_LICENSE_PUBKEY" -n <namespace>
license:
  enabled: false
  # Secret (created out-of-band) holding the env-only license material. Keys:
  #   license-token   — compact base64url license token
  #   attest-kek      — base64 32-byte KEK for gateway license attestation/verification
  #   license-pubkey  — base64 Ed25519 vendor public key that verifies the token
  secretName: "secureprompt-license"
  # Optional sp-admin base URL for online revalidation + revocation polling.
  # Empty = offline (the token's carried freshness budgets still apply).
  # e.g. https://manage.secureprompt.tech/api
  serverUrl: ""
  # How often (seconds) the gateway re-verifies the license AND re-pushes the
  # model key to the ML sidecar. The app default is 3600 (1h) — far too long for
  # sidecar recovery: if the ml pod restarts it loses the in-memory key and stays
  # unkeyed (503, GLiNER-only) until the next push. 60s re-keys a restarted
  # sidecar promptly (its liveness is on /health so it survives the wait).
  recheckSecs: "60"

# ----------------------------------------------------------------------------
# Misc
# ----------------------------------------------------------------------------
kms:
  backend: "file"

backup:
  enabled: false
  schedule: "0 2 * * *"
  image:
    repository: sp-backup
    tag: "latest"
  keySecret: "secureprompt-backup-key"
  retentionDaily: 7
  # PVC mounted at /backups by the CronJob.
  storageSize: 20Gi
  storageClass: ""  # empty = the cluster's default StorageClass. WS6-5: this used to be
                  # "standard-rwo", a GKE-only class name, which leaves every PVC Pending
                  # on any other cluster. values-gke.yaml sets it back for GKE.

serviceMesh:
  enabled: false
  provider: "linkerd"

otel:
  enabled: false

# ----------------------------------------------------------------------------
# Monitoring (KPI-2) — self-contained Prometheus + Alertmanager, NO Prometheus
# Operator/CRDs. Grafana (above) is provisioned to point at these in-cluster
# Services via templates/grafana-provisioning-configmap.yaml.
# ----------------------------------------------------------------------------
prometheus:
  enabled: true
  scrapeInterval: 15s
  evaluationInterval: 15s
  retention: 30d
  image:
    repository: prom/prometheus
    tag: "v2.55.1"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: "10Gi"
    storageClass: ""  # empty = the cluster's default StorageClass. WS6-5: this used to be
                  # "standard-rwo", a GKE-only class name, which leaves every PVC Pending
                  # on any other cluster. values-gke.yaml sets it back for GKE.
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "1Gi" }

alertmanager:
  enabled: true
  image:
    repository: prom/alertmanager
    tag: "v0.27.0"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "25m",  memory: "64Mi" }
    limits:   { cpu: "100m", memory: "128Mi" }
