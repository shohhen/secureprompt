global:
  imageRegistry: ""  # Air-gap: set to "registry.internal/" (trailing slash required)

nameOverride: ""
fullnameOverride: ""

api:
  image:
    repository: secureprompt/api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1

worker:
  image:
    repository: secureprompt/worker
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1

postgres:
  image:
    repository: postgres
    tag: "16-alpine"

valkey:
  image:
    repository: valkey/valkey
    tag: "8.1.6-alpine"
    pullPolicy: IfNotPresent

qdrant:
  image:
    repository: qdrant/qdrant
    tag: "v1.17.1"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 5Gi

kms:
  backend: "file"

serviceMesh:
  enabled: false
  provider: "linkerd"

web:
  image:
    repository: secureprompt/web
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1"
  env:
    apiUrl: "http://secureprompt-api:8080"
    nextauthUrl: "http://localhost:3000"

otel:
  enabled: true

prometheus:
  enabled: true
