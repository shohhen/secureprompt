apiVersion: v1
kind: Service
metadata:
  name: {{ include "secureprompt.fullname" . }}-api
  labels:
    {{- include "secureprompt.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: {{ include "secureprompt.fullname" . }}-api
