{{/*
Stable secret values across helm upgrades:
- Try to read existing secret first (lookup) so we never rotate.
- Fall back to randAlphaNum on first install.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "secureprompt.fullname" .))) -}}
{{- $pgPassword := "" -}}
{{- $jwtSecret := "" -}}
{{- $providerKey := "" -}}
{{- $kmsKey := "" -}}
{{- $nextauthSecret := "" -}}
{{- $grafanaPwd := "" -}}
{{- $mlInternalToken := "" -}}
{{- if and $existing $existing.data -}}
  {{- $pgPassword     = index $existing.data "postgres-password"  | default (randAlphaNum 32 | b64enc) -}}
  {{- $jwtSecret      = index $existing.data "jwt-secret"         | default (randAlphaNum 48 | b64enc) -}}
  {{- $providerKey    = index $existing.data "provider-key"       | default (randAlphaNum 32 | b64enc) -}}
  {{- $kmsKey         = index $existing.data "kms-file-key"       | default (randBytes 32 | b64enc) -}}
  {{- $nextauthSecret = index $existing.data "nextauth-secret"    | default (randAlphaNum 48 | b64enc) -}}
  {{- $grafanaPwd     = index $existing.data "grafana-admin-password" | default (randAlphaNum 24 | b64enc) -}}
  {{- $mlInternalToken = index $existing.data "ml-sidecar-internal-token" | default (randAlphaNum 40 | b64enc) -}}
{{- else -}}
  {{- $pgPassword     = randAlphaNum 32 | b64enc -}}
  {{- $jwtSecret      = randAlphaNum 48 | b64enc -}}
  {{- $providerKey    = randAlphaNum 32 | b64enc -}}
  {{- $kmsKey         = randBytes 32 | b64enc -}}
  {{- $nextauthSecret = randAlphaNum 48 | b64enc -}}
  {{- $mlInternalToken = randAlphaNum 40 | b64enc -}}
  {{- if .Values.grafana.admin.password -}}
    {{- $grafanaPwd = .Values.grafana.admin.password | b64enc -}}
  {{- else -}}
    {{- $grafanaPwd = randAlphaNum 24 | b64enc -}}
  {{- end -}}
{{- end -}}
{{/* Compose URLs at the end (need b64-decoded pgPassword) */}}
{{- $pgPwdPlain := $pgPassword | b64dec -}}
{{- $pgUser := .Values.postgres.auth.user -}}
{{- $pgDb := .Values.postgres.auth.database -}}
{{- $pgHost := printf "%s-postgres" (include "secureprompt.fullname" .) -}}
{{- $dbUrl := printf "postgres://%s:%s@%s:5432/%s" $pgUser $pgPwdPlain $pgHost $pgDb -}}
{{- $redisHost := printf "%s-valkey" (include "secureprompt.fullname" .) -}}
{{- $redisUrl := printf "redis://%s:6379" $redisHost -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secureprompt.fullname" . }}-secrets
  labels:
    {{- include "secureprompt.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-user: {{ .Values.postgres.auth.user | b64enc | quote }}
  postgres-password: {{ $pgPassword | quote }}
  postgres-database: {{ .Values.postgres.auth.database | b64enc | quote }}
  database-url: {{ $dbUrl | b64enc | quote }}
  redis-url: {{ $redisUrl | b64enc | quote }}
  jwt-secret: {{ $jwtSecret | quote }}
  provider-key: {{ $providerKey | quote }}
  kms-file-key: {{ $kmsKey | quote }}
  nextauth-secret: {{ $nextauthSecret | quote }}
  grafana-admin-password: {{ $grafanaPwd | quote }}
  ml-sidecar-internal-token: {{ $mlInternalToken | quote }}
