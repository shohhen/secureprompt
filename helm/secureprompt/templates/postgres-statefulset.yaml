{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "secureprompt.fullname" . }}-postgres
  labels:
    {{- include "secureprompt.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "secureprompt.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "secureprompt.fullname" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "secureprompt.fullname" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.global.imageRegistry | default "" }}{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureprompt.fullname" . }}-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureprompt.fullname" . }}-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureprompt.fullname" . }}-secrets
                  key: postgres-database
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # MEASURED: without these two, a read-only rootfs kills postgres at
            # boot with
            #   FATAL: could not create lock file
            #   "/var/run/postgresql/.s.PGSQL.5432.lock": Read-only file system
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.auth.user }}"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.auth.user }}"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          # uid 70 -- `id postgres` inside postgres:16-alpine, not 999 (which is
          # what the same user is on the DEBIAN image; getting that wrong is how
          # this was first recorded as impossible). MEASURED at uid 70 with the
          # two emptyDirs above and PGDATA already pointing at the `pgdata`
          # SUBDIRECTORY this template sets: "database system is ready to accept
          # connections", both with a 0700 data dir and with the 0775 root:70
          # one a k8s fsGroup leaves behind.
          securityContext:
            {{- include "secureprompt.containerSecurityContext" (dict "uid" 70 "gid" 70 "readOnly" true) | nindent 12 }}
      securityContext:
        fsGroup: 70
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.persistence.storageClass }}
        storageClassName: {{ .Values.postgres.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "secureprompt.fullname" . }}-postgres
  labels:
    {{- include "secureprompt.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: {{ include "secureprompt.fullname" . }}-postgres
{{- end }}
