apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secureprompt.fullname" . }}-web
  labels:
    {{- include "secureprompt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "secureprompt.fullname" . }}-web
  template:
    metadata:
      labels:
        app: {{ include "secureprompt.fullname" . }}-web
      {{- if and .Values.serviceMesh.enabled (eq .Values.serviceMesh.provider "linkerd") }}
      annotations:
        linkerd.io/inject: enabled
      {{- end }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.global.imageRegistry | default "" }}{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: 3000
              protocol: TCP
              name: http
          env:
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureprompt.fullname" . }}-secrets
                  key: nextauth-secret
            - name: NEXTAUTH_URL
              value: {{ .Values.web.env.nextauthUrl | quote }}
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.web.env.nextPublicApiUrl | quote }}
            # api Service listens on port 80 (-> targetPort 8080); addressing
            # :8080 here reaches nothing and NextAuth's authorize() fetch times out.
            - name: API_URL
              value: "http://{{ include "secureprompt.fullname" . }}-api"
            - name: ML_SIDECAR_URL
              value: "http://{{ include "secureprompt.fullname" . }}-ml:8080"
            # WS1-5: sent as Authorization: Bearer <value> to the ML sidecar.
            # MUST equal the secret the -ml deployment consumes.
            - name: ML_SIDECAR_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureprompt.fullname" . }}-secrets
                  key: ml-sidecar-internal-token
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: {{ .Values.web.resources.requests.memory }}
              cpu: {{ .Values.web.resources.requests.cpu }}
            limits:
              memory: {{ .Values.web.resources.limits.memory }}
              cpu: {{ .Values.web.resources.limits.cpu }}
