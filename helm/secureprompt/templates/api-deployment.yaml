apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secureprompt.fullname" . }}-api
  labels:
    {{- include "secureprompt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "secureprompt.fullname" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "secureprompt.fullname" . }}-api
      {{- if and .Values.serviceMesh.enabled (eq .Values.serviceMesh.provider "linkerd") }}
      annotations:
        linkerd.io/inject: enabled
      {{- end }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.global.imageRegistry | default "" }}{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: {{ .Values.api.env.logLevel | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureprompt.fullname" . }}-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureprompt.fullname" . }}-secrets
                  key: redis-url
            - name: CLICKHOUSE_URL
              value: "http://{{ include "secureprompt.fullname" . }}-clickhouse:8123"
            - name: CLICKHOUSE_DATABASE
              value: {{ .Values.clickhouse.auth.database | quote }}
            - name: QDRANT_URL
              value: "http://{{ include "secureprompt.fullname" . }}-qdrant:6333"
            - name: ML_SIDECAR_URL
              value: "http://{{ include "secureprompt.fullname" . }}-ml:8080"
            - name: SECUREPROMPT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureprompt.fullname" . }}-secrets
                  key: jwt-secret
            - name: SECUREPROMPT_PROVIDER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureprompt.fullname" . }}-secrets
                  key: provider-key
            - name: KMS_FILE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureprompt.fullname" . }}-secrets
                  key: kms-file-key
            - name: SECUREPROMPT_PUBLIC_SIGNUP_ENABLED
              value: {{ .Values.api.env.publicSignupEnabled | quote }}
            - name: SECUREPROMPT_CHAT_DEBUG_MODE
              value: {{ .Values.api.env.chatDebugMode | quote }}
            - name: SECUREPROMPT_CORS_ORIGINS
              value: {{ .Values.api.env.corsOrigins | quote }}
            {{- if .Values.license.enabled }}
            # License chain (env-only): the gateway verifies the compact license
            # token, unwraps the sealed model key with the KEK, and pushes it to
            # the ML sidecar via the shared internal token. Token + KEK come from
            # the out-of-band license secret (created by scripts/gcp/deploy.sh).
            - name: SECUREPROMPT_LICENSE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.license.secretName | quote }}
                  key: license-token
            - name: SECUREPROMPT_MODEL_KEK
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.license.secretName | quote }}
                  key: model-kek
            # Ed25519 vendor public key that verifies the license token signature.
            # Without it the gateway runs unlicensed (grace) and pushes no model key.
            - name: SECUREPROMPT_LICENSE_PUBKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.license.secretName | quote }}
                  key: license-pubkey
            {{- if .Values.license.serverUrl }}
            # Optional sp-admin base URL for online revalidation/revocation.
            - name: SECUREPROMPT_LICENSE_SERVER_URL
              value: {{ .Values.license.serverUrl | quote }}
            {{- end }}
            - name: ML_SIDECAR_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureprompt.fullname" . }}-secrets
                  key: ml-sidecar-internal-token
            {{- end }}
          # The API exposes no dedicated /health route; /metrics is unauthenticated,
          # stays open past the license gate, and returns 200 whenever the server
          # is up — so it doubles as the liveness/readiness target.
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
