apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secureprompt.fullname" . }}-api
  labels:
    {{- include "secureprompt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "secureprompt.fullname" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "secureprompt.fullname" . }}-api
      {{- if and .Values.serviceMesh.enabled (eq .Values.serviceMesh.provider "linkerd") }}
      annotations:
        linkerd.io/inject: enabled
      {{- end }}
    spec:
      initContainers:
        - name: license-check
          image: "{{ .Values.global.imageRegistry | default "" }}busybox:1.36"
          command:
            - sh
            - -c
            - |
              set -e
              if grep -r "bitnami/" /rendered-values 2>/dev/null; then
                echo "ERROR: Bitnami image reference detected in values override. Use upstream images."
                exit 1
              fi
              echo "OK: no bitnami/ references found."
          volumeMounts:
            - name: rendered-values
              mountPath: /rendered-values
              readOnly: true
      containers:
        - name: api
          image: "{{ .Values.global.imageRegistry | default "" }}{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureprompt.fullname" . }}-secrets
                  key: database-url
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureprompt.fullname" . }}-secrets
                  key: redis-url
                  optional: true
      volumes:
        - name: rendered-values
          configMap:
            name: {{ include "secureprompt.fullname" . }}-values-check
            optional: true
