{{- if .Values.ml.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secureprompt.fullname" . }}-ml
  labels:
    {{- include "secureprompt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ml.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "secureprompt.fullname" . }}-ml
  template:
    metadata:
      labels:
        app: {{ include "secureprompt.fullname" . }}-ml
    spec:
      containers:
        - name: ml
          image: "{{ .Values.global.imageRegistry | default "" }}{{ .Values.ml.image.repository }}:{{ .Values.ml.image.tag }}"
          imagePullPolicy: {{ .Values.ml.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ML_LANGUAGE
              value: {{ .Values.ml.env.language | quote }}
            - name: ML_USE_ONNX
              value: {{ .Values.ml.env.useOnnx | quote }}
            {{- if .Values.ml.env.activeNerModels }}
            - name: ACTIVE_NER_MODELS
              value: {{ .Values.ml.env.activeNerModels | quote }}
            {{- end }}
            - name: QDRANT_URL
              value: "http://{{ include "secureprompt.fullname" . }}-qdrant:6333"
            # Shared secret authenticating EVERY route this sidecar serves
            # except /health, /ready and /metrics — including, but not limited
            # to, the gateway's POST /internal/model-key.
            #
            # MR1 review C4: this block used to sit inside the
            # `if .Values.license.enabled` guard below, and the chart
            # default is `license.enabled: false`. `app/main.py` raises
            # RuntimeError AT IMPORT when the var is unset, so a default
            # `helm install` crash-looped this pod before it could serve
            # /health, and the gateway (`config.rs:81` is
            # `unwrap_or_default()`) sent an empty Bearer and 401ed forever —
            # 503 on every gateway request under the fail-closed sidecar
            # default. The secret is generated unconditionally in
            # `secrets.yaml`, so the gating was the whole defect.
            #
            # It is NOT license-conditional because it is not license
            # material: it authenticates the sidecar's own HTTP surface, which
            # exists in both modes. Rendered and asserted in both modes by
            # `scripts/ci/check-helm-sidecar-token.sh`.
            - name: ML_SIDECAR_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureprompt.fullname" . }}-secrets
                  key: ml-sidecar-internal-token
            {{- if not .Values.license.enabled }}
            # No license wired: there is no key to decrypt the XLM-R weights, so
            # disable the requirement and let the sidecar serve GLiNER/Presidio
            # only. Without this the image default (=true) would keep /ready at
            # 503 forever and the pod would crash-loop on the liveness probe.
            - name: SECUREPROMPT_MODEL_KEY_REQUIRED
              value: "false"
            {{- end }}
          # Readiness gates Service membership on the model being loaded (/ready
          # is 503 until the gateway pushes the key). timeout 3s so a CPU-busy
          # sidecar isn't spuriously evicted from the Service mid-inference.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          # Liveness MUST target the ungated /health, NOT /ready. /ready stays 503
          # until the gateway pushes the model key, so a liveness probe on /ready
          # kills the pod before it can be (re-)keyed — an unrecoverable crash-loop
          # whenever the pod restarts (the gateway pushes the key, not the sidecar).
          # /health is always 200 once uvicorn is up, so the pod stays alive waiting
          # for the gateway's periodic re-push (SECUREPROMPT_LICENSE_RECHECK_SECS).
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.ml.resources | nindent 12 }}
          # runAsNonRoot with NO runAsUser: secureprompt-ml/Dockerfile ends
          # `USER appuser` (uid 1001), so the kubelet's non-root check passes on
          # the image's own user and no new uid is imposed on a filesystem that
          # was chowned at build time.
          #
          # readOnlyRootFilesystem is VALUE-GATED AND DEFAULT FALSE, and that is
          # the honest setting rather than the tidy one: this 12.6 GB image is
          # deliberately excluded from the CI `build` stage (it needs the raw
          # model DEK -- .gitlab-ci.yml "KNOWN CAVEATS"), so it was not built
          # here and never started read-only. Every other workload's setting in
          # this chart came from a `docker run --read-only` that either survived
          # or named the path it needed. This one would be a guess.
          securityContext:
            {{- include "secureprompt.containerSecurityContext" (dict "readOnly" .Values.ml.security.readOnlyRootFilesystem) | nindent 12 }}
          volumeMounts:
            # /v1/scan-file spools uploads and OCR intermediates here (pdf2image
            # shells out to poppler, which writes real files). Mounted either
            # way, so turning readOnlyRootFilesystem on is a values change and
            # not a template change.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "secureprompt.fullname" . }}-ml
  labels:
    {{- include "secureprompt.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  # The gateway must POST the model-decryption key to /internal/model-key BEFORE
  # the sidecar can pass its readiness probe (it loads the XLM-R weights only
  # after receiving the key). Without this, the Service would drop the not-ready
  # pod from its endpoints and the key push could never reach it — a deadlock.
  publishNotReadyAddresses: true
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: {{ include "secureprompt.fullname" . }}-ml
{{- end }}
