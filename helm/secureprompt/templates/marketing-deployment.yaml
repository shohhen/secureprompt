{{- if .Values.marketing.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secureprompt.fullname" . }}-marketing
  labels:
    {{- include "secureprompt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.marketing.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "secureprompt.fullname" . }}-marketing
  template:
    metadata:
      labels:
        app: {{ include "secureprompt.fullname" . }}-marketing
    spec:
      containers:
        - name: marketing
          image: "{{ .Values.global.imageRegistry | default "" }}{{ .Values.marketing.image.repository }}:{{ .Values.marketing.image.tag }}"
          imagePullPolicy: {{ .Values.marketing.image.pullPolicy }}
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: CONTACT_FORM_ENDPOINT
              value: {{ .Values.marketing.env.contactFormEndpoint | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.marketing.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "secureprompt.fullname" . }}-marketing
  labels:
    {{- include "secureprompt.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 3001
      name: http
  selector:
    app: {{ include "secureprompt.fullname" . }}-marketing
{{- end }}
