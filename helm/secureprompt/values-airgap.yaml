# Air-gap override values — all images use internal registry, telemetry disabled.
# IMPORTANT: global.imageRegistry must include a trailing slash.

global:
  imageRegistry: "registry.internal/"  # trailing slash required

otel:
  enabled: false

# Self-contained (no Prometheus Operator, no external OTLP collector) — image
# pulls are Never/internal-registry-only, same as every other service below,
# so this fits the air-gap constraint. Enabled to match the chart default
# (base values.yaml); grafana.enabled (also true by default) is unset here
# and inherits from base the same way.
prometheus:
  enabled: true
  scrapeInterval: 15s
  evaluationInterval: 15s
  retention: 30d
  image:
    repository: prom/prometheus
    tag: "v2.55.1"
    pullPolicy: Never

alertmanager:
  enabled: true
  image:
    repository: prom/alertmanager
    tag: "v0.27.0"
    pullPolicy: Never

# The db-migrate initContainer. Never, like everything else here: the operator
# side-loads an exact image on purpose, so there is no registry to pull from.
migration:
  image:
    pullPolicy: Never

api:
  image:
    repository: secureprompt/api
    tag: "0.1.0"
    pullPolicy: Never

worker:
  image:
    repository: secureprompt/worker
    tag: "0.1.0"
    pullPolicy: Never

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: Never

valkey:
  image:
    repository: valkey/valkey
    tag: "8.1.6-alpine"
    pullPolicy: Never

qdrant:
  image:
    repository: qdrant/qdrant
    tag: "v1.17.1"
    pullPolicy: Never

web:
  image:
    repository: secureprompt/web
    tag: "0.1.0"
    pullPolicy: Never

ml:
  image:
    repository: secureprompt/ml
    tag: "0.1.0"
    pullPolicy: Never
