# Air-gap override values — all images use internal registry, telemetry disabled.
# IMPORTANT: global.imageRegistry must include a trailing slash.

global:
  imageRegistry: "registry.internal/"  # trailing slash required

otel:
  enabled: false

prometheus:
  enabled: false

api:
  image:
    repository: secureprompt/api
    tag: "0.1.0"
    pullPolicy: Never

worker:
  image:
    repository: secureprompt/worker
    tag: "0.1.0"
    pullPolicy: Never

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: Never

valkey:
  image:
    repository: valkey/valkey
    tag: "8.1.6-alpine"
    pullPolicy: Never

qdrant:
  image:
    repository: qdrant/qdrant
    tag: "v1.17.1"
    pullPolicy: Never

web:
  image:
    repository: secureprompt/web
    tag: "0.1.0"
    pullPolicy: Never

ml:
  image:
    repository: secureprompt/ml
    tag: "0.1.0"
    pullPolicy: Never
