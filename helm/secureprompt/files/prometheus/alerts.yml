# Alert + recording rules for SecurePrompt (KPI-2 monitoring).
#
# Metric names below MUST match the exposition emitted by:
#   - secureprompt-api    (secureprompt-api/src/observability/metrics.rs,
#                           secureprompt-api/src/ml_sidecar/client.rs)
#   - secureprompt-worker (secureprompt-worker/src/metrics.rs)
#   - secureprompt-ml     (secureprompt-ml/app/metrics.py)
# Do not rename a metric here without updating the emitter — promtool only
# validates syntax, not that a name exists.

groups:
  - name: secureprompt-alerts
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
          description: "Prometheus target {{ $labels.instance }} (job {{ $labels.job }}) has been unreachable (up == 0) for more than 2 minutes."

      - alert: HighRequestErrorRate
        expr: rate(secureprompt_request_failures_total[5m]) / clamp_min(rate(secureprompt_requests_total[5m]), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated request failure rate on {{ $labels.job }}"
          description: "The request failure rate has been above 5% for 10 minutes (current value: {{ $value | printf \"%.2f\" }})."

      - alert: RequestLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(secureprompt_request_duration_seconds_bucket[5m]))) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "P95 request latency is high"
          description: "P95 request latency has been above 5s for 10 minutes (current value: {{ $value | printf \"%.2f\" }}s)."

      - alert: ClickHouseInsertFailures
        expr: rate(secureprompt_clickhouse_insert_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse inserts are failing"
          description: "secureprompt_clickhouse_insert_failures_total has been increasing for 5 minutes (current rate: {{ $value | printf \"%.4f\" }}/s). Analytics events may be getting dropped."

      - alert: MLSidecarCircuitOpen
        expr: increase(secureprompt_ml_sidecar_circuit_open_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ML sidecar circuit breaker has opened"
          description: "The gateway's circuit breaker to the ML sidecar opened {{ $value | printf \"%.0f\" }} time(s) in the last 5 minutes; requests are failing open to regex-only detection."

      - alert: MLSidecarCoverageLost
        expr: increase(secureprompt_sidecar_unavailable_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Gateway served requests with no ML PII coverage ({{ $labels.reason }} / {{ $labels.action }})"
          description: "secureprompt_sidecar_unavailable_total increased by {{ $value | printf \"%.0f\" }} in the last 5 minutes with reason={{ $labels.reason }}. action=degrade_with_alert means requests were answered using the deterministic Rust detection floor ONLY (audit rows carry floor_only = true); action=block means those requests were rejected with 503. Either way the ML sidecar is producing no detection coverage."

      - alert: ClickHouseSchemaStale
        expr: secureprompt_clickhouse_schema_mismatch > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ClickHouse schema is behind the API writer on {{ $labels.instance }}"
          description: "The API's startup schema probe found request_events missing columns it serialises, so EVERY analytics event is being dropped wholesale (all four tables, not just the one with the missing column). ClickHouse migrations are applied by secureprompt-worker at startup — check that the worker is running and has been upgraded to the same version as the API. This is a gauge and clears itself as soon as an insert lands, so no restart is needed once the worker has migrated."

      - alert: BudgetRedisFailure
        expr: increase(secureprompt_budget_redis_failure_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Budget/rate-limit Redis calls are failing"
          description: "secureprompt_budget_redis_failure_total increased by {{ $value | printf \"%.0f\" }} in the last 10 minutes. Budget enforcement may be degraded."

      - alert: PolicyViolationSpike
        expr: sum(rate(secureprompt_policy_violations_total{action="block"}[5m])) > 3 * sum(rate(secureprompt_policy_violations_total{action="block"}[1h] offset 1h))
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Spike in blocked policy violations"
          description: "The rate of blocked policy violations ({{ $value | printf \"%.4f\" }}/s) is more than 3x the rate seen 1 hour ago, sustained for 10 minutes."

      - alert: MLSidecarNotReady
        expr: secureprompt_ml_ready == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ML sidecar is not ready"
          description: "secureprompt_ml_ready has been 0 for 5 minutes on {{ $labels.instance }} — the NER/detection model is not loaded and the gateway is failing open to regex-only detection."

  - name: secureprompt-recording-rules
    rules:
      # Shared p95 request-latency definition used by both this alert file
      # (RequestLatencyHigh could be rewritten in terms of this) and Grafana
      # dashboards, so the two never drift apart.
      - record: secureprompt:request_latency:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(secureprompt_request_duration_seconds_bucket[5m])))

      # KPI-2 DRIFT-01 — self-built rolling baseline for NER confidence
      # drift. Recorded every evaluation_interval so the series accumulates
      # history that the drift alerts below compare against via `offset 7d`.
      # Source metric: secureprompt_ml_ner_confidence_bucket{le,entity_type}
      # (secureprompt-ml/app/metrics.py).
      - record: secureprompt:ner_confidence_p50:1h
        expr: histogram_quantile(0.5, sum by (le, entity_type) (rate(secureprompt_ml_ner_confidence_bucket[1h])))

      # Detection-rate companion series: volume guard for the confidence
      # alert (avoids flapping on low-traffic entity types) and the signal
      # for the volume-drift alert. Source metric:
      # secureprompt_ml_ner_entities_detected_total{entity_type}.
      - record: secureprompt:ner_detection_rate:1h
        expr: sum by (entity_type) (rate(secureprompt_ml_ner_entities_detected_total[1h]))

  - name: secureprompt-drift
    rules:
      - alert: NERConfidenceDrift
        expr: (secureprompt:ner_confidence_p50:1h < 0.85 * (secureprompt:ner_confidence_p50:1h offset 7d)) and (secureprompt:ner_detection_rate:1h > 0.01)
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "NER confidence drift on entity type {{ $labels.entity_type }}"
          description: "The 1h median NER confidence for entity type {{ $labels.entity_type }} is {{ $value | printf \"%.3f\" }}, more than 15% below its value 7 days ago, sustained for 6 hours. This may indicate data drift, model regression, or an upstream extraction change."

      - alert: NERDetectionVolumeDrift
        expr: (secureprompt:ner_detection_rate:1h > 3 * (secureprompt:ner_detection_rate:1h offset 7d) or secureprompt:ner_detection_rate:1h < (secureprompt:ner_detection_rate:1h offset 7d) / 3) and (secureprompt:ner_detection_rate:1h offset 7d > 0.01)
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "NER detection volume drift on entity type {{ $labels.entity_type }}"
          description: "The 1h detection rate for entity type {{ $labels.entity_type }} is {{ $value | printf \"%.4f\" }}/s, more than 3x higher or lower than its value 7 days ago, sustained for 6 hours. This may indicate a distribution shift in what's being detected."
