  /v1/audit-exports:
    get:
      tags: [Governance]
      summary: List audit-trail exports (admin only)
      operationId: listAuditExports
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Recent exports, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditExportSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Governance]
      summary: Request a signed audit-trail export (admin only)
      description: >-
        Asynchronous — returns immediately with a `status_url` to poll. `from`
        is inclusive, `to` is exclusive.
      operationId: createAuditExport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuditExportRequest"
      responses:
        "202":
          description: Export accepted — poll `status_url`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAuditExportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/audit-exports/{id}:
    get:
      tags: [Governance]
