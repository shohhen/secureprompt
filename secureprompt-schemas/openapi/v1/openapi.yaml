  # ── License ───────────────────────────────────────────────────────────────────
  /v1/license:
    get:
      tags: [License]
      summary: Current license status
      description: >-
        `source` says where the active token came from — `db` (activated in
        the console, which wins), `env` (`SECUREPROMPT_LICENSE_TOKEN`), or
        `none`.
      operationId: getLicense
      security:
        - bearerAuth: []
      responses:
        "200":
          description: License status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [License]
      summary: Activate a license token (admin only)
      description: >-
        Verifies, persists and applies the token live — no restart. A DB token
        takes precedence over `SECUREPROMPT_LICENSE_TOKEN`.
      operationId: activateLicense
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateLicenseRequest"
      responses:
        "200":
          description: License activated — the new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [License]
      summary: Remove the stored license token (admin only)
      description: >-
        Clears the DB token. The deployment falls back to
        `SECUREPROMPT_LICENSE_TOKEN` if one is set, otherwise to unlicensed.
      operationId: deleteLicense
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stored token removed — the resulting status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

