    post:
      tags: [Providers]
      summary: Sync the model catalogue from the upstream provider (admin only)
      description: Additive — existing registrations are kept, never deleted.
      operationId: syncProviderModels
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
