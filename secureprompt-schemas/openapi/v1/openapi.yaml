  # ── Two-factor authentication ─────────────────────────────────────────────────
  #
  # WS6-4: these four were served and undocumented. `/enroll`, `/verify` and
  # `/challenge` are NOT bearerAuth — they accept the short-lived purpose
  # tokens `POST /v1/auth/token` hands back with 202 (see TwoFactorPending).
  # `/disable` is the only one behind the session JWT.
  /v1/auth/2fa/enroll:
    post:
      tags: [Auth]
      summary: Begin TOTP enrollment — returns the provisioning URI and backup codes
      description: >-
        Accepts either an `enrollment_token` (from a 202 on
        `POST /v1/auth/token`) or an ordinary session access token, so the
        Settings → Security panel and the forced-enrollment login screen share
        one endpoint. A 409 means the account is already enrolled; the console
        uses that as the "is 2FA on?" probe, because there is no status route.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Enrollment started — show the QR code and the backup codes once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorEnrollResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Already enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Confirm enrollment with the first TOTP code
      description: >-
        Same bearer rules as `/enroll`. On success the account becomes
        two-factor, and the response is the ordinary token pair.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeRequest"
      responses:
        "200":
          description: Enrollment confirmed — access + refresh token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many failed codes — the account is locked for 15 minutes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/auth/2fa/challenge:
    post:
      tags: [Auth]
      summary: Answer a login 2FA challenge with a TOTP or backup code
      description: >-
        The bearer is the `challenge_token` from the 202 on
        `POST /v1/auth/token`, never a session token. A backup code is accepted
        in place of a TOTP code and is consumed on use.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeRequest"
      responses:
        "200":
          description: Challenge cleared — access + refresh token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many failed codes — the account is locked for 15 minutes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >-
            A KMS fault made verification impossible. Distinct from 401 on
            purpose — the code may have been correct, and this does NOT count
            against the lockout counter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Turn off two-factor for the calling user
      description: Requires a session JWT and a currently valid TOTP or backup code.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeRequest"
      responses:
        "200":
          description: Two-factor disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorDisableResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

