openapi: 3.0.3
info:
  title: SecurePrompt Gateway API
  version: "1.0.0"
  description: >
    SecurePrompt is an LLM security gateway that sits between enterprise
    applications and AI providers. It redacts PII/secrets, enforces policy,
    tracks token costs, and provides governance analytics.

    Two auth schemes are used:
    - **JWT** (`Authorization: Bearer eyJ...`) — dashboard routes
    - **API Key** (`Authorization: Bearer sp-...`) — gateway + MCP utility routes
servers:
  - url: http://localhost:8080
    description: Local dev Rust gateway
  - url: https://api.secureprompt.tech
    description: Cloud

tags:
  - name: Auth
    description: JWT login / refresh / logout
  - name: Gateway
    description: OpenAI-compatible proxy endpoints (API key auth)
  - name: MCP
    description: MCP utility endpoints — redact, token estimate, policy check (API key auth)
  - name: Analytics
    description: ClickHouse dbt-mart analytics (JWT auth)
  - name: Requests
    description: Raw request event log with cursor pagination (JWT auth)
  - name: Keys
    description: API key management (JWT auth)
  - name: Providers
    description: LLM provider credential management (JWT auth)
  - name: PolicyRules
    description: Policy rule CRUD (JWT auth)
  - name: Workspaces
    description: Workspace budget management (JWT auth)
  - name: Telemetry
    description: Frontend error reporting (JWT auth)
  - name: Settings
    description: Secure mode + token vault (JWT auth)
  - name: Me
    description: The calling user's own profile and API key (JWT auth)
  - name: Users
    description: Workspace membership and session termination (JWT auth)
  - name: License
    description: License status and activation (JWT auth, admin)
  - name: Governance
    description: >-
      Auditor-facing reports and signed exports: data inventory, leak report,
      audit-trail export (JWT auth, admin)
  - name: Observability
    description: Prometheus metrics endpoint

paths:
  # ── Auth ─────────────────────────────────────────────────────────────────────
  /v1/auth/token:
    post:
      tags: [Auth]
      summary: Issue access + refresh tokens for email/password
      operationId: issueToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "202":
          description: >-
            A second factor is required before tokens are issued. Carries
            either `challenge_token` (enrolled — answer at
            `POST /v1/auth/2fa/challenge`) or `enrollment_token` (must enroll
            — start at `POST /v1/auth/2fa/enroll`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorPending"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh an access token using a refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens issued (refresh-token rotation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current refresh token
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Revoked

  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new workspace and its owner (feature-flagged)
      description: >-
        Creates a workspace and its first owner user in one call and returns
        the same token pair as `POST /v1/auth/token`. Gated by the
        `SECUREPROMPT_PUBLIC_SIGNUP_ENABLED` server env var — 403 when off.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Workspace + owner created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Public signup is disabled on this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Per-IP signup rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Gateway (OpenAI-compatible) ───────────────────────────────────────────────
  /v1/chat/completions:
    post:
      tags: [Gateway]
      summary: Chat completions (OpenAI-compatible)
      description: >
        Proxies to the configured LLM provider after PII redaction and policy
        enforcement. Supports streaming via `stream: true`. Use an API key
        (`sp-...`) in the Authorization header.
      operationId: chatCompletions
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionsRequest"
      responses:
        "200":
          description: >
            OpenAI-compatible chat completion response, or a server-sent event
            stream when `stream: true`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionsResponse"
            text/event-stream:
              schema:
                type: string
                description: "SSE stream of data: {...} chunks"
          headers:
            x-secureprompt-sidecar-degraded:
              $ref: "#/components/headers/SidecarDegraded"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/BudgetExceeded"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SidecarUnavailable"

  /v1/completions:
    post:
      tags: [Gateway]
      summary: Text completions — legacy OpenAI endpoint
      operationId: completions
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionRequest"
      responses:
        "200":
          description: OpenAI-compatible completion response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
          headers:
            x-secureprompt-sidecar-degraded:
              $ref: "#/components/headers/SidecarDegraded"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/BudgetExceeded"
        "503":
          $ref: "#/components/responses/SidecarUnavailable"

  /v1/embeddings:
    post:
      tags: [Gateway]
      summary: Embeddings (OpenAI-compatible)
      operationId: embeddings
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingsRequest"
      responses:
        "200":
          description: OpenAI-compatible embeddings response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          headers:
            x-secureprompt-sidecar-degraded:
              $ref: "#/components/headers/SidecarDegraded"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/BudgetExceeded"
        "503":
          $ref: "#/components/responses/SidecarUnavailable"

  # ── MCP Utilities ─────────────────────────────────────────────────────────────
  /v1/redact:
    post:
      tags: [MCP]
      summary: Redact PII and secrets from text
      description: >
        Runs regex + ML NER detection on the input text, replaces detected
        values with opaque tokens, and returns the redacted text along with
        the detection list. Respects workspace policy rules (may deny or
        further redact). Requires an API key.
      operationId: redact
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedactRequest"
      responses:
        "200":
          description: Redacted text with detection list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedactResponse"
          headers:
            x-secureprompt-sidecar-degraded:
              $ref: "#/components/headers/SidecarDegraded"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/SidecarUnavailable"

  /v1/tokens/estimate:
    post:
      tags: [MCP]
      summary: Estimate token count for a text + model pair
      description: >
        Approximates token count (1 token ≈ 4 characters, GPT-family
        heuristic). No auth required for this endpoint.
      operationId: estimateTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateRequest"
      responses:
        "200":
          description: Token estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateResponse"

  /v1/policy/check:
    post:
      tags: [MCP]
      summary: Dry-run policy evaluation (no provider call)
      description: >
        Evaluates workspace policy rules against the given text without
        making a downstream provider call. Returns whether the request would
        be allowed and which policy events fired. Requires an API key.
      operationId: checkPolicy
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyCheckRequest"
      responses:
        "200":
          description: Policy check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyCheckResponse"
          headers:
            x-secureprompt-sidecar-degraded:
              $ref: "#/components/headers/SidecarDegraded"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/SidecarUnavailable"

  # ── Analytics ─────────────────────────────────────────────────────────────────
  /v1/analytics/usage-daily:
    get:
      tags: [Analytics]
      summary: Daily token and cost usage by workspace and model
      operationId: getUsageDaily
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - in: query
          name: model
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Usage daily rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsageDailyRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/analytics/cost-by-model:
    get:
      tags: [Analytics]
      summary: Daily cost with 7-day and 30-day rolling windows per model
      operationId: getCostByModel
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Cost by model rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CostByModelRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/analytics/latency-pctiles:
    get:
      tags: [Analytics]
      summary: p50/p95/p99 latency + TTFT percentiles by model, daily or hourly
      operationId: getLatencyPctiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - in: query
          name: model
          required: false
          schema:
            type: string
        - in: query
          name: bucket
          required: false
          schema:
            type: string
            enum: [day, hour]
          description: >-
            `day` (the default) returns daily mart rows keyed by `usage_date`;
            `hour` returns intra-day rows keyed by `bucket_ts`, capped at 31
            days to bound the payload.
      responses:
        "200":
          description: >-
            WS6-4 — this was documented as a bare array of daily rows. The
            handler returns `analytics::LatencyPctilesResponse`, a
            `#[serde(tag = "bucket")]` envelope, and always has; the console
            carried a hand-written interface for the real shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatencyPctilesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/analytics/policy-violations:
    get:
      tags: [Analytics]
      summary: Policy rule violation counts by workspace, rule, and day
      operationId: getPolicyViolations
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Policy violations rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyViolationsRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Requests ──────────────────────────────────────────────────────────────────
  /v1/requests:
    get:
      tags: [Requests]
      summary: List gateway requests (cursor-paginated)
      description: >
        Reads raw `request_events` + `policy_events` from ClickHouse.
        Maximum window: 90 days. Maximum page size: 200.
        Pagination: pass `next_cursor` from the previous response as `cursor`.
      operationId: listRequests
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          required: false
          schema:
            type: string
            format: date-time
          description: Start of time window (default now - 7 days; max 90 days ago)
        - in: query
          name: to
          required: false
          schema:
            type: string
            format: date-time
          description: End of time window (default now)
        - in: query
          name: model
          required: false
          schema:
            type: string
        - in: query
          name: has_violation
          required: false
          schema:
            type: boolean
          description: Filter to only requests that triggered at least one policy event
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: Opaque cursor from previous response's `next_cursor`
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Paginated request list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRequestsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/requests/{id}:
    get:
      tags: [Requests]
      summary: Get a single request with policy events
      operationId: getRequest
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Request detail with policy events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── API Keys ──────────────────────────────────────────────────────────────────
  /v1/keys:
    get:
      tags: [Keys]
      summary: List API keys for the workspace
      operationId: listKeys
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of API keys (plaintext never included)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Keys]
      summary: Create a new API key (admin only)
      description: >
        Returns the full plaintext key exactly once in `api_key`.
        Store it immediately — it cannot be retrieved again.
      operationId: createKey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyRequest"
      responses:
        "201":
          description: Key created — plaintext returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateKeyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/keys/{id}:
    delete:
      tags: [Keys]
      summary: Revoke an API key (admin only)
      operationId: revokeKey
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Key revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/keys/{id}/rotate:
    post:
      tags: [Keys]
      summary: Rotate an API key (admin only)
      description: >
        Issues a new key and starts a grace period during which both keys
        are valid. Idempotent within the grace window.
      operationId: rotateKey
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: New key issued — plaintext returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateKeyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Providers ─────────────────────────────────────────────────────────────────
  /v1/providers:
    get:
      tags: [Providers]
      summary: List LLM providers
      operationId: listProviders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of providers (credential never included)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Providers]
      summary: Create a provider (admin only)
      operationId: createProvider
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderRequest"
      responses:
        "201":
          description: Provider created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/providers/{id}:
    put:
      tags: [Providers]
      summary: Update / rotate provider credential (admin only)
      operationId: updateProvider
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProviderRequest"
      responses:
        "200":
          description: Provider updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Providers]
      summary: Delete a provider (admin only)
      operationId: deleteProvider
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Provider deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Policy Rules ──────────────────────────────────────────────────────────────
  /v1/policy-rules:
    get:
      tags: [PolicyRules]
      summary: List policy rules
      operationId: listPolicyRules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of policy rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyRuleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [PolicyRules]
      summary: Create a policy rule (admin only)
      description: >
        Action must be one of: `deny`, `allow`, `redact`, `transform`, `flag`.
        Priority must be unique within the workspace (409 on conflict).
        The rule is immediately indexed in Qdrant for semantic policy lookup.
      operationId: createPolicyRule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleRequest"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRuleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Priority already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriorityConflict"

  /v1/policy-rules/{id}:
    get:
      tags: [PolicyRules]
      summary: Get a single policy rule
      operationId: getPolicyRule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Policy rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRuleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [PolicyRules]
      summary: Update a policy rule (admin only)
      operationId: updatePolicyRule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRuleRequest"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRuleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Priority already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriorityConflict"
    delete:
      tags: [PolicyRules]
      summary: Delete a policy rule (admin only)
      operationId: deletePolicyRule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Rule deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/policy-rules/{id}/enabled:
    patch:
      tags: [PolicyRules]
      summary: Toggle enabled flag on a policy rule (admin only)
      operationId: togglePolicyRuleEnabled
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
