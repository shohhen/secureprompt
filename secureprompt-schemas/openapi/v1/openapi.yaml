openapi: 3.0.3
info:
  title: SecurePrompt Gateway API
  version: "0.1.0-stub"
  description: >
    MINIMAL STUB consumed by Plan 05-02 codegen. Full spec ships with Plan
    05-01 (auth-foundation) in the same wave. This stub pins the types
    05-02 needs to compile; Plan 01's completion will replace this file and
    `pnpm codegen:check` will detect the diff on CI.
servers:
  - url: http://localhost:8080
    description: Local dev Rust gateway
paths:
  /v1/auth/token:
    post:
      summary: Issue access + refresh tokens for email/password
      operationId: issueToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/auth/refresh:
    post:
      summary: Refresh an access token using a refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens issued (refresh-token rotation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Refresh token invalid / replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/auth/logout:
    post:
      summary: Revoke the current refresh token
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Revoked
  /v1/analytics/usage-daily:
    get:
      summary: Daily token and cost usage by workspace and model
      operationId: getUsageDaily
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: workspace_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: model
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Usage daily rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsageDailyRow"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: workspace_id mismatch (IDOR guard)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Mart not populated — run dbt build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/analytics/cost-by-model:
    get:
      summary: Daily cost with 7-day and 30-day rolling windows per model
      operationId: getCostByModel
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: workspace_id
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cost by model rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CostByModelRow"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: workspace_id mismatch (IDOR guard)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Mart not populated — run dbt build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/analytics/policy-violations:
    get:
      summary: Policy rule violation counts by workspace, rule, and day
      operationId: getPolicyViolations
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: workspace_id
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Policy violations rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyViolationsRow"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: workspace_id mismatch (IDOR guard)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Mart not populated — run dbt build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/analytics/latency-pctiles:
    get:
      summary: p50/p95/p99 latency percentiles by model and workspace, daily
      operationId: getLatencyPctiles
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: workspace_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: model
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Latency percentile rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LatencyPctilesRow"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: workspace_id mismatch (IDOR guard)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Mart not populated — run dbt build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/workspaces/{id}/budgets:
    get:
      summary: Read the current workspace budget limits and live usage
      description: >
        Any authenticated workspace member may read budgets. Missing rows
        return defaults (null limits, behavior="warn", 0 usage). Current
        usage is read live from Redis INCRBY counters that the enforcement
        middleware writes to, so the dashboard always mirrors what the
        pipeline sees.
      operationId: getWorkspaceBudget
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Budget snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetResponse"
        "403":
          description: IDOR guard — requester is not in the target workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      summary: Upsert workspace budget limits (admin only)
      operationId: putWorkspaceBudget
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutBudgetRequest"
      responses:
        "200":
          description: Budget updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetResponse"
        "402":
          description: Workspace budget exceeded (enforcement path).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: IDOR guard or non-admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/billing/usage:
    get:
      summary: Get current billing period usage
      tags:
        - Billing
      operationId: getBillingUsage
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing usage for current period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingUsage"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/billing/limits:
    get:
      summary: Get billing limits and remaining allowance
      tags:
        - Billing
      operationId: getBillingLimits
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing limits and remaining allowance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingLimits"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/billing/breakdown:
    get:
      summary: Get billing breakdown by provider and model
      tags:
        - Billing
      operationId: getBillingBreakdown
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing breakdown by provider and model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingBreakdown"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/billing/trends:
    get:
      summary: Get billing trends over time
      tags:
        - Billing
      operationId: getBillingTrends
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing trends by day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingTrends"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/secure-mode:
    get:
      summary: Get secure mode configuration
      tags:
        - Settings
      operationId: getSecureMode
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current secure mode configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecureMode"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      summary: Update secure mode configuration
      tags:
        - Settings
      operationId: putSecureMode
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecureModeRequest"
      responses:
        "200":
          description: Secure mode configuration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecureMode"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/webhooks:
    get:
      summary: List all webhooks
      tags:
        - Settings
      operationId: listWebhooks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of webhooks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookList"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      summary: Create a new webhook
      tags:
        - Settings
      operationId: createWebhook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRequest"
      responses:
        "201":
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/webhooks/{id}:
    delete:
      summary: Delete a webhook
      tags:
        - Settings
      operationId: deleteWebhook
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Webhook deleted
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TokenRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - access_expires_at
        - refresh_expires_at
      properties:
        access_token:
          type: string
          description: Opaque JWT bearer token
        refresh_token:
          type: string
          description: Opaque refresh token (rotated on refresh)
        access_expires_at:
          type: integer
          format: int64
          description: Unix seconds when access_token expires
        refresh_expires_at:
          type: integer
          format: int64
          description: Unix seconds when refresh_token expires
        user:
          type: object
          required: [id, email]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
        workspace_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [admin, member, viewer]
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable error code for machine handling
          example: invalid_credentials
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
    BudgetBehavior:
      type: string
      description: >
        Enforcement behavior when a workspace crosses its limit.
        `block` → HTTP 402 ApiError{code:"budget_exceeded"}.
        `warn`  → 200 + response header `X-SecurePrompt-Budget-Warning:
        daily|monthly`.
        `flag`  → 200 (silent; analytics-only signal).
      enum: [block, warn, flag]
    BudgetResponse:
      type: object
      required: [behavior, updated_at, daily_used, monthly_used]
      properties:
        daily_token_limit:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: Daily token ceiling; null = unlimited.
        monthly_token_limit:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: Monthly token ceiling; null = unlimited.
        behavior:
          $ref: "#/components/schemas/BudgetBehavior"
        updated_at:
          type: string
          format: date-time
        daily_used:
          type: integer
          format: int64
          description: Current UTC-day Redis counter.
        monthly_used:
          type: integer
          format: int64
          description: Current UTC-month Redis counter.
    PutBudgetRequest:
      type: object
      required: [behavior]
      properties:
        daily_token_limit:
          type: integer
          format: int64
          nullable: true
          minimum: 0
        monthly_token_limit:
          type: integer
          format: int64
          nullable: true
          minimum: 0
        behavior:
          $ref: "#/components/schemas/BudgetBehavior"
    UsageDailyRow:
      type: object
      required:
        - workspace_id
        - model
        - usage_date
        - total_input_tokens
        - total_output_tokens
        - total_reasoning_tokens
        - total_cost_usd
        - request_count
        - estimated_request_count
      properties:
        workspace_id:
          type: string
          format: uuid
        model:
          type: string
        usage_date:
          type: string
          format: date
        total_input_tokens:
          type: integer
          format: int64
          minimum: 0
        total_output_tokens:
          type: integer
          format: int64
          minimum: 0
        total_reasoning_tokens:
          type: integer
          format: int64
          minimum: 0
        total_cost_usd:
          type: number
          format: double
        request_count:
          type: integer
          format: int64
          minimum: 0
        estimated_request_count:
          type: integer
          format: int64
          minimum: 0
    CostByModelRow:
      type: object
      required:
        - model
        - usage_date
        - daily_cost_usd
        - daily_request_count
        - rolling_7d_cost_usd
        - rolling_30d_cost_usd
      properties:
        model:
          type: string
        usage_date:
          type: string
          format: date
        daily_cost_usd:
          type: number
          format: double
        daily_request_count:
          type: integer
          format: int64
          minimum: 0
        rolling_7d_cost_usd:
          type: number
          format: double
        rolling_30d_cost_usd:
          type: number
          format: double
    PolicyViolationsRow:
      type: object
      required:
        - workspace_id
        - rule_id
        - rule_name
        - action
        - violation_date
        - violation_count
        - dry_run_count
        - enforced_count
      properties:
        workspace_id:
          type: string
          format: uuid
        rule_id:
          type: string
          format: uuid
        rule_name:
          type: string
        action:
          type: string
        violation_date:
          type: string
          format: date
        violation_count:
          type: integer
          format: int64
          minimum: 0
        dry_run_count:
          type: integer
          format: int64
          minimum: 0
        enforced_count:
          type: integer
          format: int64
          minimum: 0
    LatencyPctilesRow:
      type: object
      required:
        - workspace_id
        - model
        - usage_date
        - p50_latency_ms
        - p95_latency_ms
        - p99_latency_ms
        - sample_count
      properties:
        workspace_id:
          type: string
          format: uuid
        model:
          type: string
        usage_date:
          type: string
          format: date
        p50_latency_ms:
          type: number
          format: double
        p95_latency_ms:
          type: number
          format: double
        p99_latency_ms:
          type: number
          format: double
        sample_count:
          type: integer
          format: int64
          minimum: 0
    BillingUsage:
      type: object
      required:
        - period_start
        - period_end
        - total_tokens
        - total_cost_usd
        - requests_count
      properties:
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        total_tokens:
          type: integer
          format: int64
          minimum: 0
        total_cost_usd:
          type: number
          format: double
          minimum: 0
        requests_count:
          type: integer
          format: int64
          minimum: 0
    BillingLimits:
      type: object
      required: [limit_enforcement]
      properties:
        monthly_token_limit:
          type: integer
          format: int64
          nullable: true
          minimum: 0
        monthly_cost_limit_usd:
          type: number
          nullable: true
          minimum: 0
        tokens_remaining:
          type: integer
          format: int64
          nullable: true
          minimum: 0
        cost_remaining_usd:
          type: number
          nullable: true
          minimum: 0
        limit_enforcement:
          type: string
          enum: [soft, hard]
    BillingBreakdownItem:
      type: object
      required: [provider, model, tokens, cost_usd, requests]
      properties:
        provider:
          type: string
        model:
          type: string
        tokens:
          type: integer
          format: int64
          minimum: 0
        cost_usd:
          type: number
          format: double
          minimum: 0
        requests:
          type: integer
          format: int64
          minimum: 0
    BillingBreakdown:
      type: object
      required: [by_provider]
      properties:
        by_provider:
          type: array
          items:
            $ref: "#/components/schemas/BillingBreakdownItem"
    BillingTrendItem:
      type: object
      required: [date, tokens, cost_usd, requests]
      properties:
        date:
          type: string
          format: date
        tokens:
          type: integer
          format: int64
          minimum: 0
        cost_usd:
          type: number
          format: double
          minimum: 0
        requests:
          type: integer
          format: int64
          minimum: 0
    BillingTrends:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/BillingTrendItem"
    SecureMode:
      type: object
      required:
        - enabled
        - level
        - block_on_pii_detection
        - block_on_injection_detection
        - redact_pii_in_responses
        - updated_at
      properties:
        enabled:
          type: boolean
        level:
          type: string
          enum: [permissive, standard, strict]
        block_on_pii_detection:
          type: boolean
        block_on_injection_detection:
          type: boolean
        redact_pii_in_responses:
          type: boolean
        updated_at:
          type: string
          format: date-time
    SecureModeRequest:
      type: object
      properties:
        enabled:
          type: boolean
        level:
          type: string
          enum: [permissive, standard, strict]
        block_on_pii_detection:
          type: boolean
        block_on_injection_detection:
          type: boolean
        redact_pii_in_responses:
          type: boolean
    Webhook:
      type: object
      required: [id, url, events, enabled, created_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    WebhookRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        secret:
          type: string
          description: Optional HMAC secret
    WebhookList:
      type: object
      required: [webhooks]
      properties:
        webhooks:
          type: array
          items:
            $ref: "#/components/schemas/Webhook"
