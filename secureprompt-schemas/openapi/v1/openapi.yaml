  /v1/data-inventory:
    get:
      tags: [Governance]
      summary: What this deployment stores for the caller's workspace (admin only)
      description: >-
        Per-artifact-class inventory with live row counts, the encryption
        verdict and its basis, and the retention window. Classes that cannot be
        counted per workspace are reported separately with the reason, never
        folded into a zero.
      operationId: getDataInventory
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Data inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataInventory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/leak-report:
    get:
      tags: [Governance]
      summary: What would have leaked in a window, had the gateway not been there (admin only)
      operationId: getLeakReport
      security:
        - bearerAuth: []
