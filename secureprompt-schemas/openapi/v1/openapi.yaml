      operationId: bulkDeleteProviderModels
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteModelsRequest"
      responses:
        "200":
          description: How many registrations were removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteModelsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/providers/{id}/models/{name}:
    delete:
      tags: [Providers]
      summary: Deregister one model (admin only)
      operationId: deleteProviderModel
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Model deregistered
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Token vault ───────────────────────────────────────────────────────────────
  /v1/secure-mode/tokenize:
    post:
      tags: [Settings]
      summary: Replace detected entities in text with vault placeholders
      operationId: tokenizeText
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenizeRequest"
      responses:
        "200":
          description: Tokenized text plus the vault id needed to reverse it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenizeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/secure-mode/detokenize:
    post:
      tags: [Settings]
      summary: Restore original values from vault placeholders
      operationId: detokenizeText
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetokenizeRequest"
      responses:
        "200":
          description: Text with the original values restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetokenizeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/vault/stash:
    post:
      tags: [MCP]
      summary: Stash a placeholder → original mapping for later restoration
      description: >-
        Companion to `POST /v1/redact` for MCP clients that redact locally and
        need the gateway to hold the mapping.
      operationId: vaultStash
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultStashRequest"
      responses:
        "200":
          description: Opaque reference to the stashed mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultStashResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Observability ─────────────────────────────────────────────────────────────
  /metrics:
    get:
      tags: [Observability]
      summary: Prometheus metrics
      description: >
        Prometheus text exposition format. No authentication required.
        Scrape this endpoint with your Prometheus instance.
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus metrics text
          content:
            text/plain:
              schema:
                type: string

  /openapi.json:
    get:
      tags: [Observability]
      summary: OpenAPI spec (JSON)
      description: This spec, served as JSON with CORS headers.
      operationId: getOpenApiSpec
      responses:
        "200":
          description: OpenAPI 3.0 spec
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Dashboard JWT — Authorization: Bearer eyJ..."
    apiKeyAuth:
      type: http
      scheme: bearer
      description: "API key — Authorization: Bearer sp-..."

  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    UserIdPath:
      in: path
      name: user_id
      required: true
      schema:
        type: string
        format: uuid
    SessionIdPath:
      in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
    FromDate:
      in: query
      name: from
      required: true
      schema:
        type: string
        format: date
    ToDate:
      in: query
      name: to
      required: true
      schema:
        type: string
        format: date
    WorkspaceIdQuery:
      in: query
      name: workspace_id
      required: false
      schema:
        type: string
        format: uuid
      description: IDOR guard — must equal the JWT workspace_id when provided

  headers:
    # MR1 review M6: this block was written inline under
    # /v1/chat/completions only, while `with_sidecar_degraded` is applied on
    # /v1/completions and /v1/embeddings, and `sidecar_coverage::enforce`
    # additionally sets it on /v1/redact and /v1/policy/check. Five endpoints
    # carried an undocumented degraded-mode signal. Named here so there is one
    # definition and the enum cannot drift between paths -- the dashboard's TS
    # client is generated from this file by openapi-typescript.
    SidecarDegraded:
      description: >-
        WS2-3. Present only when this answer was produced with the
        deterministic detection floor alone, because the ML sidecar
        produced no (or incomplete) coverage and the workspace's
        `sidecar_unavailable` policy is `degrade_with_alert`. The
        value is the reason. The matching audit row carries
        `floor_only = true`.
      schema:
        type: string
        enum:
          - unconfigured
          - disabled
          - circuit_open
          - all_calls_failed
          - partial_coverage

  responses:
    BadRequest:
      description: Bad request — validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Insufficient role or workspace mismatch
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BudgetExceeded:
      description: Workspace budget exhausted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BudgetExceededError"
    SidecarUnavailable:
      description: >-
        WS2-3. PII detection coverage was unavailable for this request — the
        ML sidecar produced no detections, or scanned only part of a long
        prompt — and the workspace's `sidecar_unavailable` policy is `block`,
        so the prompt was NOT forwarded to the provider. Retry once the
        sidecar is healthy, or set `sidecar_unavailable` to
        `degrade_with_alert` (via `PUT /v1/secure-mode`) to accept answers
        produced with the deterministic detection floor only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    # ── Auth ────────────────────────────────────────────────────────────────────
    TokenRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1

    RegisterRequest:
      type: object
      required: [email, password, workspace_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Globally unique across all workspaces.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: Argon2id-hashed server-side; never persisted in the clear.
        workspace_name:
          type: string
          minLength: 1
          maxLength: 100

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - access_expires_at
        - refresh_expires_at
        - user
        - workspace_id
        - role
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        access_expires_at:
          type: integer
          format: int64
          description: Unix seconds
        refresh_expires_at:
          type: integer
          format: int64
          description: Unix seconds
        user:
          type: object
          required: [id, email]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
        workspace_id:
          type: string
          format: uuid
        role:
          type: string
          # WS6-4: `employee` was absent, so a generated client typed an
          # employee's own login response as impossible. Five variants —
          # `jwt_auth::UserRole`.
          enum: [owner, admin, developer, employee, viewer]

    # ── Gateway ─────────────────────────────────────────────────────────────────
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string

    ChatCompletionsRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          example: gpt-4o
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        stream:
          type: boolean
          default: false
        stream_options:
          type: object
          nullable: true
          properties:
            include_usage:
              type: boolean

    ChatCompletionsResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: "#/components/schemas/ChatMessage"
              finish_reason:
                type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer

    CompletionRequest:
      type: object
      required: [model, prompt]
      properties:
        model:
          type: string
        prompt:
          description: String or array of strings
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        stream:
          type: boolean
          default: false

    EmbeddingsRequest:
      type: object
      required: [model, input]
      properties:
        model:
          type: string
          example: text-embedding-3-small
        input:
          description: String or array of strings
          oneOf:
            - type: string
            - type: array
              items:
                type: string

    # ── MCP ─────────────────────────────────────────────────────────────────────
    RedactRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string

    DetectionItem:
      type: object
      required: [class, value]
      properties:
        class:
          type: string
          example: EMAIL
        value:
          type: string
          example: john@example.com

    RedactResponse:
      type: object
      required: [redacted_text, detections, vault_size]
      properties:
        redacted_text:
          type: string
        detections:
          type: array
          items:
            $ref: "#/components/schemas/DetectionItem"
        vault_size:
          type: integer
          minimum: 0

    EstimateRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        model:
          type: string
          nullable: true

    EstimateResponse:
      type: object
      required: [estimated_tokens, model]
      properties:
        estimated_tokens:
          type: integer
          format: int64
          minimum: 0
        model:
          type: string

    PolicyCheckRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        model:
          type: string
          nullable: true

    PolicyCheckResponse:
      type: object
      required: [allowed, action, events]
      properties:
        allowed:
          type: boolean
        action:
          type: string
          example: deny
        events:
          type: array
          items:
            type: string

    # ── Requests ────────────────────────────────────────────────────────────────
    RequestListItem:
      type: object
      required:
        - request_id
        - workspace_id
        - provider
        - model
        - final_action
        - cost_usd
        - has_violation
        - created_at
        - input_tokens
        - output_tokens
      properties:
        request_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        provider:
          type: string
        model:
          type: string
        final_action:
          type: string
        input_tokens:
          type: integer
          nullable: true
        output_tokens:
          type: integer
          nullable: true
        cost_usd:
          type: number
          format: double
        has_violation:
          type: boolean
        created_at:
          type: string
          format: date-time

    ListRequestsResponse:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RequestListItem"
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null when no more pages

    PolicyEventSummary:
      type: object
      required: [rule_id, rule_name, action, dry_run]
      properties:
        rule_id:
          type: string
          format: uuid
        rule_name:
          type: string
        action:
          type: string
        dry_run:
          type: boolean

    RequestDetail:
      type: object
      required:
        - request_id
        - workspace_id
        - provider
        - model
        - final_action
        - cost_usd
        - created_at
        - policy_events
        - input_tokens
        - output_tokens
        - reasoning_tokens
        - cache_read_tokens
        - cache_write_tokens
        - user_id
        - user_email
        - api_key_id
        - api_key_name
        - ip_address
        - user_agent
        - redacted_prompt
        - restored_response
        - raw_prompt
        - raw_response
        - user_first_name
        - user_last_name
        - user_position
        - user_device_mac
        - source
        - engines
      properties:
        request_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        provider:
          type: string
        model:
          type: string
        final_action:
          type: string
        input_tokens:
          type: integer
          nullable: true
        output_tokens:
          type: integer
          nullable: true
        reasoning_tokens:
          type: integer
          nullable: true
        cache_read_tokens:
          type: integer
          nullable: true
        cache_write_tokens:
          type: integer
          nullable: true
        cost_usd:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
        policy_events:
          type: array
          items:
            $ref: "#/components/schemas/PolicyEventSummary"
        # WS6-4: the sixteen fields below are returned by
        # `routes::dashboard::requests::RequestDetail` and were absent here, so
        # the request-detail drawer read every one of them off a hand-written
        # interface.
        user_id:
          type: string
          format: uuid
          nullable: true
        user_email:
          type: string
          nullable: true
          description: Looked up from `users` at read time.
        api_key_id:
          type: string
          format: uuid
          nullable: true
        api_key_name:
          type: string
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        redacted_prompt:
          type: string
          nullable: true
          description: The latest user message post-redaction, placeholders substituted in.
        restored_response:
          type: string
          nullable: true
          description: What was returned to the client after placeholder restoration.
        raw_prompt:
          type: string
          nullable: true
          description: >-
            Raw user input pre-redaction. Present only for workspaces that
            opted into `capture_raw_content`.
        raw_response:
          type: string
          nullable: true
        user_first_name:
          type: string
          nullable: true
        user_last_name:
          type: string
          nullable: true
        user_position:
          type: string
          nullable: true
        user_device_mac:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
          description: Coarse origin classifier derived from the user-agent.
        engines:
          type: array
          items:
            type: string
          description: >-
            WS2-4 — which detection engines produced coverage for this
            request's prompt. EMPTY for rows written before ClickHouse
            migration 009: that means "not recorded", NOT "no engine ran" —
            the deterministic floor is unconditional.

    # ── Keys ────────────────────────────────────────────────────────────────────
    CreateKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        user_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            When present the key is assigned to that workspace member and its
            plaintext is encrypted at rest so the chat backend can fetch it
            server-to-server. Omit for a legacy unassigned workspace-scoped key.

    KeyResponse:
      type: object
      required:
        - id
        - name
        - prefix
        - created_at
        - revoked_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: First 8 characters of the key (safe to display)
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        assigned_user_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Workspace member this key belongs to. Absent (not null) for legacy
            unassigned workspace-scoped keys — the handler skips the field.

    CreateKeyResponse:
      type: object
      required: [id, name, api_key, prefix, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        api_key:
          type: string
          description: Full plaintext key — shown once, never stored
        prefix:
          type: string
        created_at:
          type: string
          format: date-time
        assigned_user_id:
          type: string
          format: uuid
          nullable: true

    RotateKeyResponse:
      type: object
      required: [new_key, grace_expires_at]
      properties:
        new_key:
          type: string
          description: Plaintext replacement key — shown once
        grace_expires_at:
          type: string
          format: date-time
          description: When the old key expires

    # ── Providers ───────────────────────────────────────────────────────────────
    # WS6-4 — the `config` decision, recorded where the next person edits it.
    #
    # `config` was dropped from these three schemas at some point while
    # `api.gen.ts` was never regenerated, which is why `check-openapi-codegen.sh`
    # sat unwired: regenerating would have deleted
    # `config?: Record<string, unknown>` from the TypeScript types.
    #
    # It is RESTORED, not deleted, because the router is the source of truth and
    # the router has never stopped carrying it:
    #   * `routes::dashboard::providers::{ProviderResponse, CreateProviderRequest,
    #     UpdateProviderRequest, TestConnectionRequest}` all declare `config`;
    #   * `providers::vertex::VertexConfig::from_value` reads `region`/`project`
    #     out of it, and Vertex AI cannot be reached without them;
    #   * the console's `settings/providers/provider-form.tsx` reads
    #     `provider.config.region` / `.project` and posts `config` on create and
    #     on update.
    # Deleting it from the spec would have generated a client that cannot
    # configure Vertex — a product regression dressed as a codegen fix.
    ProviderResponse:
      type: object
      required:
        - id
        - name
        - provider_type
        - has_credential
        - last_rotated_at
        - created_at
        - config
        - models
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider_type:
          type: string
          example: openai
        has_credential:
          type: boolean
          description: True when an encrypted credential is stored
        last_rotated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        config:
          type: object
          additionalProperties: true
          description: >-
            Provider-type-specific settings. Vertex AI uses
            `{ region, project }`; every other provider type ignores it.
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelSummary"
          description: >-
            Models registered for this provider. Empty means the caller should
            fall back to the per-type defaults.

    CreateProviderRequest:
      type: object
      required: [name, provider_type]
      properties:
        name:
          type: string
        provider_type:
          type: string
          example: openai
        credential:
          type: string
          nullable: true
          description: Plaintext API key — encrypted before storage
        config:
          type: object
          additionalProperties: true
          nullable: true
          description: Provider-type-specific settings (Vertex AI's `{ region, project }`).

    UpdateProviderRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        provider_type:
          type: string
          nullable: true
        credential:
          type: string
          nullable: true
          description: New plaintext key; omit to leave existing unchanged
        config:
          type: object
          additionalProperties: true
          nullable: true
          description: Provider-type-specific settings (Vertex AI's `{ region, project }`).

    # ── Policy Rules ─────────────────────────────────────────────────────────────
    PolicyAction:
      type: string
      enum: [deny, allow, redact, transform, flag]

    PolicyRuleResponse:
      type: object
      required:
        - id
        - workspace_id
        - name
        - priority
        - conditions
        - action
        - action_params
        - enabled
        - dry_run
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        priority:
          type: integer
          description: Lower = higher precedence; must be unique per workspace
        conditions:
          type: object
          description: Rule conditions (arbitrary JSON)
        action:
          $ref: "#/components/schemas/PolicyAction"
        action_params:
          type: object
          description: Action parameters (arbitrary JSON)
        enabled:
          type: boolean
        dry_run:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRuleRequest:
      type: object
      required: [name, priority, action]
      properties:
        name:
          type: string
        priority:
          type: integer
        conditions:
          type: object
          nullable: true
        action:
          $ref: "#/components/schemas/PolicyAction"
        action_params:
          type: object
          nullable: true
        enabled:
          type: boolean
          default: true
        dry_run:
          type: boolean
          default: false

    UpdateRuleRequest:
      type: object
      required: [name, priority, action]
      properties:
        name:
          type: string
        priority:
          type: integer
        conditions:
          type: object
          nullable: true
        action:
          $ref: "#/components/schemas/PolicyAction"
        action_params:
          type: object
          nullable: true
        enabled:
          type: boolean
          default: true
        dry_run:
          type: boolean
          default: false

    ToggleRequest:
      type: object
      required: [value]
      properties:
        value:
          type: boolean

    PriorityConflict:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: priority_conflict
        message:
          type: string

    # ── Telemetry ───────────────────────────────────────────────────────────────
    ClientErrorEvent:
      type: object
      required: [component, message, url]
      properties:
        component:
          type: string
          maxLength: 128
        message:
          type: string
          maxLength: 1024
        url:
          type: string
          maxLength: 512
        user_agent:
          type: string
          nullable: true
        context:
          type: object
          nullable: true
          description: Arbitrary structured context; max 2 KB serialized

    # ── Workspaces / Budgets ────────────────────────────────────────────────────
    BudgetBehavior:
      type: string
      enum: [block, warn, flag]
      description: >
        `block` → HTTP 402. `warn` → 200 + `X-SecurePrompt-Budget-Warning` header.
        `flag` → 200, analytics-only.

    BudgetResponse:
      type: object
      required:
        - behavior
        - updated_at
        - daily_used
        - monthly_used
        - daily_token_limit
        - monthly_token_limit
      properties:
        daily_token_limit:
          type: integer
          format: int64
          nullable: true
          minimum: 0
        monthly_token_limit:
          type: integer
          format: int64
          nullable: true
          minimum: 0
        behavior:
