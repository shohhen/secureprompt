    # ── Settings ────────────────────────────────────────────────────────────────
    SecureMode:
      type: object
      required:
        - enabled
        - level
        - block_on_pii_detection
        - block_on_injection_detection
        - redact_pii_in_responses
        - sidecar_unavailable
        - updated_at
        - workspace_id
        - capture_raw_content
        - raw_capture_retention_days
      properties:
        enabled:
          type: boolean
        level:
          type: string
          enum: [permissive, standard, strict]
        block_on_pii_detection:
          type: boolean
        block_on_injection_detection:
          type: boolean
        redact_pii_in_responses:
          type: boolean
        workspace_id:
          type: string
          format: uuid
        sidecar_unavailable:
          type: string
          enum: [block, degrade_with_alert]
          description: >-
            WS2-3. What to do when the ML sidecar produces no detection
            coverage for a request. `block` (the default for any workspace
            that has not chosen) rejects the request with 503 rather than
            forward a prompt the PII detector never saw;
            `degrade_with_alert` proceeds on the deterministic detection
            floor, emits an alert, sets the
            `x-secureprompt-sidecar-degraded` response header, and marks the
            audit row `floor_only = true`.
        capture_raw_content:
          type: boolean
          description: >-
            WS3-1 — whether this workspace retains RAW request content (the
            un-redacted prompt, the un-restored upstream reply, and the reply
            with PII restored). False for every workspace that has not
            explicitly opted in.
        raw_capture_retention_days:
          type: integer
          format: int32
          description: >-
            WS3-2 — days captured content is retained. Meaningless while
            `capture_raw_content` is false, but round-tripped so an admin can
            set the window before switching capture on.
        updated_at:
          type: string
          format: date-time

    SecureModeRequest:
      type: object
      properties:
        enabled:
          type: boolean
        level:
          type: string
          enum: [permissive, standard, strict]
        block_on_pii_detection:
          type: boolean
        block_on_injection_detection:
          type: boolean
        redact_pii_in_responses:
          type: boolean
        sidecar_unavailable:
          type: string
          enum: [block, degrade_with_alert]
        capture_raw_content:
          type: boolean
        raw_capture_retention_days:
          type: integer
          format: int32
          description: Clamped to [1, 3650] server-side rather than rejected.

    # ── Two-factor ──────────────────────────────────────────────────────────────
    TwoFactorPending:
      type: object
      description: >-
        The 202 body of `POST /v1/auth/token` (and of the OIDC callback) when
        the account needs a second factor. Exactly one of the two token fields
        is present: `challenge_token` for an enrolled account,
        `enrollment_token` for one that must enroll before it can log in.
      properties:
        twofa_required:
          type: boolean
        challenge_token:
          type: string
          nullable: true
        enroll_required:
          type: boolean
        enrollment_token:
          type: string
          nullable: true
    TwoFactorCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: A 6-digit TOTP code, or a backup code (dashes optional).
    TwoFactorEnrollResponse:
      type: object
      required: [provisioning_uri, secret_b32, backup_codes]
      properties:
        provisioning_uri:
          type: string
          description: "`otpauth://` URI for the QR code."
        secret_b32:
          type: string
          description: Base32 TOTP secret, for manual entry.
        backup_codes:
          type: array
          items:
            type: string
          description: Single-use recovery codes. Shown once and never again.
    TwoFactorDisableResponse:
      type: object
      required: [disabled]
      properties:
        disabled:
          type: boolean

    # ── Me ──────────────────────────────────────────────────────────────────────
    MyProfile:
      type: object
      required:
        - user_id
        - workspace_id
        - email
        - role
        - display_name
        - first_name
        - last_name
        - position
        - device_mac
      properties:
        user_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        display_name:
          type: string
          description: >-
            "First Last", or the local part of the email while the profile is
            empty. Computed server-side so every surface shows the same name.
        device_mac:
          type: string
          nullable: true
          description: >-
            Self-reported MAC from the Electron desktop wrapper; null for
            browser users.
    UpdateProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
    MyApiKey:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string
          description: Live plaintext credential. Do not log or cache.

    # ── Users / sessions ────────────────────────────────────────────────────────
    UserResponse:
      type: object
      required: [id, workspace_id, email, role, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, developer, employee, viewer]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
        password:
          type: string
          writeOnly: true
        role:
          type: string
          enum: [owner, admin, developer, employee, viewer]
    SessionDto:
      type: object
      required:
        - session_id
        - started_at
        - last_seen_at
        - expires_at
        - is_current
        - client_ip
        - client
      properties:
        session_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: >-
            The last refresh-token rotation. An access token is spent without
            touching Postgres, so this is the freshest evidence of use that
            exists — it is NOT a last-request timestamp.
        expires_at:
          type: string
          format: date-time
        client_ip:
          type: string
          nullable: true
        client:
          type: string
          nullable: true
        is_current:
          type: boolean
          description: True for the session whose access token made this request.
    SessionListResponse:
      type: object
      required: [user_id, sessions]
      properties:
        user_id:
          type: string
          format: uuid
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionDto"
    RevokeSessionsResponse:
      type: object
      required:
        [user_id, revoked_before, refresh_tokens_revoked, audit_id, revoked_at]
      properties:
        user_id:
          type: string
          format: uuid
        revoked_before:
          type: integer
          format: int64
          description: >-
            Unix seconds. Every access token for this user minted at or before
            this second is refused from its next request onward.
        refresh_tokens_revoked:
          type: integer
          format: int64
        audit_id:
          type: string
          format: uuid
        revoked_at:
          type: string
          format: date-time
    EndSessionResponse:
      type: object
      required:
        [
          user_id,
          session_id,
          refresh_tokens_revoked,
          access_tokens_blacklisted,
          audit_id,
          revoked_at,
        ]
      properties:
        user_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        refresh_tokens_revoked:
          type: integer
          format: int64
        access_tokens_blacklisted:
          type: integer
          description: >-
            Already-minted access tokens blacklisted. Zero for a session that
            predates migration 027 and recorded no `jti`; such a session still
            dies, at its own access token's expiry rather than instantly, and
            this number is how a caller can tell.
        audit_id:
          type: string
          format: uuid
        revoked_at:
          type: string
          format: date-time

    # ── License ─────────────────────────────────────────────────────────────────
    LicenseStatus:
      type: object
      required:
        - features
        - status
        - source
        - customer_name
        - lic_id
        - expires_at
      properties:
        customer_name:
          type: string
          nullable: true
        lic_id:
          type: string
          nullable: true
        expires_at:
          type: string
          nullable: true
        features:
          type: array
          items:
            type: string
        status:
          type: string
          # Exhaustive: `routes::license::status_str` is a `const fn` match
          # over the four `LicenseStatus` variants and is the ONLY writer of
          # this field.
          enum: [Valid, Grace, Unlicensed, Revoked]
        source:
          type: string
          enum: [db, env, none]
          description: Where the active token came from. `db` wins over `env`.
    ActivateLicenseRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string

    # ── Governance: data inventory ──────────────────────────────────────────────
    Retention:
      type: object
      required: [window, mechanism, mechanism_detail]
      properties:
        days:
          type: integer
          format: int64
          nullable: true
          description: >-
            Whole days when the window is whole days. Null when there is no
            deletion window at all, or when it is sub-day — `window` always
            carries the human form.
        window:
          type: string
        mechanism:
          type: string
        mechanism_detail:
          type: string
    ShapeVerification:
      type: object
      required: [predicate, rows_matching, rows_not_matching]
      properties:
        predicate:
          type: string
          description: The predicate that was actually run, in words.
        rows_matching:
          type: integer
          format: int64
        rows_not_matching:
          type: integer
          format: int64
    Encryption:
      type: object
      required: [at_rest, basis]
      properties:
        at_rest:
          type: string
        basis:
          type: array
          items:
            type: string
        verification:
          $ref: "#/components/schemas/ShapeVerification"
        note:
          type: string
    GovernedBy:
      type: object
      required: [endpoint, field, role_required, audit_table]
      properties:
        endpoint:
          type: string
        field:
          type: string
        role_required:
          type: string
        audit_table:
          type: string
    ArtifactClass:
      type: object
      required:
        [
          class,
          store,
          location,
          description,
          sensitivity,
          row_count,
          row_count_status,
          encryption,
          retention,
        ]
      properties:
        class:
          type: string
        store:
          type: string
        location:
          type: string
        description:
          type: string
        sensitivity:
          type: string
          enum:
            - user_content
            - derived_metadata
            - credential_material
            - audit_trail
            - configuration
            - operational
        row_count:
          type: integer
          format: int64
          nullable: true
          description: >-
            Live count for this workspace. Null only when the store could not
            answer, in which case `row_count_status` says why — never a guess.
        row_count_status:
          type: string
          enum: [counted, unavailable]
        row_count_detail:
          type: string
        encryption:
          $ref: "#/components/schemas/Encryption"
        retention:
          $ref: "#/components/schemas/Retention"
        governed_by:
          $ref: "#/components/schemas/GovernedBy"
        enabled:
          type: boolean
    UnenumerableClass:
      type: object
      required:
        [
          class,
          store,
          location,
          description,
          reason,
          per_workspace_erasure,
          row_count,
          encryption,
          retention,
        ]
      properties:
        class:
          type: string
        store:
          type: string
        location:
          type: string
        description:
          type: string
        reason:
          type: string
          description: >-
            WHY no per-workspace count is possible — names the mechanism, not
            just the fact.
        per_workspace_erasure:
          type: string
          enum: [not_possible, whole_store_only, not_applicable]
        row_count:
          type: integer
          format: int64
          nullable: true
          description: >-
            Always null. Present rather than omitted so its absence is never
            mistaken for a count of zero.
        encryption:
          $ref: "#/components/schemas/Encryption"
        retention:
          $ref: "#/components/schemas/Retention"
    EncryptionBasis:
      type: object
      required:
        [
          kms_backend,
          kms_self_test,
          kms_self_test_detail,
          provider_key_self_test,
          provider_key_self_test_detail,
          ciphertext_shape_claim,
        ]
      properties:
        kms_backend:
          type: string
        kms_self_test:
          type: string
          enum: [ok, failed]
        kms_self_test_detail:
          type: string
        provider_key_self_test:
          type: string
          enum: [ok, failed]
        provider_key_self_test_detail:
          type: string
        ciphertext_shape_claim:
          type: string
    DataInventory:
      type: object
      required:
        [
          schema_version,
          workspace_id,
          generated_at,
          encryption_basis,
          artifacts,
          not_enumerable,
          caveats,
        ]
      properties:
        schema_version:
          type: integer
        workspace_id:
          type: string
          format: uuid
        generated_at:
          type: string
          format: date-time
        encryption_basis:
          $ref: "#/components/schemas/EncryptionBasis"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactClass"
        not_enumerable:
          type: array
          items:
            $ref: "#/components/schemas/UnenumerableClass"
        caveats:
          type: array
          items:
            type: string

    # ── Governance: leak report ─────────────────────────────────────────────────
    LeakWindow:
      type: object
      required: [from, to, interpretation]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        interpretation:
          type: string
    LeakTotals:
      type: object
      required:
        [
          requests_in_window,
          requests_with_detections,
          entities_detected,
          distinct_classes,
        ]
      properties:
        requests_in_window:
          type: integer
          format: int64
          description: >-
            The DENOMINATOR — every request in the window, detections or not.
            A numerator alone reads as either alarming or trivial.
        requests_with_detections:
          type: integer
          format: int64
        entities_detected:
          type: integer
          format: int64
        distinct_classes:
          type: integer
          format: int64
    ClassCount:
      type: object
      required: [entity_class, entities, requests]
      properties:
        entity_class:
          type: string
        entities:
          type: integer
          format: int64
        requests:
          type: integer
          format: int64
    ModelBreakdown:
      type: object
      required: [model, entities, requests, by_class]
      properties:
        model:
          type: string
        entities:
          type: integer
          format: int64
        requests:
          type: integer
          format: int64
        by_class:
          type: array
          items:
            $ref: "#/components/schemas/ClassCount"
    ActorBreakdown:
      type: object
      required: [user_id, api_key_name, entities, requests, by_class]
      properties:
        user_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Null for a workspace-scoped key never assigned to a member —
            reported as null rather than folded into an "unknown" bucket.
        api_key_name:
          type: string
          nullable: true
        entities:
          type: integer
          format: int64
        requests:
          type: integer
          format: int64
        by_class:
          type: array
          items:
            $ref: "#/components/schemas/ClassCount"
    LeakPlaceholders:
      type: object
      required: [count, status, detail]
      properties:
        count:
          type: integer
          format: int64
          nullable: true
          description: >-
            Always null today. Present rather than omitted so its absence is
            never read as a count of zero.
        status:
          type: string
        detail:
          type: string
    AvailableDimension:
      type: object
      required: [dimension, source, caveat]
      properties:
        dimension:
          type: string
        source:
          type: string
        caveat:
          type: string
    UnavailableDimension:
      type: object
      required: [dimension, reason]
      properties:
        dimension:
          type: string
        reason:
          type: string
    LeakAttribution:
      type: object
      required: [available, unavailable]
      properties:
        available:
          type: array
          items:
            $ref: "#/components/schemas/AvailableDimension"
        unavailable:
          type: array
          items:
            $ref: "#/components/schemas/UnavailableDimension"
    LeakReport:
      type: object
      required:
        [
          schema_version,
          workspace_id,
          generated_at,
          window,
          totals,
          coverage,
          counting_rule,
          placeholders,
          by_class,
          by_model,
          by_actor,
          attribution,
          labels,
          content_policy,
        ]
      properties:
        schema_version:
          type: integer
        workspace_id:
          type: string
          format: uuid
        generated_at:
          type: string
          format: date-time
        window:
          $ref: "#/components/schemas/LeakWindow"
        totals:
          $ref: "#/components/schemas/LeakTotals"
        coverage:
          type: string
        counting_rule:
          type: string
        placeholders:
          $ref: "#/components/schemas/LeakPlaceholders"
        by_class:
          type: array
          items:
            $ref: "#/components/schemas/ClassCount"
        by_model:
          type: array
          items:
            $ref: "#/components/schemas/ModelBreakdown"
        by_actor:
          type: array
          items:
            $ref: "#/components/schemas/ActorBreakdown"
        attribution:
          $ref: "#/components/schemas/LeakAttribution"
        labels:
          type: object
          description: "`locale -> entity_class -> label`, covering exactly the classes in `by_class`."
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        content_policy:
          type: string

    # ── Governance: audit export ────────────────────────────────────────────────
    CreateAuditExportRequest:
      type: object
      required: [from, to, format]
      properties:
        from:
          type: string
          format: date-time
          description: Inclusive lower bound.
        to:
          type: string
          format: date-time
          description: EXCLUSIVE upper bound.
        format:
          type: string
          enum: [csv, jsonl]
        page_size:
          type: integer
          format: int32
          nullable: true
    CreateAuditExportResponse:
      type: object
      required: [export_id, status, status_url, note]
      properties:
        export_id:
          type: string
          format: uuid
        status:
          type: string
        status_url:
          type: string
        note:
          type: string
    AuditExportSummary:
      type: object
      required:
        - export_id
        - status
        - format
        - window_from
        - window_to
        - created_at
        - total_rows
        - total_pages
        - completed_at
      properties:
        export_id:
          type: string
          format: uuid
        status:
          type: string
        format:
          type: string
        window_from:
          type: string
          format: date-time
        window_to:
          type: string
          format: date-time
        total_rows:
          type: integer
          format: int64
          nullable: true
        total_pages:
          type: integer
          format: int32
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    AuditExportDetail:
      type: object
      required:
        - export_id
        - workspace_id
        - status
        - format
        - page_size
        - window_from
        - window_to
        - created_at
        - signature_note
        - total_rows
        - total_pages
        - manifest_json
        - signature_b64
        - public_key_b64
        - signing_key_id
        - error
        - completed_at
        - page_url_template
      properties:
        export_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        status:
          type: string
        format:
          type: string
        page_size:
          type: integer
          format: int32
        window_from:
          type: string
          format: date-time
        window_to:
          type: string
          format: date-time
        total_rows:
          type: integer
          format: int64
          nullable: true
        total_pages:
          type: integer
          format: int32
          nullable: true
        manifest_json:
          type: string
          nullable: true
          description: The exact bytes the signature covers. Null until the export completes.
        signature_b64:
          type: string
          nullable: true
        public_key_b64:
          type: string
          nullable: true
        signing_key_id:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        page_url_template:
          type: string
          nullable: true
        signature_note:
          type: string

    # ── Provider credential testing + model catalogue ───────────────────────────
    ModelSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    AddModelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    TestConnectionRequest:
      type: object
      required: [provider_type, credential]
      properties:
        provider_type:
          type: string
        credential:
          type: string
          writeOnly: true
          description: >-
            Plaintext credential to test. Never logged, never persisted — only
            sent to the upstream provider's list-models endpoint.
        base_url:
          type: string
          nullable: true
        config:
          type: object
          additionalProperties: true
          nullable: true
          description: Same shape as `CreateProviderRequest.config`. Only Vertex reads it today.
    TestConnectionResult:
      type: object
      required:
        - success
        - model_count
        - error
      properties:
        success:
          type: boolean
        model_count:
          type: integer
          format: int32
          nullable: true
        error:
          type: string
          nullable: true
    SyncModelsResponse:
      type: object
      required: [added, kept, total]
      properties:
        added:
          type: array
          items:
            type: string
        kept:
          type: array
          items:
            type: string
        total:
          type: integer
          format: int32
    BulkDeleteModelsRequest:
      type: object
      required: [names]
      properties:
        names:
          type: array
          items:
            type: string
    BulkDeleteModelsResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          format: int64

    # ── Token vault ─────────────────────────────────────────────────────────────
    TokenizeRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        entity_labels:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            When present, only detections whose class (case-insensitive)
            appears here are tokenized.
    TokenizeResponse:
      type: object
      required: [tokenized_text, token_vault_id, entity_counts]
      properties:
        tokenized_text:
          type: string
        token_vault_id:
          type: string
          format: uuid
        entity_counts:
          type: object
          additionalProperties:
            type: integer
            format: int32
    DetokenizeRequest:
      type: object
      required: [token_vault_id, text]
      properties:
        token_vault_id:
          type: string
          format: uuid
        text:
          type: string
    DetokenizeResponse:
      type: object
      required: [text]
      properties:
        text:
          type: string
    VaultStashRequest:
      type: object
      required: [token_map]
      properties:
        token_map:
          type: object
          additionalProperties:
            type: string
    VaultStashResponse:
      type: object
      required: [vault_ref]
      properties:
        vault_ref:
          type: string

    # ── Errors ──────────────────────────────────────────────────────────────────
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message:
              type: string
            type:
              type: string
              example: secureprompt_error
            code:
              type: string
              description: Stable machine-readable code (e.g. budget_exceeded)

    BudgetExceededError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, type]
          properties:
            code:
              type: string
              example: budget_exceeded
            message:
              type: string
            type:
              type: string
              example: secureprompt_error
