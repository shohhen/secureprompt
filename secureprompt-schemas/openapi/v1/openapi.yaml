          description: Leak report for the window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeakReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

