          $ref: "#/components/responses/NotFound"

  /v1/audit-exports/{id}/pages/{page}:
    get:
      tags: [Governance]
      summary: One page of a completed export's rows (admin only)
      description: >-
        The bytes the manifest's per-page digest covers. Content type follows
        the export's `format` — `text/csv` or `application/x-ndjson`.
      operationId: getAuditExportPage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - in: path
          name: page
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: The page, verbatim
          content:
            text/csv:
              schema:
                type: string
            application/x-ndjson:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Provider credential testing + model catalogue ─────────────────────────────
  /v1/providers/test-connection:
    post:
      tags: [Providers]
      summary: Test a credential BEFORE saving it (admin only)
      description: >-
        Probes the upstream provider's list-models endpoint with the supplied
        plaintext credential. Nothing is persisted and nothing is logged.
      operationId: testProviderConnectionUnsaved
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestConnectionRequest"
      responses:
        "200":
          description: >-
            The probe ran. `success: false` with an `error` is a normal
            outcome, not an HTTP failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/providers/{id}/test-connection:
    post:
      tags: [Providers]
      summary: Test the STORED credential of a provider (admin only)
      description: >-
        Decrypts the stored ciphertext through the KMS and probes upstream, so
        rotation and expiry can be verified without ever exposing the plaintext
        to the dashboard.
      operationId: testProviderConnectionStored
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: The probe ran
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

