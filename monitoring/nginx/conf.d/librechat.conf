# =============================================================================
# librechat.conf — TLS termination + reverse proxy for chat.${DOMAIN}
# =============================================================================
#
# Loaded by the `nginx` service in docker-compose.librechat.yml. Listens on
# host port 8443 (mapped 1:1 inside the container) so it does not collide
# with the main SecurePrompt stack's 80/443.
#
# Place TLS certs at:
#   ./monitoring/nginx/certs/chat.fullchain.pem  (cert + intermediate chain)
#   ./monitoring/nginx/certs/chat.privkey.pem    (private key)
#
# For local dev you can drop in a self-signed pair:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout monitoring/nginx/certs/chat.privkey.pem \
#     -out    monitoring/nginx/certs/chat.fullchain.pem \
#     -subj "/CN=chat.localhost"
# =============================================================================

# Optional HTTP→HTTPS redirect on a sibling port. Not required for Phase 1
# (nginx only listens on 8443 for this stack), but documented here so the
# config is easy to extend later:
#
# server {
#     listen 8080;
#     server_name chat.${DOMAIN};
#     return 301 https://$host:8443$request_uri;
# }

server {
    # `reuseport` lets multiple worker processes share the listen socket,
    # improving throughput for SSE/WebSocket fan-out. `http2` enables HTTP/2
    # for the modern LibreChat client.
    listen      8443 ssl reuseport;
    listen [::]:8443 ssl reuseport;
    http2 on;

    # Match the public hostname users type. `_` accepts any host, useful for
    # local development where you may hit https://localhost:8443 directly.
    server_name chat.localhost _;

    # ----- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/chat.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/chat.privkey.pem;

    # Modern profile — TLS 1.2 + 1.3 only, no weak ciphers. Mirrors Mozilla's
    # "intermediate" recommendation as of 2026.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:librechat_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ----- Security headers --------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff"    always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ----- Body size ---------------------------------------------------------
    # LibreChat allows file/image uploads in chats. 25M matches its default
    # upload cap; raise if you bump LibreChat's own limit.
    client_max_body_size 25m;

    # ----- Upstream ----------------------------------------------------------
    # `librechat` resolves via Docker DNS to the LibreChat container on the
    # librechat_default network. Port 3080 matches the PORT env var in compose.
    #
    # We use Docker's embedded DNS server (127.0.0.11) with a runtime variable
    # so nginx defers the lookup to first-request time. Without this nginx
    # would try to resolve `librechat` at config-load and crash if the
    # container isn't up yet (e.g., during `nginx -t` or fast restarts).
    resolver 127.0.0.11 ipv6=off valid=10s;
    location / {
        set $librechat_upstream "librechat:3080";
        proxy_pass http://$librechat_upstream;

        # Standard reverse-proxy headers so LibreChat sees the real client IP
        # and scheme rather than nginx's container address.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # ----- WebSocket / SSE upgrade ---------------------------------------
        # LibreChat streams model output via Server-Sent Events. Without these
        # headers nginx will buffer and the UI feels frozen until completion.
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # ----- SSE / streaming tuning ----------------------------------------
        # Disable response buffering so tokens stream as they arrive from the
        # LLM. `X-Accel-Buffering: no` lets the upstream override per-request.
        proxy_buffering          off;
        proxy_cache              off;
        proxy_request_buffering  off;
        proxy_set_header         X-Accel-Buffering no;

        # ----- Timeouts ------------------------------------------------------
        # Long-running model calls (especially with tools / RAG) can take
        # minutes. 600s = 10 min — generous but not infinite. `proxy_connect`
        # stays short because connection refusal should fail fast.
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ----- Health endpoint ---------------------------------------------------
    # Bypasses LibreChat entirely so nginx can be probed even if the upstream
    # is down. Useful for the host-level load balancer in front of multiple
    # nginx replicas later.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
