name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check --all-targets
        run: cargo check --all-targets
        env:
          SQLX_OFFLINE: "true"

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo clippy
        run: cargo clippy --all-targets
        env:
          SQLX_OFFLINE: "true"

  cross-tenant-tests:
    name: Cross-tenant integration tests (AUTH-05 gate)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secureprompt
          POSTGRES_PASSWORD: secureprompt
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U secureprompt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create non-superuser test runner role
        run: |
          psql postgresql://secureprompt:secureprompt@localhost:5432/postgres <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'secureprompt_runner') THEN
              CREATE ROLE secureprompt_runner
                LOGIN
                PASSWORD 'secureprompt'
                NOSUPERUSER
                CREATEDB
                CREATEROLE
                NOBYPASSRLS;
            END IF;
          END $$;
          GRANT ALL PRIVILEGES ON DATABASE postgres TO secureprompt_runner;
          SQL

      - name: Run cross-tenant tests
        # AUTH-05 gate: these tests fail if RLS or SET LOCAL regresses.
        run: cargo test --test cross_tenant -- --nocapture
        env:
          DATABASE_URL: postgres://secureprompt_runner:secureprompt@localhost:5432/postgres
          RUST_LOG: info

  gateway-phase2-tests:
    name: Gateway Phase 2 integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secureprompt
          POSTGRES_PASSWORD: secureprompt
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U secureprompt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create non-superuser test runner role
        run: |
          psql postgresql://secureprompt:secureprompt@localhost:5432/postgres <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'secureprompt_runner') THEN
              CREATE ROLE secureprompt_runner LOGIN PASSWORD 'secureprompt'
                NOSUPERUSER CREATEDB CREATEROLE NOBYPASSRLS;
            END IF;
          END $$;
          GRANT ALL PRIVILEGES ON DATABASE postgres TO secureprompt_runner;
          SQL

      - name: Run Phase 2 gateway tests
        run: cargo test --test openai_compat --test streaming_redaction --test token_usage_fallback --test provider_fallback --test fuzz_placeholder_boundaries -- --nocapture
        env:
          DATABASE_URL: postgres://secureprompt_runner:secureprompt@localhost:5432/postgres
          RUST_LOG: info

  phase-3-ml-integration:
    name: Phase 3 ML Sidecar Integration (Rust)
    runs-on: ubuntu-latest
    needs: [check]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Phase 3 ML sidecar unit tests (no sidecar required)
        # ML_SIDECAR_URL intentionally absent — tests must pass in regex-only mode (D-13)
        run: cargo test -p secureprompt-api --lib -- ml_sidecar detection::merge --nocapture
        env:
          SQLX_OFFLINE: "true"
          RUST_BACKTRACE: "1"

      - name: Assert ClickHouse async_insert safety settings
        run: |
          grep -q "wait_for_async_insert" secureprompt-api/src/analytics/clickhouse_writer.rs || \
            { echo "FAIL: wait_for_async_insert not found in clickhouse_writer.rs"; exit 1; }
          grep -q "async_insert" secureprompt-api/src/analytics/clickhouse_writer.rs || \
            { echo "FAIL: async_insert not found in clickhouse_writer.rs"; exit 1; }
          echo "OK: ClickHouse async_insert safety settings verified"

      - name: Assert no hardcoded credentials in Grafana dashboard JSON
        run: |
          count=$(grep -r '"password"' monitoring/grafana/dashboards/ | grep -v '""' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "FAIL: Hardcoded password found in Grafana dashboard JSON"
            grep -r '"password"' monitoring/grafana/dashboards/ | grep -v '""'
            exit 1
          fi
          echo "OK: No hardcoded passwords in Grafana dashboard JSON files"

  frontend:
    name: Frontend build + type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secureprompt-web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: secureprompt-web/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXTAUTH_URL: http://localhost:3000

      - name: Type check
        run: pnpm exec tsc --noEmit
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXTAUTH_URL: http://localhost:3000

  ml-sidecar:
    name: Python ML sidecar unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secureprompt-ml
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: secureprompt-ml/requirements.txt

      - name: Install deps (CPU torch only)
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run unit tests (no model download required)
        run: |
          pytest tests/test_batching.py \
                 tests/test_compliance_map.py \
                 tests/test_onnx_flag.py \
                 tests/test_ready.py \
                 tests/test_stateless.py \
                 -v --tb=short
        env:
          ML_SKIP_MODEL_LOAD: "true"
