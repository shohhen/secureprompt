name: Image Budget Check

on:
  push:
    branches:
      - main
    paths:
      - "docker-compose*.yml"
      - "helm/**"
      - "**/Dockerfile"
      - "scripts/check-image-budget.sh"
      - ".github/workflows/image-budget.yml"
  pull_request:
    paths:
      - "docker-compose*.yml"
      - "helm/**"
      - "**/Dockerfile"
      - "scripts/check-image-budget.sh"
      - ".github/workflows/image-budget.yml"

jobs:
  image-budget:
    name: Enforce per-image size budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: docker compose build
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"

      - name: Check image budgets
        shell: bash
        run: bash scripts/check-image-budget.sh

      - name: Report image sizes
        if: always()
        shell: bash
        run: |
          echo "=== Docker image sizes (uncompressed, for reference) ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | grep -E "(secureprompt|sp-agent|REPOSITORY)" || true
