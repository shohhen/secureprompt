name: phase-05-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Gate 1: Rust tests ────────────────────────────────────────────────────
  cargo-test:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # ── Gate 2: Rust Clippy ───────────────────────────────────────────────────
  cargo-clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  # ── Gate 3: Next.js lint ──────────────────────────────────────────────────
  web-lint:
    name: web lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: secureprompt-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: secureprompt-web
      - run: pnpm lint
        working-directory: secureprompt-web

  # ── Gate 4: Next.js unit tests ────────────────────────────────────────────
  web-test:
    name: web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: secureprompt-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: secureprompt-web
      - run: pnpm test --run
        working-directory: secureprompt-web

  # ── Gate 5: Next.js build ─────────────────────────────────────────────────
  web-build:
    name: web build (standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: secureprompt-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: secureprompt-web
      - run: pnpm build
        working-directory: secureprompt-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
      - name: Verify standalone output
        run: test -d secureprompt-web/.next/standalone

  # ── Gate 6: OpenAPI codegen drift ────────────────────────────────────────
  check-openapi-codegen:
    name: openapi codegen (no drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: secureprompt-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: secureprompt-web
      - run: bash scripts/ci/check-openapi-codegen.sh

  # ── Gate 7: Mart-only contract ───────────────────────────────────────────
  check-mart-only:
    name: mart-only contract (DASH-08)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/check-mart-only.sh

  # ── Gate 8: Mart exposure declarations ──────────────────────────────────
  check-mart-exposures:
    name: mart exposures declared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci/check-mart-exposures.mjs

  # ── Gate 9: No dangerouslySetInnerHTML (XSS, POL-05) ────────────────────
  check-no-dangerous-html:
    name: no dangerouslySetInnerHTML (XSS gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/check-no-dangerous-html.sh

  # ── Gate 10: Env hygiene (AUTH-07) ───────────────────────────────────────
  check-env-hygiene:
    name: env hygiene (CHANGEME sentinels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/check-env-hygiene.sh

  # ── Gate 11: Bundle size ─────────────────────────────────────────────────
  check-bundle-size:
    name: docker image bundle size (< 300 MB)
    runs-on: ubuntu-latest
    needs: [cargo-test, web-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build web Docker image
        run: docker build -f secureprompt-web/Dockerfile -t secureprompt/web:local .
      - name: Assert image size
        run: bash scripts/ci/check-bundle-size.sh

  # ── Gate 12: RLS cross-tenant matrix (T-05-05) ───────────────────────────
  rls-matrix:
    name: RLS cross-tenant matrix
    runs-on: ubuntu-latest
    needs: [cargo-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secureprompt
          POSTGRES_PASSWORD: secureprompt
          POSTGRES_DB: secureprompt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cross-tenant matrix test
        run: cargo test -p secureprompt-api dashboard::rls::cross_tenant_matrix
        env:
          DATABASE_URL: postgres://secureprompt:secureprompt@localhost:5432/secureprompt
          REDIS_URL: redis://localhost:6379

  # ── Gate 13: Playwright smoke ─────────────────────────────────────────────
  playwright-smoke:
    name: playwright smoke (5 scenarios)
    runs-on: ubuntu-latest
    needs: [web-build, cargo-test, check-mart-only]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secureprompt
          POSTGRES_PASSWORD: secureprompt
          POSTGRES_DB: secureprompt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: secureprompt-web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: secureprompt-web
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: secureprompt-web
      - name: Run smoke tests
        run: pnpm test:e2e tests/e2e/smoke.spec.ts
        working-directory: secureprompt-web
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "false"
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXTAUTH_SECRET: ci-test-secret-not-real
          NEXTAUTH_URL: http://localhost:3000
          E2E_BACKEND_UNREACHABLE: "true"
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: secureprompt-web/playwright-report/
          retention-days: 7
